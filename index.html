function filterPurchases() {
  return state.purchases.filter(p => {
    if (comprasFilter.setor && p.setor !== comprasFilter.setor) return false;
    if (comprasFilter.status && p.status !== comprasFilter.status) return false;
    if (comprasFilter.q) {
      const q = comprasFilter.q.toLowerCase();
      const hit = [p.descricao,p.fornecedor,p.codigo,p.setor,p.status].some(v => v && String(v).toLowerCase().includes(q));
      if (!hit) return false;
    }
    return true;
  });
}

function renderComprasTable() {
  const filtered = filterPurchases();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / comprasFilter.perPage));
  if (comprasFilter.page > totalPages) comprasFilter.page = totalPages;
  const slice = filtered.slice((comprasFilter.page-1)*comprasFilter.perPage, comprasFilter.page*comprasFilter.perPage);
  document.getElementById('comprasTableBody').innerHTML = renderPurchaseTable(slice, true) + renderPagination(comprasFilter.page, totalPages, p=>{comprasFilter.page=p;renderComprasTable();}, total);
  lucide.createIcons();
}

function renderPurchaseTable(items, withActions) {
  if (!items.length) {
    return `<div class="empty-state"><i data-lucide="inbox"></i><h3>Nenhum registro encontrado</h3><p>Tente ajustar os filtros ou importar dados.</p></div>`;
  }
  return `
    <table class="data">
      <thead><tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Fornecedor</th>
        <th>Setor</th>
        <th>Data</th>
        <th>Valor</th>
        <th>Status</th>
        ${withActions ? '<th></th>' : ''}
      </tr></thead>
      <tbody>
        ${items.map(p => `
          <tr>
            <td><code style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gold-400)">${escapeHtml(p.codigo||'—')}</code></td>
            <td class="cell-strong">${escapeHtml(p.descricao||'—')}</td>
            <td class="cell-mute">${escapeHtml(p.fornecedor||'—')}</td>
            <td><span class="chip">${escapeHtml(p.setor||'—')}</span></td>
            <td class="cell-mute">${fmt.date(p.data)}</td>
            <td class="cell-strong cell-money">${fmt.brl(parseFloat(p.valor)||0)}</td>
            <td><span class="status ${(p.status||'pendente').toLowerCase().replace('í','i').replace('é','e').replace('ó','o')}">${escapeHtml(p.status||'Pendente')}</span></td>
            ${withActions ? `<td style="text-align:right;white-space:nowrap"><button class="row-action" onclick="openPurchaseModal('${p.id}')" title="Editar"><i data-lucide="edit-3"></i></button><button class="row-action" onclick="viewPurchaseHistory('${p.id}')" title="Histórico"><i data-lucide="history"></i></button><button class="row-action" onclick="deletePurchase('${p.id}')" title="Arquivar"><i data-lucide="archive"></i></button></td>` : ''}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderPagination(page, totalPages, onPage, totalItems) {
  if (totalPages <= 1) return `<div class="pagination"><span>${totalItems||0} registro(s)</span></div>`;
  const buttons = [];
  buttons.push(`<button onclick="(${onPage.toString()})(${page-1})" ${page<=1?'disabled':''}><i data-lucide="chevron-left"></i></button>`);
  for (let i=1; i<=totalPages; i++) {
    if (i===1 || i===totalPages || Math.abs(i-page)<=1) {
      buttons.push(`<button class="${i===page?'active':''}" onclick="(${onPage.toString()})(${i})">${i}</button>`);
    } else if (Math.abs(i-page)===2) {
      buttons.push(`<span style="padding:0 4px;color:var(--ink-400)">…</span>`);
    }
  }
  buttons.push(`<button onclick="(${onPage.toString()})(${page+1})" ${page>=totalPages?'disabled':''}><i data-lucide="chevron-right"></i></button>`);
  return `<div class="pagination"><span>${totalItems} registro(s) · página ${page} de ${totalPages}</span><div class="pages">${buttons.join('')}</div></div>`;
}

async function openPurchaseModal(id) {
  const editing = id ? state.purchases.find(p=>p.id===id) : null;
  const data = editing || { codigo: 'CMP-' + (1000 + state.purchases.length), descricao:'', fornecedor:'', setor:'Operacional', valor:'', status:'Pendente', data:new Date().toISOString().slice(0,10), observacoes:'' };
  showModal({
    title: editing ? 'Editar compra' : 'Nova compra',
    body: `
      <div class="form-grid">
        <div class="field"><label>Código</label><input id="m_codigo" value="${escapeHtml(data.codigo)}" /></div>
        <div class="field"><label>Data</label><input id="m_data" type="date" value="${data.data||''}" /></div>
        <div class="field full"><label>Descrição</label><input id="m_descricao" value="${escapeHtml(data.descricao)}" placeholder="Ex.: Toner impressora HP" /></div>
        <div class="field"><label>Fornecedor</label><input id="m_fornecedor" value="${escapeHtml(data.fornecedor)}" /></div>
        <div class="field"><label>Setor</label><select id="m_setor">${SECTORS.map(s=>`<option value="${s}" ${data.setor===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Valor (R$)</label><input id="m_valor" type="number" step="0.01" value="${data.valor||''}" placeholder="0,00" /></div>
        <div class="field"><label>Status</label><select id="m_status">${PURCHASE_STATUS.map(s=>`<option value="${s}" ${data.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field full"><label>Observações</label><textarea id="m_obs" rows="3" placeholder="Observações internas...">${escapeHtml(data.observacoes||'')}</textarea></div>
      </div>
    `,
    onConfirm: async () => {
      const novo = {
        ...data,
        codigo: document.getElementById('m_codigo').value.trim(),
        descricao: document.getElementById('m_descricao').value.trim(),
        fornecedor: document.getElementById('m_fornecedor').value.trim(),
        setor: document.getElementById('m_setor').value,
        valor: parseFloat(document.getElementById('m_valor').value) || 0,
        status: document.getElementById('m_status').value,
        data: document.getElementById('m_data').value,
        observacoes: document.getElementById('m_obs').value.trim(),
      };
      if (!novo.descricao) { toast('Descrição obrigatória','','warning'); return false; }

      if (editing) {
        const changes = {};
        Object.keys(novo).forEach(k => { if (data[k] !== novo[k] && k !== 'historico') changes[k] = { de: data[k], para: novo[k] }; });
        novo.historico = [...(data.historico||[]), { at: new Date().toISOString(), by: state.user.name, action:'atualizado', changes }];
        const idx = state.purchases.findIndex(p=>p.id===editing.id);
        state.purchases[idx] = novo;
        await pushLog('update', `Compra <strong>${novo.codigo}</strong> atualizada`, { id: novo.id, changes });
        toast('Compra atualizada','Histórico de alteração registrado','success');
      } else {
        novo.id = uid();
        novo.criadoPor = state.user.name;
        novo.criadoEm = new Date().toISOString();
        novo.historico = [{ at: new Date().toISOString(), by: state.user.name, action:'criado' }];
        novo._hash = hashRecord({d:novo.descricao,f:novo.fornecedor,s:novo.setor,v:novo.valor});
        state.purchases.unshift(novo);
        await pushLog('create', `Nova compra <strong>${novo.codigo}</strong>: ${novo.descricao}`, { id: novo.id, valor: novo.valor });
        toast('Compra registrada','Registro adicionado ao sistema','success');
      }
      await Storage.set('solys:purchases', state.purchases);
      renderComprasTable();
      updateBadges();
      return true;
    }
  });
}

async function deletePurchase(id) {
  if (!confirm('Arquivar este registro? O dado permanece no histórico permanente.')) return;
  const p = state.purchases.find(x=>x.id===id);
  if (!p) return;
  // Arquivamento lógico — NÃO deleta, marca como arquivado
  p.arquivado = true;
  p.arquivadoEm = new Date().toISOString();
  p.arquivadoPor = state.user.name;
  // Para esta demo, removemos da lista visível mas guardamos em arquivo
  const arquivados = await Storage.get('solys:purchases:arquivo', []);
  arquivados.unshift(p);
  await Storage.set('solys:purchases:arquivo', arquivados);
  state.purchases = state.purchases.filter(x=>x.id!==id);
  await Storage.set('solys:purchases', state.purchases);
  await pushLog('delete', `Compra <strong>${p.codigo}</strong> arquivada`, { id });
  toast('Compra arquivada','O registro permanece no histórico','info');
  renderComprasTable();
  updateBadges();
}

async function changeRequestStatus(id) {
  const r = state.requests.find(x=>x.id===id);
  if (!r) return;
  const idx = PURCHASE_STATUS.indexOf(r.status);
  const next = PURCHASE_STATUS[(idx+1) % PURCHASE_STATUS.length];
  const before = r.status;
  r.status = next;
  await Storage.set('solys:requests', state.requests);
  await pushLog('update', `Solicitação <strong>${r.codigo}</strong> mudou de ${before} para ${next}`, { id });
  toast('Status atualizado',`${before} → ${next}`,'success');
  renderSolicitacoes();
}

async function handleImport(file) {
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  toast('Processando arquivo','Analisando estrutura...','info');

  try {
    if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
      await importSpreadsheet(file, ext);
    } else if (ext === 'pdf') {
      await importPDF(file);
    } else {
      toast('Formato não suportado','Use .xlsx, .csv ou .pdf','error');
    }
  } catch (e) {
    console.error(e);
    toast('Erro ao importar', e.message || 'Falha ao ler o arquivo','error');
  }
}

async function importSpreadsheet(file, ext) {
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type:'array', cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw:false });
  if (!rows.length) { toast('Planilha vazia','Nenhuma linha encontrada','warning'); return; }

  const headers = Object.keys(rows[0]);
  const mapping = autoMapColumns(headers);

  // Preview
  const preview = document.getElementById('importPreview');
  preview.classList.remove('hidden');
  preview.innerHTML = `
    <div class="preview-meta">
      <div class="meta-icon"><i data-lucide="file-spreadsheet"></i></div>
      <div class="meta-text">
        <strong>${escapeHtml(file.name)}</strong>
        <small>${rows.length} linhas · ${headers.length} colunas detectadas</small>
      </div>
    </div>
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title" style="font-size:14px;margin-bottom:10px">Mapeamento detectado automaticamente</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px">
        ${Object.entries(mapping).map(([field,col])=>`
          <div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.02);border-radius:8px">
            <i data-lucide="check-circle" style="width:14px;height:14px;color:${col?'var(--success)':'var(--ink-400)'}"></i>
            <strong style="color:${col?'#fff':'var(--ink-400)'};text-transform:capitalize">${field}:</strong>
            <span class="muted">${col ? escapeHtml(col) : '(não encontrado)'}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn gold" onclick="confirmImport()"><i data-lucide="check"></i>Confirmar importação</button>
      <button class="btn ghost" onclick="document.getElementById('importPreview').classList.add('hidden')"><i data-lucide="x"></i>Cancelar</button>
    </div>
  `;
  lucide.createIcons();

  // Stash para confirmação
  state._pendingImport = { rows, mapping, file, ext, headers };
}

function autoMapColumns(headers) {
  // Detecta colunas por nome aproximado (case insensitive, sem acentos)
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const dict = {
    codigo:     ['codigo','cod','id','numero','num'],
    descricao:  ['descricao','desc','descrip','produto','item','servico','obj','titulo','assunto'],
    fornecedor: ['fornecedor','forn','empresa','vendor','razao','razao social'],
    setor:      ['setor','departamento','depto','area','centro custo'],
    valor:      ['valor','preco','total','vlr','custo','amount'],
    data:       ['data','date','dt','emissao','vencimento'],
    status:     ['status','situacao','estado','condicao'],
    observacoes:['observacao','obs','comentario','nota'],
  };
  const out = {};
  Object.keys(dict).forEach(field => {
    const tokens = dict[field];
    const match = headers.find(h => tokens.some(t => norm(h).includes(t)));
    if (match) out[field] = match;
  });
  return out;
}

async function confirmImport() {
  const pending = state._pendingImport;
  if (!pending) return;

  const { rows, mapping, file, ext } = pending;
  let novos = 0, atualizados = 0, duplicados = 0;

  rows.forEach(row => {
    const rec = {
      codigo: mapping.codigo ? String(row[mapping.codigo]||'').trim() : '',
      descricao: mapping.descricao ? String(row[mapping.descricao]||'').trim() : '',
      fornecedor: mapping.fornecedor ? String(row[mapping.fornecedor]||'').trim() : '',
      setor: mapping.setor ? String(row[mapping.setor]||'Operacional').trim() : 'Operacional',
      valor: mapping.valor ? parseValor(row[mapping.valor]) : 0,
      data: mapping.data ? parseDate(row[mapping.data]) : new Date().toISOString().slice(0,10),
      status: mapping.status ? String(row[mapping.status]||'Pendente').trim() : 'Pendente',
      observacoes: mapping.observacoes ? String(row[mapping.observacoes]||'') : '',
    };

    if (!rec.descricao && !rec.codigo) return; // Linha vazia

    // Normaliza status para conjunto válido
    if (!PURCHASE_STATUS.includes(rec.status)) {
      const found = PURCHASE_STATUS.find(s => s.toLowerCase()===rec.status.toLowerCase());
      rec.status = found || 'Pendente';
    }

    const hash = hashRecord({d:rec.descricao,f:rec.fornecedor,s:rec.setor,v:rec.valor});

    // 1) tenta por código (chave forte)
    let existing = rec.codigo ? state.purchases.find(p=>p.codigo===rec.codigo) : null;
    // 2) fallback: hash
    if (!existing) existing = state.purchases.find(p=>p._hash===hash);

    if (existing) {
      // Atualizar se algo mudou
      const changes = {};
      Object.keys(rec).forEach(k => {
        if (rec[k] && existing[k] !== rec[k]) {
          changes[k] = { de: existing[k], para: rec[k] };
          existing[k] = rec[k];
        }
      });
      if (Object.keys(changes).length) {
        existing.historico = [...(existing.historico||[]), { at: new Date().toISOString(), by: state.user.name, action:'importação', changes }];
        atualizados++;
      } else {
        duplicados++;
      }
    } else {
      const novo = {
        ...rec,
        id: uid(),
        codigo: rec.codigo || ('CMP-' + (1000 + state.purchases.length + novos)),
        criadoPor: state.user.name + ' (importação)',
        criadoEm: new Date().toISOString(),
        importadoDe: file.name,
        _hash: hash,
        historico: [{ at: new Date().toISOString(), by: state.user.name, action:'importado', fonte: file.name }],
      };
      state.purchases.unshift(novo);
      novos++;
    }
  });

  await Storage.set('solys:purchases', state.purchases);

  // Registra documento
  const docMeta = {
    id: uid(),
    name: file.name,
    type: ext,
    size: file.size,
    sizeStr: (file.size / 1024).toFixed(1) + ' KB',
    by: state.user.name,
    at: new Date().toISOString(),
    records: novos,
    updated: atualizados,
    duplicates: duplicados,
    columns: pending.headers,
  };
  state.documents.unshift(docMeta);
  await Storage.set('solys:documents', state.documents);

  await pushLog('import', `Planilha <strong>${file.name}</strong> importada (${novos} novos, ${atualizados} atualizados, ${duplicados} duplicados)`, { file: file.name, novos, atualizados, duplicados });

  toast('Importação concluída', `${novos} novos · ${atualizados} atualizados · ${duplicados} duplicados`, 'success');

  state._pendingImport = null;
  document.getElementById('importPreview').classList.add('hidden');
  updateBadges();
}

function parseValor(v) {
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  // Remove R$, pontos de milhar, troca vírgula por ponto
  const s = String(v).replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseDate(v) {
  if (!v) return new Date().toISOString().slice(0,10);
  if (v instanceof Date) return v.toISOString().slice(0,10);
  // dd/mm/yyyy
  const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let y = m[3].length === 2 ? '20'+m[3] : m[3];
    return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  const d = new Date(v);
  return isNaN(d) ? new Date().toISOString().slice(0,10) : d.toISOString().slice(0,10);
}

async function importPDF(file) {
  // PDF: registramos como documento (extração textual via PDF.js fica como TODO em produção)
  const docMeta = {
    id: uid(),
    name: file.name,
    type:'pdf',
    size: file.size,
    sizeStr: (file.size/1024).toFixed(1) + ' KB',
    by: state.user.name,
    at: new Date().toISOString(),
    records: 0, updated: 0, duplicates: 0,
    columns: [],
  };
  state.documents.unshift(docMeta);
  await Storage.set('solys:documents', state.documents);
  await pushLog('import', `Documento PDF <strong>${file.name}</strong> arquivado`, { file: file.name });
  toast('PDF arquivado','PDF salvo na biblioteca de documentos','success');
}

function renderTimeline() {
  const filtered = state.logs.filter(l => {
    if (histFilter.action && l.action !== histFilter.action) return false;
    if (histFilter.q) {
      const q = histFilter.q.toLowerCase();
      if (!(l.message||'').toLowerCase().includes(q) && !(l.by||'').toLowerCase().includes(q)) return false;
    }
    return true;
  }).slice(0, 200);

  const iconMap = { login:'log-in', logout:'log-out', create:'plus-circle', update:'edit-3', delete:'archive', import:'upload', export:'download', seed:'database' };
  const colorMap = { create:'green', update:'gold', delete:'red', import:'gold', export:'', login:'', logout:'', seed:'' };

  document.getElementById('timelineBody').innerHTML = filtered.length ? filtered.map(l => `
    <div class="tl-item">
      <div class="tl-dot ${colorMap[l.action]||''}"><i data-lucide="${iconMap[l.action]||'circle'}"></i></div>
      <div class="tl-body">
        <div class="tl-title">${l.message}</div>
        <div class="tl-meta">
          <span>${escapeHtml(l.by)} · ${escapeHtml(l.role||'')}</span>
          <span class="dot-sep"></span>
          <span>${fmt.datetime(l.at)}</span>
          <span class="dot-sep"></span>
          <span><code style="font-family:'JetBrains Mono',monospace;font-size:10px">${escapeHtml(l.action)}</code></span>
        </div>
      </div>
    </div>
  `).join('') : '<div class="empty-state"><i data-lucide="history"></i><h3>Sem eventos</h3><p>Nenhum evento corresponde aos filtros.</p></div>';
  lucide.createIcons();
}

function lojaTotalAno(loja) {
  return loja.itens.reduce((s, it) => s + MESES.reduce((a,m)=>a+(it[m]|0),0), 0);

function lojaTotalMes(loja, mes) {
  return loja.itens.reduce((s, it) => s + (it[mes]|0), 0);
}
function mesAtualKey() {
  return MESES[new Date().getMonth()];
}

async function updateLojaCell(lojaId, itemId, field, value) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const it = loja.itens.find(x => x.id === itemId); if (!it) return;
  const oldVal = it[field];
  if (MESES.includes(field)) {
    it[field] = parseInt(value)||0;
  } else {
    it[field] = value;
  }
  if (!it.historico) it.historico = [];
  it.historico.push({ at:new Date().toISOString(), by:state.user?.name||'?', action:`alterou ${field}`, de:oldVal, para:it[field] });
  await Storage.set('solys:lojas', state.lojas);
  // Persiste no Supabase
  if (Cloud.ok()) await Cloud.upsertLojaItem(lojaId, it);
  await pushLog('loja-edit', `${state.user?.name||'?'} alterou ${field} de "${it.descricao}" em ${loja.nome}`, { de:oldVal, para:it[field] });
  // re-render row + footer totals
  const tbody = document.getElementById('lojaTbody');
  if (tbody) {
    // Atualiza só a linha trocada e o footer
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(tr => {
      if (tr.dataset.desc === it.descricao.toLowerCase()) {
        tr.outerHTML = renderLojaRow(lojaId, it);
      }
    });
    // re-render footer
    const tfootCells = document.querySelectorAll('#lojaTable tfoot th');
    if (tfootCells.length >= 14) {
      MESES.forEach((m,i) => { tfootCells[1+i].textContent = lojaTotalMes(loja, m); });
      tfootCells[13].textContent = lojaTotalAno(loja);
    }
    setTimeout(()=>lucide.createIcons(),20);
  }
}

async function saveNewLojaItem(lojaId) {
  const desc = document.getElementById('newItemDesc').value.trim();
  const qtd = parseInt(document.getElementById('newItemQtd').value)||0;
  const obs = document.getElementById('newItemObs').value.trim();
  if (!desc) { toast('Atenção','Descrição é obrigatória','warning'); return; }
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const mNow = mesAtualKey();
  const novo = {
    id: uid(), descricao: desc.toUpperCase(),
    jan:0, fev:0, mar:0, abr:0, mai:0, jun:0, jul:0, ago:0, set:0, out:0, nov:0, dez:0,
    obs, criadoEm:new Date().toISOString(),
    historico: [{ at:new Date().toISOString(), by:state.user?.name||'?', action:'item criado' }],
  };
  novo[mNow] = qtd;
  loja.itens.push(novo);
  await Storage.set('solys:lojas', state.lojas);
  if (Cloud.ok()) await Cloud.upsertLojaItem(lojaId, novo);
  await pushLog('loja-add', `${state.user?.name||'?'} adicionou "${desc}" em ${loja.nome}`, { qtd });
  closeModal();
  toast('Item adicionado', desc, 'success');
  renderLojaDetalhe();
  setTimeout(()=>lucide.createIcons(),50);
}

async function delLojaItem(lojaId, itemId) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const it = loja.itens.find(x => x.id === itemId); if (!it) return;
  if (!confirm(`Excluir "${it.descricao}"? Esta ação não pode ser desfeita.`)) return;
  loja.itens = loja.itens.filter(x => x.id !== itemId);
  await Storage.set('solys:lojas', state.lojas);
  if (Cloud.ok()) await supa.from('loja_itens').delete().eq('id', itemId);
  await pushLog('loja-del', `${state.user?.name||'?'} removeu "${it.descricao}" de ${loja.nome}`);
  toast('Item removido', it.descricao, 'info');
  renderLojaDetalhe();
  setTimeout(()=>lucide.createIcons(),50);
}

async function exportLojaXLSX(lojaId) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const rows = [['DESCRICAO', ...MESES_LABEL, 'TOTAL', 'OBS']];
  loja.itens.forEach(it => {
    const total = MESES.reduce((s,m)=>s+(it[m]|0),0);
    rows.push([it.descricao, ...MESES.map(m=>it[m]|0), total, it.obs||'']);
  });
  rows.push(['TOTAL', ...MESES.map(m=>lojaTotalMes(loja,m)), lojaTotalAno(loja), '']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, loja.nome.slice(0,30));
  XLSX.writeFile(wb, `${loja.nome.replace(/\s+/g,'_')}.xlsx`);
  toast('Exportado', loja.nome+'.xlsx', 'success');
}

async function exportLojasXLSX() {
  const wb = XLSX.utils.book_new();
  // Dashboard
  const dash = [['LOJA','LOCALIDADE','ITENS', ...MESES_LABEL, 'TOTAL ANO']];
  state.lojas.forEach(l => {
    dash.push([l.nome, l.localidade, l.itens.length, ...MESES.map(m=>lojaTotalMes(l,m)), lojaTotalAno(l)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dash), 'DASHBOARD');
  // Uma aba por loja
  state.lojas.forEach(loja => {
    const rows = [['DESCRICAO', ...MESES_LABEL, 'TOTAL', 'OBS']];
    loja.itens.forEach(it => {
      const total = MESES.reduce((s,m)=>s+(it[m]|0),0);
      rows.push([it.descricao, ...MESES.map(m=>it[m]|0), total, it.obs||'']);
    });
    rows.push(['TOTAL', ...MESES.map(m=>lojaTotalMes(loja,m)), lojaTotalAno(loja), '']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), loja.nome.replace('Loja ','').slice(0,30));
  });
  XLSX.writeFile(wb, 'SOLYS_Lojas_completo.xlsx');
  toast('Exportado', 'SOLYS_Lojas_completo.xlsx', 'success');
}

async function setLojaSelecionada(lojaId) {
  if (!state.user) return;
  state.user.lojaPreferida = lojaId;
  const idx = state.users.findIndex(u => u.id === state.user.id);
  if (idx !== -1) { state.users[idx].lojaPreferida = lojaId; await Storage.set('solys:users', state.users); }
}

function pedidosDaLoja(lojaId) {
  return state.pedidos
    .filter(p => p.lojaId === lojaId)
    .sort((a,b) => new Date(b.criadoEm) - new Date(a.criadoEm));
}

/* Constrói o histórico ANO → MÊS → ITENS da loja.
   Combina os pedidos enviados + a planilha SISTEMA_SOLYS_COMPRAS (loja.itens).
   Pedidos vencem em caso de dúvida (somarPedidoNaGradeLoja mantém a grade
   sincronizada com pedidos do ano corrente). */
function historicoAnualLoja(loja){
  if (!loja) return {};
  const anoAtual = new Date().getFullYear();
  const out = {};

  // 1) Pedidos (qualquer ano, agrupados por ano/mês)
  state.pedidos.filter(p => p.lojaId === loja.id).forEach(p => {
    if (!p.data) return;
    const ano = isoToAno(p.data);
    const mes = MESES[isoToMesIdx(p.data)];
    out[ano] = out[ano] || {};
    out[ano][mes] = out[ano][mes] || { itens:{}, pedidos:[] };
    out[ano][mes].pedidos.push(p);
    p.itens.forEach(it => {
      const k = (it.descricao||'').toUpperCase().trim();
      if (!k) return;
      if (!out[ano][mes].itens[k]) out[ano][mes].itens[k] = { descricao:k, quantidade:0, unidade:it.unidade||'un' };
      out[ano][mes].itens[k].quantidade += (it.quantidade|0);
    });
  });

  // 2) Planilha do ano corrente (loja.itens) — usada quando não há pedido naquele mês
  out[anoAtual] = out[anoAtual] || {};
  loja.itens.forEach(it => {
    MESES.forEach(m => {
      const q = it[m]|0;
      if (q <= 0) return;
      out[anoAtual][m] = out[anoAtual][m] || { itens:{}, pedidos:[] };
      const k = (it.descricao||'').toUpperCase().trim();
      // Se já existe via pedido, não duplica
      if (out[anoAtual][m].itens[k]) return;
      out[anoAtual][m].itens[k] = { descricao:k, quantidade:q, unidade:'un' };
    });
  });

  // Garante todos os 12 meses no ano corrente, mesmo vazios
  MESES.forEach(m => {
    if (!out[anoAtual][m]) out[anoAtual][m] = { itens:{}, pedidos:[] };
  });

  return out;
}

// Referência do "mês anterior": último pedido feito pela loja,
// ou, se não houver, os itens do mês anterior no controle mensal da loja
function referenciaMesAnterior(loja) {
  const meus = pedidosDaLoja(loja.id);
  if (meus.length) {
    const ultimo = meus[0];
    return {
      tipo:'pedido',
      pedido: ultimo,
      itens: ultimo.itens.map(i => ({
        descricao: i.descricao,
        quantidade: i.quantidade||1,
        unidade: i.unidade||'un'
      }))
    };
  }
  // fallback: controle mensal da loja (planilha SISTEMA_SOLYS_COMPRAS)
  const mesIdx = new Date().getMonth();
  const prevIdx = (mesIdx + 11) % 12;
  const ordem = [prevIdx];
  for (let i=1;i<12;i++) ordem.push((prevIdx - i + 12) % 12);
  for (const idx of ordem) {
    const m = MESES[idx];
    const itens = loja.itens.filter(it => (it[m]|0) > 0).map(it => ({ descricao: it.descricao, quantidade: it[m]|0, unidade:'un' }));
    if (itens.length) return { tipo:'grid', mesIdx: idx, itens };
  }
  return null;
}

function renderMinhaLista() {
  const c = document.getElementById('content');
  let lojaId = getLojaSelecionada();
  let loja = state.lojas.find(l => l.id === lojaId);

  // Fallback: tenta casar pelo NOME ou CÓDIGO da loja
  // (caso o id salvo na sessão esteja defasado em relação ao seed atual)
  if (!loja && state.user) {
    const nome = (state.user.name||'').trim().toLowerCase();
    const local = (state.user.sector||'').trim().toLowerCase();
    loja = state.lojas.find(l => (l.nome||'').toLowerCase() === nome)
        || state.lojas.find(l => (l.localidade||'').toLowerCase() === local)
        || state.lojas.find(l => (l.codigo||'').toLowerCase() === nome.replace('loja ',''));
    if (loja) {
      state.user.lojaPreferida = loja.id;
      // Atualiza a sessão pra refletir o id correto
      Storage.set('solys:session', { tipo:'loja', lojaId: loja.id, at: new Date().toISOString() });
    }
  }

  if (!loja) {
    const opcoes = state.lojas.map(l =>
      `<button class="login-loja" onclick="entrarComoLoja('${l.id}')" style="width:100%;margin-bottom:8px">
        <div class="login-loja-icon"><i data-lucide="store"></i></div>
        <div style="min-width:0;text-align:left">
          <div class="login-loja-name">${escapeHtml(l.nome.replace('Loja ',''))}</div>
          <div class="login-loja-local">${escapeHtml(l.localidade)}</div>
        </div>
      </button>`
    ).join('');
    c.innerHTML = `
      <div class="page-header"><div><h1 class="page-title">Selecione sua loja</h1><p class="page-sub">Não conseguimos vincular sua sessão a uma loja — escolha abaixo</p></div></div>
      <div class="panel" style="max-width:480px">
        ${opcoes || '<div class="empty-state"><i data-lucide="store"></i><p>Nenhuma loja cadastrada.</p></div>'}
      </div>`;
    setTimeout(()=>lucide.createIcons(),30);
    return;
  }

  const meus = pedidosDaLoja(loja.id);
  const pendentes = meus.filter(p => p.status === 'Pendente');
  const ref = referenciaMesAnterior(loja);

  c.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">${escapeHtml(loja.nome)}</h1>
        <p class="page-sub">
          <i data-lucide="map-pin" style="width:13px;height:13px;display:inline-block;vertical-align:-2px"></i>
          ${escapeHtml(loja.localidade)}
          <button class="link-btn" onclick="trocarLojaColab()" style="margin-left:8px">trocar loja</button>
        </p>
      </div>
      <div class="page-actions">
        <button class="btn gold" onclick="abrirNovoPedido()"><i data-lucide="plus"></i>Fazer novo pedido</button>
      </div>
    </div>

    <!-- HISTÓRICO ANUAL — um painel por ano, 12 meses por painel -->
    ${renderHistoricoAnual(loja)}

    <!-- MEUS PEDIDOS -->
    <div class="panel" style="margin-top:16px">
      <div class="panel-head">
        <div><div class="panel-title">Pedidos da loja</div><div class="panel-sub">${meus.length} pedido(s) · ${pendentes.length} aguardando</div></div>
      </div>
      ${meus.length ? `<div class="ped-grid">${meus.map(p => renderPedidoCardV2(p, {podeEditar:true, modo:'colab'})).join('')}</div>`
        : '<div class="empty-state"><i data-lucide="clipboard-list"></i><p>Nenhum pedido feito ainda.</p></div>'}
    </div>
  `;
  // guarda a referência para "usar como base"
  state._ultimaRef = ref;
}

/* PEDIDO CARD V2 — premium card para o colaborador ver seus pedidos */
function renderPedidoCard(p, podeEditar) {
  return renderPedidoCardV2(p, { podeEditar, modo:'colab' });
}

/* HISTÓRICO ANUAL — renderiza um painel por ano com 12 meses clicáveis.
   O ano corrente fica primeiro e expandido; anos anteriores vêm depois. */
function renderHistoricoAnual(loja){
  const hist = historicoAnualLoja(loja);
  const anoAtual = new Date().getFullYear();
  const mesAtualIdx = new Date().getMonth();
  const anos = Object.keys(hist).map(Number).sort((a,b)=>b-a); // mais recente primeiro
  if (!anos.length) {
    return `<div class="panel"><div class="empty-state"><i data-lucide="package"></i><h3>Sem histórico</h3><p>Esta loja ainda não tem pedidos. Clique em <b>"Fazer novo pedido"</b> para começar.</p></div></div>`;
  }

  state._mesSelLojas = state._mesSelLojas || {};
  state._anoColLojas = state._anoColLojas || {}; // colapso por ano

  return anos.map(ano => {
    const meses = hist[ano] || {};
    const totalAno = MESES.reduce((s,m)=>{
      const it = meses[m]?.itens || {};
      return s + Object.values(it).reduce((a,i)=>a+(i.quantidade||0),0);
    },0);
    const mesesComDados = MESES.filter(m=>{
      const it = meses[m]?.itens || {}; return Object.keys(it).length > 0;
    }).length;
    const selKey = `${loja.id}:${ano}`;
    const colKey = selKey;
    const sel = state._mesSelLojas[selKey]; // mes selecionado
    const collapsed = state._anoColLojas[colKey] === true;
    const isAtual = ano === anoAtual;

    // detalhe do mês selecionado
    let detalheHtml = '';
    if (sel && meses[sel]) {
      const itensObj = meses[sel].itens || {};
      const itensArr = Object.values(itensObj).sort((a,b)=>b.quantidade-a.quantidade);
      const pedidosMes = meses[sel].pedidos || [];
      const totalUn = itensArr.reduce((s,i)=>s+(i.quantidade||0),0);
      detalheHtml = `
        <div class="month-detail">
          <header>
            <div>
              <div class="md-title"><b>${MES_NOME[MESES.indexOf(sel)]} / ${ano}</b> · ${itensArr.length} itens · ${totalUn} un.</div>
              <div class="md-sub">${pedidosMes.length ? `${pedidosMes.length} pedido${pedidosMes.length>1?'s':''} feito${pedidosMes.length>1?'s':''} pela loja` : 'Referência da planilha SISTEMA_SOLYS_COMPRAS'}</div>
            </div>
            ${itensArr.length ? `<button class="btn gold" onclick="abrirPedidoComBaseEmMes('${loja.id}','${ano}','${sel}')"><i data-lucide="copy"></i>Fazer pedido com base neste mês</button>` : ''}
          </header>
          ${itensArr.length ? `
            <div class="ref-grid">
              ${itensArr.map(it => `
                <div class="ref-item">
                  <span class="ref-qtd">${it.quantidade}${it.unidade && it.unidade!=='un' ? ' '+escapeHtml(it.unidade) : ''}</span>
                  <span class="ref-desc">${escapeHtml(it.descricao)}</span>
                </div>
              `).join('')}
            </div>
            ${pedidosMes.length ? `
              <div style="margin-top:14px">
                <div class="muted" style="font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:8px">Pedidos individuais deste mês</div>
                <div class="ped-grid">
                  ${pedidosMes.map(p => renderPedidoCardV2(p, { modo:'colab', podeEditar: p.status==='Pendente' })).join('')}
                </div>
              </div>
            ` : ''}
          ` : `<div class="md-empty">Nenhum item registrado em ${MES_NOME[MESES.indexOf(sel)]} de ${ano}.</div>`}
        </div>
      `;
    }

    return `
      <div class="panel year-panel">
        <header>
          <div class="year-title">
            <h3><i data-lucide="calendar-days" style="width:18px;height:18px;display:inline-block;vertical-align:-3px;color:var(--gold-400)"></i> Histórico ${ano}</h3>
            <span class="yr-badge ${isAtual?'yr-now':''}">${isAtual?'Atual':'Encerrado'}</span>
          </div>
          <span class="year-collapse-btn ${collapsed?'col':''}" onclick="toggleAnoCol('${colKey}')">
            <i data-lucide="chevron-down"></i>
          </span>
        </header>
        <div class="year-panel-body ${collapsed?'collapsed':''}">
          <div class="month-grid">
            ${MESES.map((m,i) => {
              const it = meses[m]?.itens || {};
              const nItens = Object.keys(it).length;
              const isAtualMes = isAtual && i === mesAtualIdx;
              const isSel = sel === m;
              const hasData = nItens > 0;
              const cls = [
                'month-card',
                !hasData ? 'empty' : 'has-data',
                isAtualMes ? 'atual' : '',
                isSel ? 'sel' : ''
              ].filter(Boolean).join(' ');
              return `<div class="${cls}" onclick="selecionarMesLoja('${loja.id}','${ano}','${m}')">
                <div class="mc-name">${MESES_LABEL[i]}</div>
              </div>`;
            }).join('')}
          </div>
          ${detalheHtml}
        </div>
      </div>
    `;
  }).join('');
}

function selecionarMesLoja(lojaId, ano, mes){
  state._mesSelLojas = state._mesSelLojas || {};
  const key = `${lojaId}:${ano}`;
  // Toggle: clicar no mesmo mês fecha o detalhe
  if (state._mesSelLojas[key] === mes) delete state._mesSelLojas[key];
  else state._mesSelLojas[key] = mes;
  renderMinhaLista();
  setTimeout(()=>lucide.createIcons(),30);
}

function toggleAnoCol(colKey){
  state._anoColLojas = state._anoColLojas || {};
  state._anoColLojas[colKey] = !state._anoColLojas[colKey];
  renderMinhaLista();
  setTimeout(()=>lucide.createIcons(),30);
}

function abrirPedidoComBaseEmMes(lojaId, ano, mes){
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) return;
  const hist = historicoAnualLoja(loja);
  const itensObj = hist[ano]?.[mes]?.itens || {};
  const itens = Object.values(itensObj);
  if (!itens.length) { toast('Sem itens','Nada para copiar deste mês','warning'); return; }
  // injeta itens como rascunho e abre o formulário JÁ no mês de origem
  state._pedidoItensBase = itens.map(i => ({
    descricao: i.descricao,
    quantidade: i.quantidade||1,
    unidade: i.unidade||'un'
  }));
  state._mesPedidoBase = MESES.indexOf(mes);
  abrirNovoPedido();
}

/* hash colorista determinístico para avatares de loja */
function lojaColorIdx(lojaId){
  if (!lojaId) return 0;
  let h = 0;
  for (let i=0;i<lojaId.length;i++) h = (h*31 + lojaId.charCodeAt(i)) >>> 0;
  return h % 7;
}

function renderPedidoCardV2(p, opts={}){
  const podeEditar = !!opts.podeEditar;
  const modo = opts.modo || 'gestao'; // 'colab' | 'gestao'
  const totalItens = p.itens.reduce((s,i)=>s+(i.quantidade||0),0);

  // Status define o visual do card inteiro
  const statusKey = (p.status||'Pendente').toLowerCase().replace(/\s+/g,'-');
  const statusCls = 'st-' + statusKey;
  const statusInfo = {
    'Pendente':   { label:'Aguardando aprovação', cls:'b-pendente',  icon:'clock' },
    'Aprovado':   { label:'Aprovado',             cls:'b-aprovado',  icon:'check-circle' },
    'Em compra':  { label:'Em compra',            cls:'b-em-compra', icon:'shopping-cart' },
    'Entregue':   { label:'Entregue',             cls:'b-entregue',  icon:'package-check' },
    'Rejeitado':  { label:'Rejeitado',            cls:'b-rejeitado', icon:'x-circle' },
  }[p.status] || { label:p.status||'—', cls:'b-pendente', icon:'circle' };

  const anexos = (p.anexos||[]);
  const cIdx = lojaColorIdx(p.lojaId);

  // Quick actions diferentes por modo e papel
  let quickActions = '';
  if (modo === 'gestao' && p.status === 'Pendente') {
    quickActions = `<button class="qbtn go" onclick="aprovarRapido('${p.id}')"><i data-lucide="check"></i>Aprovar</button>`;
  } else if (modo === 'gestao' && (p.status === 'Aprovado' || p.status === 'Em compra')) {
    quickActions = `<button class="qbtn go" onclick="marcarEntregue('${p.id}')"><i data-lucide="package-check"></i>Marcar entregue</button>`;
  } else if (modo === 'gestao' && p.status === 'Entregue') {
    quickActions = `<button class="qbtn" onclick="reverterParaAprovado('${p.id}')" title="Voltar para Aprovados"><i data-lucide="undo-2"></i>Reverter</button>`;
  } else if (modo === 'colab' && p.status === 'Pendente') {
    quickActions = `
      <button class="qbtn" onclick="abrirNovoPedido('${p.id}')"><i data-lucide="edit-3"></i>Editar</button>
      <button class="qbtn no" onclick="excluirPedido('${p.id}')"><i data-lucide="trash-2"></i>Excluir</button>
    `;
  } else if (modo === 'colab' && (p.status === 'Aprovado' || p.status === 'Em compra')) {
    quickActions = `<button class="qbtn" onclick="abrirDetalhePedido('${p.id}')"><i data-lucide="eye"></i>Ver detalhes</button>`;
  }
  if (modo === 'gestao') {
    quickActions += `<button class="qbtn" onclick="editarPedidoGestao('${p.id}')" title="Editar"><i data-lucide="edit-3"></i></button>`;
    quickActions += `<button class="qbtn" onclick="baixarPedidoWord('${p.id}')" title="Baixar PDF"><i data-lucide="file-text"></i></button>`;
    quickActions += `<button class="qbtn" onclick="abrirDetalhePedido('${p.id}')" title="Detalhes"><i data-lucide="eye"></i></button>`;
  }

  return `<div class="ped-v2 ${statusCls}">
    <div class="ped-top">
      <div class="ped-store">
        <div class="ped-store-ic c${cIdx}"><i data-lucide="store"></i></div>
        <div style="min-width:0">
          <div class="ped-store-name">${escapeHtml(p.lojaNome||'—')}</div>
          <div class="ped-store-loc">${escapeHtml(p.lojaLocal||'')}</div>
        </div>
      </div>
    </div>

    <div class="ped-tags">
      <span class="status-badge ${statusInfo.cls}"><i data-lucide="${statusInfo.icon}"></i>${statusInfo.label}</span>
      ${anexos.length ? `<span class="anexo-chip"><i data-lucide="paperclip"></i>${anexos.length} anexo${anexos.length>1?'s':''}</span>` : ''}
    </div>

    <div class="ped-meta">
      <span><i data-lucide="calendar"></i>${MES_NOME[isoToMesIdx(p.data)]} / ${isoToAno(p.data)}</span>
      <span class="sep"></span>
      <span><i data-lucide="user"></i>${escapeHtml(p.solicitante)}</span>
      <span class="sep"></span>
      <span><i data-lucide="package"></i>${p.itens.length} itens · ${totalItens} un.</span>
    </div>

    <div class="ped-products">
      <div class="ped-products-h">Produtos solicitados</div>
      <div class="ped-itens-v2">
        ${p.itens.map(it => `<div class="ped-li">
          <span class="qq">${it.quantidade}${it.unidade && it.unidade!=='un' ? ' '+escapeHtml(it.unidade):''}</span>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(it.descricao)}</span>
        </div>`).join('')}
      </div>
    </div>

    ${p.observacao ? `<div class="ped-obs-v2"><i data-lucide="message-square"></i> ${escapeHtml(p.observacao)}</div>` : ''}
    ${p.respostaAdmin ? `<div class="ped-msg"><i data-lucide="corner-down-right"></i> <span><b>Gestão:</b> ${escapeHtml(p.respostaAdmin)}</span></div>` : ''}

    <div class="ped-foot">
      <div class="ped-quick">${quickActions}</div>
      <span class="pedido-foot" style="margin:0">${fmt.ago(p.criadoEm)}</span>
    </div>
  </div>`;
}

/* ---------- Formulário de novo pedido (tela inteira) ---------- */
function abrirNovoPedido(editId) {
  const lojaId = getLojaSelecionada();
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) return;
  const editando = editId ? state.pedidos.find(p => p.id === editId) : null;

  // itens em edição (cópia de trabalho)
  // 1) "Fazer pedido com base neste mês" → traz descrição E quantidade daquele mês
  // 2) Edição → mantém o pedido como estava
  // 3) "Fazer novo pedido" do zero → traz só as descrições da referência, quantidade=0
  if (state._pedidoItensBase && state._pedidoItensBase.length) {
    state._pedidoItens = state._pedidoItensBase.map(i => ({
      descricao: i.descricao,
      quantidade: i.quantidade|0,
      unidade: i.unidade || 'un'
    }));
    state._pedidoItensBase = null;
  } else if (editando) {
    state._pedidoItens = editando.itens.map(i => ({...i}));
  } else {
    const ref = referenciaMesAnterior(loja);
    if (ref && ref.itens && ref.itens.length) {
      state._pedidoItens = ref.itens.map(i => ({
        descricao: i.descricao,
        quantidade: 0,
        unidade: i.unidade || 'un'
      }));
    } else {
      state._pedidoItens = [{ descricao:'', quantidade:0, unidade:'un' }];
    }
  }

  const sugestoes = [...new Set(loja.itens.map(i => i.descricao))].sort();
  const mesAtualIdx = editando ? isoToMesIdx(editando.data)
                    : (state._mesPedidoBase != null ? state._mesPedidoBase : new Date().getMonth());
  state._mesPedidoBase = null;
  const anoAtual = new Date().getFullYear();

  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <div>
        <button class="btn ghost" onclick="renderMinhaLista()" style="margin-bottom:8px"><i data-lucide="arrow-left"></i>Voltar</button>
        <h1 class="page-title">${editando ? 'Editar pedido' : 'Novo pedido'}</h1>
        <p class="page-sub"><i data-lucide="store" style="width:13px;height:13px;display:inline-block;vertical-align:-2px"></i> ${escapeHtml(loja.nome)}</p>
      </div>
    </div>

    <datalist id="sugProdutos">${sugestoes.map(s=>`<option value="${escapeHtml(s)}"></option>`).join('')}</datalist>

    <div class="panel" style="max-width:920px">
      <div class="form-row-2">
        <div>
          <label class="fld-label">Para o mês de</label>
          <select id="pedMes" class="fld">
            ${MESES.map((m,i) => `<option value="${i}" ${i===mesAtualIdx?'selected':''}>${MES_NOME[i]} / ${anoAtual}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="fld-label">Quem está solicitando</label>
          <input type="text" id="pedSolic" class="fld" placeholder="Seu nome" value="${editando ? escapeHtml(editando.solicitante) : escapeHtml(state.user?.solicitante || '')}" />
        </div>
      </div>

      <div style="margin-top:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <label class="fld-label" style="margin:0">Produtos do pedido <span style="font-size:10.5px;color:var(--ink-400);font-weight:400">(preencha a quantidade que precisa)</span></label>
          <button class="btn sm" onclick="addLinhaPedido()"><i data-lucide="plus"></i>Adicionar produto</button>
        </div>
        <div id="pedItens"></div>
      </div>

async function salvarPedido(editId) {
  const mesIdx = parseInt(document.getElementById('pedMes')?.value);
  const solic = document.getElementById('pedSolic').value.trim();
  const obs = document.getElementById('pedObs').value.trim();
  // Só entram itens com quantidade > 0
  const itens = state._pedidoItens
    .filter(it => it.descricao.trim() && (it.quantidade|0) > 0)
    .map(it => ({ descricao: it.descricao.trim().toUpperCase(), quantidade: it.quantidade|0, unidade: (it.unidade||'un').trim() }));

  if (!solic) { toast('Atenção','Informe quem está solicitando','warning'); return; }
  if (isNaN(mesIdx)) { toast('Atenção','Escolha o mês do pedido','warning'); return; }
  if (!itens.length) { toast('Atenção','Preencha a quantidade de pelo menos um produto','warning'); return; }

  // monta a data como o primeiro dia do mês escolhido (ano corrente)
  const ano = new Date().getFullYear();
  const data = `${ano}-${String(mesIdx+1).padStart(2,'0')}-01`;

  const lojaId = getLojaSelecionada();
  const loja = state.lojas.find(l => l.id === lojaId);
  const anexos = state._pedidoAnexos || [];

  if (editId) {
    const p = state.pedidos.find(x => x.id === editId);
    if (!p || p.status !== 'Pendente') { toast('Não é possível editar','Pedido já processado','warning'); return; }
    Object.assign(p, { data, solicitante:solic, itens, observacao:obs, anexos });
    p.historico = p.historico || [];
    p.historico.push({ at:new Date().toISOString(), by:solic, action:'editado' });
    if (Cloud.ok()) await Cloud.updatePedido(p.id, { data, solicitante:solic, itens, observacao:obs, anexos, historico:p.historico });
    await pushLog('pedido-edit', `Pedido de ${loja.nome} editado por ${solic}`, { itens: itens.length });
    toast('Pedido atualizado','', 'success');
  } else {
    const rascunho = {
      lojaId, lojaNome: loja.nome, lojaLocal: loja.localidade,
      data, solicitante: solic, itens, observacao: obs, anexos,
      status: 'Pendente',
      criadoEm: new Date().toISOString(),
      historico: [{ at:new Date().toISOString(), by:solic, action:'criado' }],
    };
    let novo = null;
    if (Cloud.ok()) {
      novo = await Cloud.insertPedido(rascunho);
    }
    if (!novo) { novo = { ...rascunho, id: uid() }; }
    state.pedidos.unshift(novo);
    // HISTÓRICO: soma as quantidades na grade mensal da loja (mês do pedido)
    await somarPedidoNaGradeLoja(loja, itens, data);
    await pushLog('pedido-novo', `${loja.nome}: novo pedido de ${solic} (${itens.length} itens) · ${MES_NOME[mesIdx]}`, { data });
    toast('Pedido enviado','A diretoria foi notificada em tempo real','success');
  }
  await Storage.set('solys:pedidos', state.pedidos);
  updateBadges();
  renderMinhaLista();
  setTimeout(()=>lucide.createIcons(),50);
}

/* Soma cada item do pedido na grade mensal da loja (mês da data do pedido).
   Se o item ainda não existe na grade, cria. Isso faz com que a planilha
   SISTEMA_SOLYS_COMPRAS reflita automaticamente todos os pedidos enviados. */
async function somarPedidoNaGradeLoja(loja, itens, data){
  if (!loja || !itens?.length) return;
  const mesIdx = isoToMesIdx(data);
  const mesKey = MESES[mesIdx];

  for (const it of itens) {
    const desc = (it.descricao||'').trim().toUpperCase();
    if (!desc) continue;
    // Atualiza local imediatamente (UX rápido)
    let existente = loja.itens.find(x => (x.descricao||'').trim().toUpperCase() === desc);
    if (!existente) {
      existente = {
        id: uid(), descricao: desc,
        jan:0,fev:0,mar:0,abr:0,mai:0,jun:0,jul:0,ago:0,set:0,out:0,nov:0,dez:0,
        obs:'',
        criadoEm: new Date().toISOString(),
        historico: []
      };
      loja.itens.push(existente);
    }
    existente[mesKey] = (existente[mesKey]|0) + (it.quantidade|0);
    // Persiste no Supabase
    if (Cloud.ok()) await Cloud.incLojaItemMes(loja.id, desc, mesKey, it.quantidade|0);
  }
  await Storage.set('solys:lojas', state.lojas);
}

  p.historico.push({ at:new Date().toISOString(), by:state.user.name, action:`status: ${antigo} → ${novo}` });

/* BAIXAR Word — documento corporativo padronizado (Word/LibreOffice) */
function baixarPedidoWord(id){
  // Mantém o nome da função pra preservar todas as chamadas existentes,
  // mas agora gera PDF real (jsPDF) em vez de Word.
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  const { jsPDF } = window.jspdf;
  const mes = MES_NOME[isoToMesIdx(p.data)];
  const ano = isoToAno(p.data);
  const mesIdx = isoToMesIdx(p.data);
  const totalUn = p.itens.reduce((s,i)=>s+(i.quantidade||0),0);
  const proto = `SOL-${ano}-${String(mesIdx+1).padStart(2,'0')}-${(p.id||'').replace(/-/g,'').slice(-6).toUpperCase()}`;
  const dataEmissao = new Date(p.criadoEm).toLocaleDateString('pt-BR');
  const horaEmissao = new Date(p.criadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const lojaAtual = state.lojas.find(l => l.id === p.lojaId);
  const enderecoCompleto = (lojaAtual?.endereco || p.lojaLocal || '—');
  const movs = (p.historico||[]).filter(h => (h.action||'').includes('→')).slice(-5);

  // Cores institucionais
  const NAVY = [10, 61, 124];
  const GOLD = [193, 148, 56];
  const DARK = [17, 24, 39];
  const MUTED = [107, 114, 128];
  const LIGHT = [245, 247, 250];
  const GREY = [213, 220, 230];

  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  const W = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const M = 18;

  // === CABEÇALHO ===
  doc.setFillColor(...NAVY);
  doc.rect(0, 0, W, 28, 'F');
  // faixa dourada
  doc.setFillColor(...GOLD);
  doc.rect(0, 28, W, 1.5, 'F');

  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(20);
  doc.text('SOLYS', M, 14);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(...GOLD);
  doc.text('LOGÍSTICA DE COMPRAS', M, 19);

  // Lado direito do header
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.text('PEDIDO DE COMPRAS', W - M, 12, { align: 'right' });
  doc.setFont('courier', 'normal');
  doc.setFontSize(9);
  doc.text(`Nº ${proto}`, W - M, 17, { align: 'right' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.text(`Emitido em ${dataEmissao} às ${horaEmissao}`, W - M, 21, { align: 'right' });

  let y = 38;

  // === SEÇÃO: DADOS DO PEDIDO ===
  const drawSection = (title) => {
    doc.setFillColor(...LIGHT);
    doc.rect(M, y, W - M*2, 7, 'F');
    doc.setFillColor(...GOLD);
    doc.rect(M, y, 1.5, 7, 'F');
    doc.setTextColor(...NAVY);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(9);
    doc.text(title.toUpperCase(), M + 4, y + 4.8);
    y += 11;
  };

  drawSection('Dados do Pedido');
  const info = [
    ['Unidade Solicitante', p.lojaNome || '—'],
    ['Endereço',            enderecoCompleto],
    ['Solicitante',         p.solicitante || '—'],
    ['Mês de Referência',   `${mes} de ${ano}`],
    ['Data de Emissão',     `${dataEmissao} às ${horaEmissao}`],
    ['Situação',            p.status || '—'],
  ];
  doc.setFontSize(10);
  for (const [k, v] of info) {
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(...MUTED);
    doc.text(`${k}:`, M, y);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(...DARK);
    const lines = doc.splitTextToSize(String(v), W - M - 60);
    doc.text(lines, M + 50, y);
    y += Math.max(5.5, lines.length * 5.5);
  }
  y += 4;

  // === SEÇÃO: PRODUTOS ===
  drawSection('Relação de Produtos');
  doc.autoTable({
    startY: y,
    margin: { left: M, right: M },
    head: [['Item', 'Qtd.', 'Un.', 'Descrição do Produto']],
    body: p.itens.map((it, i) => [
      String(i + 1).padStart(2, '0'),
      String(it.quantidade),
      it.unidade || 'un',
      it.descricao,
    ]),
    foot: [[
      '',
      { content: String(totalUn), styles: { halign: 'center', textColor: GOLD, fontStyle: 'bold' } },
      '',
      { content: `Total de unidades · ${p.itens.length} produto${p.itens.length > 1 ? 's' : ''}`,
        styles: { fontStyle: 'bold', textColor: NAVY } },
    ]],
    styles: {
      font: 'helvetica', fontSize: 9, cellPadding: 2.8,
      lineColor: GREY, lineWidth: 0.1, textColor: DARK,
    },
    headStyles: {
      fillColor: NAVY, textColor: 255, fontStyle: 'bold',
      halign: 'left', cellPadding: 3, fontSize: 8.5,
    },
    footStyles: { fillColor: LIGHT, lineWidth: { top: 0.5 } },
    columnStyles: {
      0: { halign: 'center', cellWidth: 14, textColor: MUTED },
      1: { halign: 'center', cellWidth: 16, fontStyle: 'bold' },
      2: { halign: 'center', cellWidth: 14, textColor: MUTED },
      3: { halign: 'left' },
    },
    alternateRowStyles: { fillColor: [249, 250, 252] },
  });
  y = doc.lastAutoTable.finalY + 6;

  // === OBSERVAÇÕES ===
  if (p.observacao) {
    drawSection('Observações');
    doc.setFillColor(255, 251, 235);
    doc.setDrawColor(...GOLD);
    const obsLines = doc.splitTextToSize(p.observacao, W - M*2 - 6);
    const obsH = Math.max(10, obsLines.length * 5 + 4);
    doc.rect(M, y, W - M*2, obsH, 'F');
    doc.setLineWidth(1.5);
    doc.line(M, y, M, y + obsH);
    doc.setLineWidth(0.1);
    doc.setFont('helvetica', 'italic');
    doc.setTextColor(...DARK);
    doc.setFontSize(10);
    doc.text(obsLines, M + 4, y + 6);
    y += obsH + 5;
  }

  // === RESPOSTA ===
  if (p.respostaAdmin) {
    drawSection('Resposta da Diretoria');
    doc.setFillColor(239, 246, 255);
    doc.setDrawColor(46, 116, 201);
    const respLines = doc.splitTextToSize(p.respostaAdmin, W - M*2 - 6);
    const respH = Math.max(14, respLines.length * 5 + 8);
    doc.rect(M, y, W - M*2, respH, 'F');
    doc.setLineWidth(1.5);
    doc.line(M, y, M, y + respH);
    doc.setLineWidth(0.1);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(8);
    doc.setTextColor(46, 116, 201);
    doc.text((p.respondidoPor || 'Diretoria').toUpperCase(), M + 4, y + 5);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10);
    doc.setTextColor(...DARK);
    doc.text(respLines, M + 4, y + 10);
    y += respH + 5;
  }

  // === HISTÓRICO ===
  if (movs.length) {
    if (y > H - 60) { doc.addPage(); y = M; }
    drawSection('Histórico de Tramitação');
    doc.autoTable({
      startY: y,
      margin: { left: M, right: M },
      head: [['Quando', 'Por', 'Ação']],
      body: movs.slice().reverse().map(h => [
        fmt.datetime(h.at), h.by, h.action,
      ]),
      styles: { font: 'helvetica', fontSize: 8.5, cellPadding: 2.5, textColor: DARK, lineColor: GREY, lineWidth: 0.1 },
      headStyles: { fillColor: LIGHT, textColor: NAVY, fontStyle: 'bold', fontSize: 8 },
    });
    y = doc.lastAutoTable.finalY + 6;
  }

  // === ASSINATURAS (no rodapé) ===
  const signY = H - 38;
  if (y < signY - 6) y = signY;
  doc.setDrawColor(...DARK);
  doc.setLineWidth(0.3);
  const colW = (W - M*2 - 14) / 2;
  doc.line(M, signY, M + colW, signY);
  doc.line(M + colW + 14, signY, W - M, signY);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(...DARK);
  doc.text(p.solicitante || '', M + colW / 2, signY + 5, { align: 'center' });
  doc.text(p.respondidoPor || '', M + colW + 14 + colW / 2, signY + 5, { align: 'center' });
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(8);
  doc.setTextColor(...MUTED);
  doc.text(`Solicitante — ${p.lojaNome || ''}`, M + colW / 2, signY + 10, { align: 'center' });
  doc.text('Diretoria — SOLYS', M + colW + 14 + colW / 2, signY + 10, { align: 'center' });

  // === RODAPÉ ===
  doc.setDrawColor(...GREY);
  doc.setLineWidth(0.2);
  doc.line(M, H - 12, W - M, H - 12);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(7.5);
  doc.setTextColor(...MUTED);
  doc.text('SOLYS · Logística de Compras · ' + new Date().toLocaleString('pt-BR'), W / 2, H - 8, { align: 'center' });
  doc.setFont('courier', 'normal');
  doc.text(proto, W / 2, H - 5, { align: 'center' });

  const cleanName = (p.lojaNome || 'loja').replace(/[^a-zA-Z0-9]+/g, '_');
  doc.save(`${proto}_${cleanName}.pdf`);
  toast('PDF gerado', `${proto}.pdf`, 'success');
}

/* Move pedidos entregues há mais de 20 dias para o status 'Arquivado'. */
async function arquivarEntreguesAntigos(){
  const limite = Date.now() - 20*86400*1000;
  const arquivar = [];
  for (const p of state.pedidos) {
    if (p.status !== 'Entregue') continue;
    const movEntregue = (p.historico||[]).slice().reverse().find(h => (h.action||'').includes('→ Entregue'));
    const refDate = movEntregue ? new Date(movEntregue.at).getTime() : new Date(p.criadoEm).getTime();
    if (refDate < limite) arquivar.push(p);
  }
  if (!arquivar.length) return;
  for (const p of arquivar) {
    p.status = 'Arquivado';
    p.historico = p.historico || [];
    p.historico.push({ at:new Date().toISOString(), by:'Sistema', action:'status: Entregue → Arquivado (20d)' });
    if (Cloud.ok()) await Cloud.updatePedido(p.id, { status:'Arquivado', historico: p.historico });
  }
  state.pedidos = state.pedidos.filter(p => p.status !== 'Arquivado');
  await Storage.set('solys:pedidos', state.pedidos);
  await pushLog('pedido-arq', `${arquivar.length} pedido(s) entregue há mais de 20 dias foram arquivados`);
}

function doSearch(q) {
  const el = document.getElementById('searchResults');
  if (!q.trim()) { el.innerHTML = '<div class="empty-state"><i data-lucide="search"></i><h3>Comece a digitar</h3><p>Os resultados aparecerão em tempo real.</p></div>'; lucide.createIcons(); return; }
  const ql = q.toLowerCase();
  const matchPurchases = state.purchases.filter(p => [p.codigo,p.descricao,p.fornecedor,p.setor,p.status,String(p.valor)].some(v=>v && String(v).toLowerCase().includes(ql))).slice(0,12);
  const matchRequests = state.requests.filter(r => [r.codigo,r.titulo,r.solicitante,r.setor,r.status].some(v=>v && String(v).toLowerCase().includes(ql))).slice(0,8);
  const matchDocs = state.documents.filter(d => d.name.toLowerCase().includes(ql)).slice(0,6);
  const matchLogs = state.logs.filter(l => (l.message||'').toLowerCase().includes(ql) || (l.by||'').toLowerCase().includes(ql)).slice(0,10);
  const total = matchPurchases.length + matchRequests.length + matchDocs.length + matchLogs.length;

async function salvarEditarAcesso(lojaId){
  const l = state.lojas.find(x => x.id === lojaId);
  if (!l) return;
  const novoId = (document.getElementById('acIdNovo').value||'').trim().toUpperCase();
  const novaSenha = document.getElementById('acSenhaNova').value || '';
  if (!novoId) { toast('Atenção','ID não pode ficar vazio','warning'); return; }
  if (!novaSenha || novaSenha.length < 4) { toast('Atenção','Senha precisa de pelo menos 4 caracteres','warning'); return; }
  // Verifica conflito de id
  if (state.lojas.find(x => x.id !== lojaId && (x.acessoId||'').toUpperCase() === novoId)) {
    toast('Conflito','Esse ID já está em uso por outra loja','error'); return;
  }
  l.acessoId = novoId;
  l.senha = novaSenha;
  if (Cloud.ok()) {
    await Cloud.atualizarAcessoLoja(lojaId, novoId);
    await Cloud.atualizarSenhaLoja(lojaId, novaSenha);

  await Storage.set('solys:lojas', state.lojas);

  renderAcessos();

async function backupAll() {
  const data = {
    version:'1.0',
    exportedAt: new Date().toISOString(),
    exportedBy: state.user.name,
    purchases: state.purchases,
    requests: state.requests,
    documents: state.documents,
    logs: state.logs,
    users: state.users,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `solys-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  await pushLog('export', `Backup completo gerado`);
  toast('Backup gerado','Download iniciado','success');
}

async function restoreBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('Restaurar irá MESCLAR os dados do backup com os atuais (sem apagar). Confirma?')) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    // Merge: backup tem prioridade nos itens que não existem
    if (data.purchases) {
      data.purchases.forEach(p => {
        if (!state.purchases.find(x=>x.id===p.id || x._hash===p._hash)) state.purchases.unshift(p);
      });
      await Storage.set('solys:purchases', state.purchases);
    }
    if (data.requests) {
      data.requests.forEach(r => {
        if (!state.requests.find(x=>x.id===r.id)) state.requests.unshift(r);
      });
      await Storage.set('solys:requests', state.requests);
    }
    if (data.documents) {
      data.documents.forEach(d => {
        if (!state.documents.find(x=>x.id===d.id)) state.documents.unshift(d);
      });
      await Storage.set('solys:documents', state.documents);
    }
    await pushLog('import', `Backup restaurado a partir de <strong>${file.name}</strong>`);
    toast('Backup restaurado','Dados mesclados sem perda','success');
    renderConfig();
    updateBadges();
  } catch (e) {
    toast('Erro ao restaurar', e.message,'error');
  }
}

async function resetSystem() {
  if (!confirm('TEM CERTEZA? Isso apagará TODOS os dados. Esta ação é irreversível.')) return;
  if (!confirm('Última confirmação: apagar tudo?')) return;
  await Storage.del('solys:purchases');
  await Storage.del('solys:requests');
  await Storage.del('solys:documents');
  await Storage.del('solys:logs');
  await Storage.del('solys:purchases:arquivo');
  state.purchases = []; state.requests = []; state.documents = []; state.logs = [];
  toast('Sistema resetado','Recarregando...','warning');
  setTimeout(()=>location.reload(), 1500);
}

async function exportLogsCSV() {
  const rows = [['Data','Usuário','Função','Ação','Mensagem']].concat(
    state.logs.map(l => [fmt.datetime(l.at), l.by, l.role||'', l.action, (l.message||'').replace(/<[^>]+>/g,'')])
  );
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `solys-historico-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
  await pushLog('export','Histórico exportado para CSV');
  toast('CSV gerado','','success');
}

async function exportData() {
  // Atalho do topbar — exporta a página atual quando aplicável
  if (state.route === 'compras' || state.route === 'dashboard') return exportPurchasesXLSX();
  if (state.route === 'historico') return exportLogsCSV();
  toast('Exportar','Selecione uma página para exportar','info');
}

/* ----------------------------------------------------------------
   MODAL HELPER
   ---------------------------------------------------------------- */
function showModal({ title, body, onConfirm, confirmText = 'Confirmar', size = '' }) {
  const overlay = document.getElementById('modalOverlay');
  const container = document.getElementById('modalContainer');
  container.className = 'modal' + (size ? ' '+size : '');
  container.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${escapeHtml(title)}</div>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn gold" id="modalOk">${confirmText}</button>
    </div>
  `;
  overlay.classList.add('active');
  lucide.createIcons();
  document.getElementById('modalOk').onclick = async () => {
    const result = await onConfirm();
    if (result !== false) closeModal();
  };
}

// Variante com botões customizados (HTML) — usada pelos módulos Lojas e Colaborador
function openModal({ title, body, actions, size = '' }) {
  const overlay = document.getElementById('modalOverlay');
  const container = document.getElementById('modalContainer');
  container.className = 'modal' + (size ? ' '+size : '');
  container.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${escapeHtml(title)}</div>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">${actions || ''}</div>
  `;
  overlay.classList.add('active');
  lucide.createIcons();
  // Foca primeiro input se houver
  setTimeout(() => {
    const first = container.querySelector('input[autofocus], input, textarea, select');
    if (first) first.focus();
  }, 50);
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function showNotifications() {
  showModal({
    title:'Notificações',
    body: state.logs.slice(0,10).length ? `
      <div style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto">
        ${state.logs.slice(0,10).map(l => `
          <div style="display:flex;gap:10px;padding:10px;background:rgba(255,255,255,.02);border-radius:8px">
            <div class="activity-icon"><i data-lucide="bell"></i></div>
            <div><div style="font-size:13px">${l.message}</div><div class="muted" style="font-size:11px;margin-top:2px">${fmt.ago(l.at)}</div></div>
          </div>
        `).join('')}
      </div>
    ` : '<div class="empty-state"><i data-lucide="bell"></i><h3>Sem notificações</h3></div>',
    confirmText:'Fechar', onConfirm:()=>true
  });
}

/* ----------------------------------------------------------------
   COMMAND PALETTE (Cmd+K)
   ---------------------------------------------------------------- */
function openCmdK() {
  document.getElementById('cmdkOverlay').classList.add('active');
  const inp = document.getElementById('cmdkInput');
  inp.value = ''; inp.focus();
  renderCmdK('');
}
function closeCmdK() { document.getElementById('cmdkOverlay').classList.remove('active'); }
function renderCmdK(q) {
  const ql = q.toLowerCase();
  const commands = [
    { icon:'layout-dashboard', label:'Ir para Dashboard', sub:'Visão geral', action:()=>{closeCmdK();navigate('dashboard')} },
    { icon:'shopping-cart', label:'Ir para Compras', sub:'Gestão de compras', action:()=>{closeCmdK();navigate('compras')} },
    { icon:'file-text', label:'Ir para Solicitações', sub:'Solicitações em andamento', action:()=>{closeCmdK();navigate('solicitacoes')} },
    { icon:'upload-cloud', label:'Importar planilha', sub:'Excel, CSV, PDF', action:()=>{closeCmdK();navigate('importar')} },
    { icon:'history', label:'Histórico', sub:'Timeline completa', action:()=>{closeCmdK();navigate('historico')} },
    { icon:'plus', label:'Nova compra', sub:'Cadastrar compra', action:()=>{closeCmdK();openPurchaseModal()} },
    { icon:'plus', label:'Nova solicitação', sub:'Cadastrar solicitação', action:()=>{closeCmdK();openRequestModal()} },
    { icon:'download', label:'Exportar compras (Excel)', sub:'.xlsx', action:()=>{closeCmdK();exportPurchasesXLSX()} },
    { icon:'log-out', label:'Sair', sub:'Encerrar sessão', action:()=>{closeCmdK();logout()} },
  ];
  const filtered = q ? commands.filter(c => c.label.toLowerCase().includes(ql) || c.sub.toLowerCase().includes(ql)) : commands;
  document.getElementById('cmdkList').innerHTML = filtered.map((c,i) => `
    <div class="cmdk-result ${i===0?'sel':''}" data-i="${i}">
      <div class="ic"><i data-lucide="${c.icon}"></i></div>
      <div class="txt"><strong>${escapeHtml(c.label)}</strong><small>${escapeHtml(c.sub)}</small></div>
      <span class="kbd">↵</span>
    </div>
  `).join('');
  lucide.createIcons();
  document.querySelectorAll('.cmdk-result').forEach((el,i) => {
    el.addEventListener('click', () => filtered[i].action());
  });
  // Stash atual
  state._cmdkFiltered = filtered;
}

/* ----------------------------------------------------------------
   EVENT BINDINGS
   ---------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', () => {
  // Sidebar nav
  document.getElementById('nav').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (item) navigate(item.dataset.route);
  });

  // Modal overlay click
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });

  // Cmd+K (somente gestão; colaborador/loja não usa)
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (state.user && state.user.role !== 'Colaborador') openCmdK();
    }
    if (e.key === 'Escape') { closeCmdK(); closeModal(); }
  });
  document.getElementById('cmdkInput').addEventListener('input', e => renderCmdK(e.target.value));
  document.getElementById('cmdkInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const f = state._cmdkFiltered;
      if (f && f.length) f[0].action();
    }
  });
  document.getElementById('cmdkOverlay').addEventListener('click', e => {
    if (e.target.id === 'cmdkOverlay') closeCmdK();
  });

  // Global search
  document.getElementById('globalSearch').addEventListener('focus', () => openCmdK());

  // Init
  initAuth().then(() => lucide.createIcons());
});

</script>
