  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:99px;
  font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  white-space:nowrap;flex-shrink:0;
}
.acesso-card .ac-status svg{width:10px;height:10px}
.acesso-card .ac-status.ok{background:rgba(52,211,153,.14);color:#86efac;border:1px solid rgba(52,211,153,.25)}
.acesso-card .ac-status.pend{background:rgba(200,155,60,.14);color:var(--gold-300);border:1px solid rgba(200,155,60,.3)}

/* ACESSOS — credenciais das lojas */
.acessos-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;
}
.acesso-card{
  background:linear-gradient(180deg, rgba(22,28,52,.5), rgba(13,17,32,.5));
  border:1px solid var(--border);border-radius:14px;
  padding:16px;display:flex;flex-direction:column;gap:12px;
  transition:all .18s;
}
.acesso-card:hover{border-color:rgba(200,155,60,.3);box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}
.acesso-card .ac-head{display:flex;align-items:center;gap:11px}
.acesso-card .ac-nome{font-size:14.5px;font-weight:600;color:#fff;letter-spacing:-.01em;line-height:1.1}
.acesso-card .ac-local{font-size:10.5px;color:var(--ink-300);margin-top:3px;display:flex;align-items:center;gap:4px;text-transform:uppercase;letter-spacing:.08em}
.acesso-card .ac-local svg{width:11px;height:11px}
.acesso-card .ac-fields{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.04);border-radius:10px}
.acesso-card .ac-field{display:flex;flex-direction:column;gap:3px}
.acesso-card .ac-lbl{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400)}
.acesso-card .ac-val-row{display:flex;align-items:center;gap:4px}
.acesso-card .ac-val{
  flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);
  padding:6px 10px;border-radius:7px;font-size:13px;color:#fff;
  font-family:'JetBrains Mono',monospace;letter-spacing:.04em;font-weight:500;
  overflow:hidden;text-overflow:ellipsis;
}
.acesso-card .ac-acoes{display:flex;gap:6px;flex-wrap:wrap}
.mono{font-family:'JetBrains Mono',monospace}

/* Editor de pedido da Diretoria */
.eg-head{
  display:grid;grid-template-columns:80px 70px 1fr 36px;gap:8px;
  padding:0 4px 8px;border-bottom:1px solid var(--border);margin-bottom:8px;
}
.eg-th{
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-400);text-align:center;
}
.eg-th-desc{text-align:left;padding-left:4px}
.eg-list{
  max-height:340px;overflow-y:auto;
  display:flex;flex-direction:column;gap:6px;padding:4px;
}
.eg-row{
  display:grid;grid-template-columns:80px 70px 1fr 36px;gap:8px;align-items:center;
}
.eg-row .fld{padding:8px 10px;font-size:13px}
.eg-qtd{text-align:center;font-variant-numeric:tabular-nums}
.eg-un{text-align:center}

/* AI Compact card */
.ai-summary{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;
}
.ai-mini{
  padding:12px;border-radius:10px;background:rgba(0,0,0,.18);
  border:1px solid rgba(167,139,250,.12);
}
.ai-mini .v{font-family:'Outfit';font-size:20px;font-weight:600;color:#fff;letter-spacing:-.02em}
.ai-mini .l{font-size:10.5px;color:var(--ink-300);text-transform:uppercase;letter-spacing:.1em;margin-top:3px}

/* ============================================================
   ╔════════════════════════════════════════════════════════════╗
   ║   THEME OVERRIDE — BankDash Light                          ║
   ║   Aplica look claro (Inter, cards brancos, navy/gold) sem  ║
   ║   alterar nenhuma das funcionalidades acima.               ║
   ╚════════════════════════════════════════════════════════════╝
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

:root{
  --navy-900:#06122a;
  --navy-800:#0a1c3d;
  --navy-700:#0A3D7C;
  --navy-600:#1456a6;
  --navy-500:#2e74c9;
  --gold-300:#a47e2c;
  --gold-400:#C89B3C;
  --gold-500:#C89B3C;
  --gold-600:#a47e2c;
  /* TEXT (escala invertida — agora é tema CLARO) */
  --ink-50:#0A0F1A;
  --ink-100:#111827;     /* texto primário */
  --ink-200:#374151;     /* texto secundário forte */
  --ink-300:#6B7280;     /* texto secundário */
  --ink-400:#9CA3AF;     /* placeholder/disabled */
  --ink-500:#D5DCE6;     /* dividers fortes */
  --ink-600:#E5EAF2;     /* dividers */
  --ink-700:#F1F4FA;     /* surfaces sutis */
  --ink-800:#F7F9FC;     /* surface */
  --ink-900:#FFFFFF;     /* paper */
  /* SURFACES */
  --bg:#F7F9FC;
  --surface:#FFFFFF;
  --surface-2:#F1F4FA;
  --surface-3:#E5EAF2;
  --border:rgba(10,61,124,0.08);
  --border-strong:rgba(10,61,124,0.18);
  --success:#10B981;
  --warning:#D97706;
  --danger:#EF4444;
  --info:#1456A6;
  --shadow-sm:0 1px 2px rgba(10,61,124,.06);
  --shadow:0 4px 18px rgba(10,61,124,.07);
  --shadow-lg:0 24px 60px -20px rgba(10,61,124,.15);
  --shadow-gold:0 0 0 1px rgba(200,155,60,.3), 0 8px 30px rgba(200,155,60,.15);
}

body{
  font-family:'Inter',system-ui,-apple-system,sans-serif !important;
  background:var(--bg);
  color:var(--ink-100);
  letter-spacing:0;
  -webkit-font-smoothing:antialiased;
}
body::before, body::after{display:none !important}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(10,61,124,.16);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:rgba(10,61,124,.32)}

/* === LOGIN === */
.login-screen{
  background:radial-gradient(900px 600px at 30% 30%, rgba(46,116,201,.08), var(--bg) 60%) !important;
}
.login-card{
  background:#fff !important;
  border:1px solid var(--border) !important;
  box-shadow:0 24px 60px -20px rgba(10,61,124,.18), 0 8px 24px -8px rgba(10,61,124,.08) !important;
  backdrop-filter:none !important;
  max-width:360px !important;
  padding:24px 24px !important;
  border-radius:18px !important;
}
.login-screen{
  align-items:flex-start !important;
  padding-top:4vh !important;
  padding-bottom:4vh !important;
  overflow-y:auto !important;
}
.login-brand-logo{margin-bottom:18px !important;gap:2px !important}
.brand-logo-img{width:100px !important;height:auto !important}
.brand-sub-tag{font-size:8.5px !important;letter-spacing:0.28em !important}
.login-title{font-size:18px !important;font-weight:700 !important;margin-bottom:2px !important}
.login-sub{font-size:12px !important;margin-bottom:16px !important}
.field{margin-bottom:12px !important}
.field label{font-size:10px !important;margin-bottom:5px !important;letter-spacing:0.14em !important}
.field input, .field select, .field textarea,
.login-card .select-wrap select, .login-card .select-wrap input{
  padding:9px 12px 9px 36px !important;
  font-size:13px !important;
  border-radius:9px !important;
}
.login-card .select-wrap > i, .login-card .select-wrap > svg{width:13px;height:13px;left:11px}
.btn-primary{padding:11px 16px !important;font-size:13px !important;border-radius:9px !important;margin-top:4px !important}
.login-admin-toggle{margin-top:14px !important}
.login-admin-toggle .link-btn{font-size:11px}
.admin-login-box{padding:14px !important;border-radius:10px !important;margin-top:12px !important}
.admin-login-box input{padding:9px 11px !important;font-size:13px !important;border-radius:8px !important}
.login-brand h1{color:var(--navy-700) !important}
.login-brand p{color:var(--gold-500) !important}
.login-title{color:var(--ink-100) !important}
.login-sub{color:var(--ink-300) !important}
.login-mark{box-shadow:0 8px 24px rgba(10,61,124,.18) !important}
.login-hint{background:rgba(46,116,201,.06) !important;border-color:rgba(46,116,201,.18) !important;color:var(--ink-200) !important}
.login-hint code{background:rgba(10,61,124,.06) !important;color:var(--navy-700) !important}

.admin-login-box{background:rgba(10,61,124,.03) !important;border-color:var(--border) !important}
.admin-login-box input{
  background:#fff !important;
  border-color:var(--border-strong) !important;
  color:var(--ink-100) !important;
}

.field label{color:var(--ink-300) !important}
.field input, .field select, .field textarea{
  background:#fff !important;
  border-color:var(--border-strong) !important;
  color:var(--ink-100) !important;
}
.field input:focus, .field select:focus, .field textarea:focus{
  background:#fff !important;
  border-color:var(--gold-500) !important;
  box-shadow:0 0 0 4px rgba(200,155,60,.12) !important;
}
.login-card .select-wrap select,
.login-card .select-wrap input{
  background:#fff !important;
  border-color:var(--border-strong) !important;
  color:var(--ink-100) !important;
}
.login-card .select-wrap > i, .login-card .select-wrap > svg{color:var(--ink-400) !important}
.login-card .pwd-eye{color:var(--ink-400) !important}
.login-card .pwd-eye:hover{background:rgba(10,61,124,.06) !important;color:var(--navy-700) !important}

.btn-primary{
  background:linear-gradient(135deg, var(--navy-700), var(--navy-600)) !important;
  color:#fff !important;
  box-shadow:0 8px 24px rgba(10,61,124,.25), inset 0 1px 0 rgba(255,255,255,.15) !important;
}
.btn-primary:hover{box-shadow:0 12px 32px rgba(10,61,124,.35), inset 0 1px 0 rgba(255,255,255,.15) !important}

/* === LOGIN SPLIT: logo à esquerda, formulário à direita === */
.login-split{
  position:relative;z-index:2;
  display:flex;align-items:stretch;
  width:100%;max-width:840px;
  margin:auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 24px 60px -20px rgba(10,61,124,.22), 0 8px 24px -8px rgba(10,61,124,.10);
}
.login-side{
  flex:1 1 52%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:48px 36px;
  text-align:center;
  background:
    radial-gradient(420px 320px at 30% 20%, rgba(46,116,201,.10), transparent 70%),
    linear-gradient(160deg, #f6f9fe, #eef3fb);
  border-right:1px solid var(--border);
}
.login-side .brand-logo-img{width:210px !important;max-width:72%;height:auto !important}
.login-side .brand-sub-tag{font-size:10px !important;letter-spacing:.3em !important}
.login-side-text{
  font-size:12.5px;color:var(--ink-300);
  max-width:240px;line-height:1.55;margin-top:6px;
}
.login-split .login-card{
  flex:1 1 48%;
  max-width:none !important;
  margin:0 !important;
  border:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
  padding:40px 36px !important;
  display:flex;flex-direction:column;justify-content:center;
}
/* refinamento do formulário */
.login-split .login-title{
  font-family:'Inter','Outfit',system-ui,sans-serif !important;
  font-size:21px !important;font-weight:700 !important;
  color:var(--navy-700) !important;letter-spacing:-.01em !important;
  margin-bottom:4px !important;
}
.login-split .login-sub{font-size:13px !important;color:var(--ink-300) !important;margin-bottom:24px !important}
.login-split .field{margin-bottom:16px !important}
.login-split .field label{
  text-transform:none !important;letter-spacing:0 !important;
  font-size:12.5px !important;font-weight:600 !important;
  color:var(--ink-200) !important;margin-bottom:6px !important;
}
.login-split .select-wrap select,
.login-split .select-wrap input{
  padding:11px 12px 11px 38px !important;
  font-size:13.5px !important;
  border-radius:10px !important;
  border-color:#d4dce8 !important;
}
.login-split .select-wrap select:focus,
.login-split .select-wrap input:focus{
  border-color:var(--navy-600) !important;
  background:#fff !important;
  box-shadow:0 0 0 3px rgba(10,61,124,.10) !important;
}
.login-split .btn-primary{
  margin-top:8px !important;
  padding:12px 16px !important;
  font-size:14px !important;font-weight:600 !important;
  border-radius:10px !important;
}
.login-split .login-admin-toggle{
  margin-top:22px !important;
  padding-top:16px;
  border-top:1px solid rgba(10,61,124,.08);
}
.login-split .login-admin-toggle .link-btn{
  font-size:12px !important;color:var(--ink-400) !important;
  text-decoration:none !important;
}
.login-split .login-admin-toggle .link-btn:hover{color:var(--navy-700) !important}

@media (max-width:760px){
  .login-split{flex-direction:column;max-width:420px}
  .login-side{border-right:none;border-bottom:1px solid var(--border);padding:26px 24px 20px;gap:6px}
  .login-side .brand-logo-img{width:140px !important}
  .login-side-text{display:none}
  .login-split .login-card{padding:24px !important}
}

/* === APP SHELL === */
.app.active{background:var(--bg)}
.sidebar{
  background:#FFFFFF !important;
  border-right:1px solid var(--border) !important;
  backdrop-filter:none !important;
}
.sidebar::before{display:none}
.brand{border-bottom:1px solid var(--border) !important}
.brand-name{color:var(--navy-700) !important}
.brand-tag{color:var(--gold-500) !important}
.brand-mark{box-shadow:0 4px 12px rgba(10,61,124,.18) !important}

.nav-label{color:var(--ink-400) !important}
.nav-item{color:var(--ink-200) !important}
.nav-item svg{color:var(--ink-300) !important}
.nav-item:hover{background:rgba(10,61,124,.04) !important;color:var(--navy-700) !important}
.nav-item:hover svg{color:var(--navy-700) !important}
.nav-item.active{
  background:linear-gradient(90deg, rgba(10,61,124,.08), rgba(10,61,124,.02)) !important;
  color:var(--navy-700) !important;
}
.nav-item.active svg{color:var(--navy-700) !important}
.nav-item.active::before{background:var(--navy-700) !important}
.nav-item .badge{
  background:rgba(10,61,124,.08) !important;
  color:var(--navy-700) !important;
}

.sidebar-footer{border-top:1px solid var(--border) !important}
.user-chip:hover{background:rgba(10,61,124,.04) !important}
.user-info .name{color:var(--ink-100) !important}
.user-info .role{color:var(--ink-300) !important}
.user-chip .logout-btn{color:var(--ink-400) !important}

/* TOPBAR */
.topbar{
  background:#fff !important;
  border-bottom:1px solid var(--border) !important;
  backdrop-filter:none !important;
}
.search-global input{
  background:rgba(10,61,124,.04) !important;
  border-color:transparent !important;
  color:var(--ink-100) !important;
}
.search-global input:focus{background:#fff !important;border-color:var(--border-strong) !important}
.search-global svg{color:var(--ink-400) !important}
.search-global .kbd{background:rgba(10,61,124,.05) !important;color:var(--ink-400) !important;border-color:var(--border) !important}
.icon-btn{color:var(--ink-300) !important}
.icon-btn:hover{background:rgba(10,61,124,.06) !important;color:var(--navy-700) !important}

.content::before{display:none}

.page-title{color:var(--ink-100) !important;font-family:'Inter',sans-serif !important;font-weight:700 !important}
.page-sub{color:var(--ink-300) !important}

.btn{
  background:#fff !important;
  border-color:var(--border-strong) !important;
  color:var(--ink-200) !important;
  box-shadow:0 1px 2px rgba(10,61,124,.04) !important;
}
.btn:hover{background:rgba(10,61,124,.04) !important;color:var(--navy-700) !important}
.btn.gold{
  background:linear-gradient(135deg, var(--navy-700), var(--navy-600)) !important;
  color:#fff !important;
  border-color:transparent !important;
  box-shadow:0 6px 20px rgba(10,61,124,.22) !important;
}
.btn.gold:hover{box-shadow:0 8px 26px rgba(10,61,124,.32) !important}

/* PANELS / CARDS */
.panel, .kpi-card, .table-wrap, .ai-panel, .ped-v2, .board-col, .acesso-card, .loja-card{
  background:#fff !important;
  border:1px solid var(--border) !important;
  backdrop-filter:none !important;
  box-shadow:0 1px 3px rgba(10,61,124,.04), 0 8px 24px -16px rgba(10,61,124,.08) !important;
}
.panel:hover, .kpi-card:hover, .loja-card:hover, .acesso-card:hover{
  box-shadow:0 4px 8px rgba(10,61,124,.06), 0 16px 36px -20px rgba(10,61,124,.16) !important;
  border-color:var(--border-strong) !important;
}
.panel::before, .kpi-card::before, .loja-card::before{display:none}
.panel-title{color:var(--ink-100) !important;font-family:'Inter',sans-serif !important;font-weight:700 !important}
.panel-sub{color:var(--ink-300) !important}
.panel-actions .chip{background:rgba(10,61,124,.06) !important;border-color:var(--border) !important;color:var(--ink-200) !important}
.chip.active{background:rgba(200,155,60,.15) !important;border-color:rgba(200,155,60,.35) !important;color:var(--gold-300) !important}

.kpi-label{color:var(--ink-300) !important}
.kpi-value{color:var(--ink-100) !important;font-family:'Inter',sans-serif !important}
.kpi-trend{color:var(--ink-300) !important}
.kpi-icon{background:rgba(10,61,124,.06) !important;color:var(--navy-700) !important}
.kpi-icon.gold, .kpi-icon.amber{background:rgba(200,155,60,.12) !important;color:var(--gold-500) !important}
.kpi-icon.blue{background:rgba(46,116,201,.08) !important;color:var(--navy-700) !important}
.kpi-icon.green{background:rgba(16,185,129,.08) !important;color:#10B981 !important}

/* TABELAS */
table.data thead th{background:#F7F9FC !important;color:var(--ink-300) !important;border-bottom:1px solid var(--border) !important}
table.data tbody td{border-bottom:1px solid var(--border) !important}
table.data tbody tr:hover{background:rgba(10,61,124,.025) !important}
.cell-strong{color:var(--ink-100) !important}
.cell-mute{color:var(--ink-300) !important}

/* FILTROS / TOOLBAR */
.table-toolbar{border-bottom:1px solid var(--border) !important}
.search-mini input{background:#fff !important;border-color:var(--border-strong) !important;color:var(--ink-100) !important}
.filter-pill{background:#fff !important;border-color:var(--border-strong) !important;color:var(--ink-200) !important}
.filter-pill select option{background:#fff !important;color:var(--ink-100) !important}

/* TIMELINE */
.tl-item{border-color:var(--border) !important}
.tl-title{color:var(--ink-100) !important}
.tl-meta{color:var(--ink-300) !important}
.tl-details{background:rgba(10,61,124,.03) !important;border-color:var(--border-strong) !important;color:var(--ink-200) !important}

/* MODAL */
.modal-overlay{background:rgba(10,15,26,.4) !important;backdrop-filter:blur(4px)}
.modal{
  background:#fff !important;
  border-color:var(--border) !important;
  backdrop-filter:none !important;
  box-shadow:0 24px 60px -10px rgba(10,61,124,.25) !important;
}
.modal-head{border-bottom:1px solid var(--border) !important}
.modal-title{color:var(--ink-100) !important}
.modal-close{color:var(--ink-300) !important}
.modal-close:hover{background:rgba(10,61,124,.06) !important;color:var(--ink-100) !important}
.modal-footer{border-top:1px solid var(--border) !important}
.modal-body label{color:var(--ink-300) !important}
.modal-body input,.modal-body select,.modal-body textarea{
  background:#fff !important;
  border-color:var(--border-strong) !important;
  color:var(--ink-100) !important;
}
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{
  border-color:var(--gold-500) !important;
  box-shadow:0 0 0 3px rgba(200,155,60,.12) !important;
  background:#fff !important;
}

/* TOAST */
.toast{
  background:#fff !important;
  border:1px solid var(--border) !important;
  color:var(--ink-100) !important;
  box-shadow:0 12px 30px -12px rgba(10,61,124,.22) !important;
  backdrop-filter:none !important;
}
.toast-title{color:var(--ink-100) !important}
.toast-desc{color:var(--ink-300) !important}

/* PEDIDO CARDS — light theme */
.ped-v2 .ped-store-name{color:var(--ink-100) !important}
.ped-v2 .ped-store-loc{color:var(--ink-300) !important}
.ped-v2 .ped-meta{color:var(--ink-300) !important}
.ped-v2 .ped-itens-v2{background:rgba(10,61,124,.025) !important;border-color:var(--border) !important}
.ped-v2 .ped-li{color:var(--ink-100) !important}
.ped-v2 .ped-products-h{color:var(--ink-400) !important}
.ped-v2 .ped-products-h::before,
.ped-v2 .ped-products-h::after{background:linear-gradient(90deg, transparent, rgba(10,61,124,.12), transparent) !important}
.ped-v2 .ped-obs-v2{color:var(--ink-200) !important}
.ped-v2 .ped-obs-v2 svg{color:var(--ink-400) !important}
.ped-v2 .ped-msg{background:rgba(200,155,60,.08) !important;color:var(--gold-300) !important}

/* Itens do pedido */
.ped-li, .ped-li span, .pedido-item-line, .ref-desc, .pd-it-desc,
.colab-item-head strong, .colab-item-desc{
  color:#0A0F1A !important;
}

/* Labels de campos */
.field label, .login-card .field label, .fld-label,
.modal-body label, .ac-lbl, .pd-meta-cell .lbl,
.pd-section-h, .ped-products-h, .pedido-data, .pedido-loja-nome,
.eg-th{
  color:#4B5563 !important;
}

/* Status / chips devem ter cores próprias (não sobrescrever) */
.status, .status-pill, .status-badge, .chip, .prio, .cat-tag,
.sla, .fpill, .qq, .ref-qtd, .pedido-item-qtd, .pd-it-qtd,
.urg-pill, .qtd-pill, .ac-status, .yr-badge{
  /* preserva cores específicas já definidas */
}

/* Botões */
.btn{color:#1F2937 !important}
.btn:hover{color:#0A3D7C !important}
.btn.gold, .btn-primary, .qbtn.go, .qbtn.gold,
.ll-btn, .pagination button.active{
  color:#fff !important;
}
/* Botões de ações com fundo dourado/azul mantêm contraste branco */
.btn.gold *, .btn-primary *, .qbtn.go *, .qbtn.gold *{color:#fff !important}

/* Nav items */
.nav-item, .nav-item span{color:#374151 !important}
.nav-item.active, .nav-item.active span{color:#0A3D7C !important;font-weight:600 !important}
.nav-label{color:#4B5563 !important;font-weight:700 !important}
.brand-name{color:#0A3D7C !important;font-weight:700 !important}
.brand-tag, .brand-sub-tag{color:#A47E2C !important;font-weight:700 !important}

/* User chip */
.user-info .name{color:#0A0F1A !important;font-weight:600 !important}
.user-info .role{color:#4B5563 !important}

/* Empty states */
.empty-state h3{color:#0A0F1A !important;font-weight:700 !important}
.empty-state, .empty-state p{color:#4B5563 !important}

/* Notif / modal / toast titles */
.toast-title{color:#0A0F1A !important;font-weight:600 !important}
.toast-desc{color:#4B5563 !important}
.notif-pop > header h4{color:#0A0F1A !important}
.notif-text{color:#1F2937 !important}
.notif-text .nt-time{color:#6B7280 !important}

/* Resposta da diretoria — caixinha azul */
.pedido-resposta, .pd-resp{color:#1F2937 !important}
.pedido-resposta strong, .pd-resp b{color:#0A3D7C !important}

/* Observação */
.pedido-obs, .ped-obs-v2, .pd-obs{color:#374151 !important}

/* Footer / muted */
.muted, .pedido-foot, .ped-foot, .footer{color:#6B7280 !important}

/* Garante input numérico/data legível */
input[type=number], input[type=date], input[type=text],
input[type=password], input[type=email], input[type=search]{
  color:#0A0F1A !important;
}

/* Logo na sidebar e login mantém legibilidade */
.brand-side-img, .brand-logo-img{filter:drop-shadow(0 4px 12px rgba(10,61,124,.15))}

/* ============================================================
   MOBILE / RESPONSIVO — celular e tablet
   ============================================================ */
.hamburger-btn{display:none}
.topbar-mobile-title{display:none}
.sidebar-backdrop{display:none}

@media (max-width:1024px){
  .board-3{grid-template-columns:1fr 1fr !important}
  .kpi-grid{grid-template-columns:repeat(2,1fr) !important}
  .grid-2,.grid-3-2{grid-template-columns:1fr !important}
}

@media (max-width:768px){
  body{overflow:auto !important}
  .app.active{grid-template-columns:1fr !important;display:block !important;height:auto !important;min-height:100vh}

  /* Restaura aparência completa do drawer (anula o colapso de 980px) */
  .brand-name,.brand-tag,.nav-label,.nav-item span,.user-info,.user-chip .logout-btn{display:revert !important}
  .nav-item{justify-content:flex-start !important;padding:11px 14px !important}
  .nav-item.active::before{display:block !important}
  .brand{justify-content:flex-start !important;padding:24px 22px !important}
  .sidebar-footer .user-chip{justify-content:flex-start !important}


  .sidebar{
    position:fixed !important;top:0;left:0;bottom:0;
    width:280px !important;max-width:84vw;height:100vh !important;
    z-index:300 !important;transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.16,1,.3,1) !important;
    box-shadow:0 0 40px rgba(0,0,0,.4) !important;
  }
  .sidebar.mobile-open{transform:translateX(0)}

  .sidebar-backdrop{
    display:block;position:fixed;inset:0;z-index:290;
    background:rgba(6,9,26,.6);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;
    transition:opacity .28s ease, visibility .28s ease;
  }
  .sidebar-backdrop.show{opacity:1;visibility:visible}

  .main{height:auto !important;min-height:100vh}

  .topbar{padding:12px 16px !important;gap:10px !important;position:sticky;top:0;z-index:50}
  .hamburger-btn{
    display:grid;place-items:center;width:40px;height:40px;flex-shrink:0;
    border-radius:10px;background:rgba(10,61,124,.06) !important;
    border:1px solid var(--border) !important;color:var(--navy-700) !important;
  }
  .hamburger-btn:active{background:rgba(10,61,124,.12) !important}
  .hamburger-btn svg{width:20px;height:20px}
  .topbar-mobile-title{
    display:block;font-family:'Inter','Manrope',sans-serif;
    font-weight:800;font-size:17px;letter-spacing:-.02em;
    color:var(--navy-700) !important;flex:1;
  }
  .search-global{display:none !important}
  .topbar-actions{margin-left:0 !important}

  .content{padding:16px !important}
  .page-header{flex-direction:column;align-items:stretch !important;gap:14px;margin-bottom:18px !important}
  .page-actions{width:100%}
  .page-actions .btn{flex:1;justify-content:center}
  .page-title{font-size:21px !important}

  .solys-hero{padding:20px 18px !important;border-radius:16px !important}
  .solys-hero h1{font-size:21px !important}
  .solys-hero .hero-meta{gap:14px !important}

  .board-3{grid-template-columns:1fr !important;gap:14px}
  .kpi-grid{grid-template-columns:1fr 1fr !important;gap:12px}
  .metric-row{grid-template-columns:1fr 1fr !important;gap:12px}
  .grid-2,.grid-3-2,.form-grid{grid-template-columns:1fr !important}
  .form-grid .full{grid-column:span 1}
  .lojas-grid{grid-template-columns:1fr !important}
  .acessos-grid{grid-template-columns:1fr !important}
  .ped-grid{grid-template-columns:1fr !important}

  .kpi-card{padding:16px !important}
  .kpi-value{font-size:24px !important}

  .panel{padding:16px !important;border-radius:14px !important}
  .panel-head{flex-direction:column;align-items:flex-start !important;gap:8px}

  .ped-v2{width:100% !important}
  .ped-linha{grid-template-columns:56px 50px 1fr 30px !important;gap:6px !important}
  .form-row-2{grid-template-columns:1fr !important}

  .table-wrap{overflow-x:auto !important}
  table.data{min-width:560px}
  .loja-table-wrap{-webkit-overflow-scrolling:touch}

  .modal{max-width:100% !important;width:100% !important;max-height:92vh !important;border-radius:18px 18px 0 0 !important}
  .modal-overlay{align-items:flex-end !important;padding:0 !important}
  .modal-head{padding:18px 20px 14px !important}
  .modal-body{padding:18px 20px !important}
  .modal-footer{padding:14px 20px 20px !important;flex-direction:column-reverse;gap:8px}
  .modal-footer .btn{width:100%;justify-content:center}

  .filter-strip{overflow-x:auto;flex-wrap:nowrap !important;padding-bottom:8px}
  .filter-strip .fpill{flex-shrink:0}

  .notif-pop{width:calc(100vw - 24px) !important;right:12px !important;top:60px !important;max-height:70vh}

  .month-grid{grid-template-columns:repeat(4,1fr) !important;gap:6px}

  .login-card{max-width:100% !important;margin:0 8px}
  .login-screen{padding:16px !important;padding-top:3vh !important}

  .pagination{flex-direction:column;gap:10px;align-items:flex-start}
}

@media (max-width:420px){
  .kpi-grid{grid-template-columns:1fr !important}
  .metric-row{grid-template-columns:1fr !important}
  .month-grid{grid-template-columns:repeat(3,1fr) !important}
  .page-title{font-size:19px !important}
  .solys-hero h1{font-size:19px !important}
  .ped-foot,.ped-v2 .ped-foot{flex-wrap:wrap;gap:8px}
}

</style>
</head>

<script>
/* ================================================================
   SOLYS · Central Administrativa
   Sistema SPA com persistência via window.storage
   ================================================================ */

/* ----------------------------------------------------------------
   STORAGE LAYER
   Abstração sobre window.storage para persistência entre sessões.
   Em produção real isto seria substituído por chamadas Supabase.
   ---------------------------------------------------------------- */
const Storage = {
  async get(key, def = null) {
    try {
      // window.storage no host; fallback pra localStorage no browser comum
      if (window.storage?.get) {
        const r = await window.storage.get(key);
        return r && r.value ? JSON.parse(r.value) : def;
      }
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch (e) { return def; }
  },
  async set(key, value) {
    try {
      if (window.storage?.set) { await window.storage.set(key, JSON.stringify(value)); return true; }
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { console.error('Storage set error', key, e); return false; }
  },
  async del(key) {
    try {
      if (window.storage?.delete) await window.storage.delete(key);
      else localStorage.removeItem(key);
    } catch (e) {}
  },
};

/* ----------------------------------------------------------------
   SUPABASE — banco central (realtime entre loja e diretoria)
   ---------------------------------------------------------------- */
const SUPA_URL = 'https://rmczoqutcuvrlvlmfxze.supabase.co';
const SUPA_KEY = 'sb_publishable_mK9kyeWeOiYAc7lMBFiu4A_e3pwEaLT';
let supa = null;
function initSupa() {
  if (!window.supabase) return null;
  if (!supa) supa = window.supabase.createClient(SUPA_URL, SUPA_KEY, { realtime: { params: { eventsPerSecond: 10 } } });
  return supa;
}

const Cloud = {
  ok() { return !!initSupa(); },

  _mapLoja(l) {
    return {
      id: l.id, codigo: l.codigo, nome: l.nome, localidade: l.localidade,
      endereco: l.endereco || '',
      acessoId: l.acesso_id || '', senha: l.senha || '',
      solicitanteNome: l.solicitante_nome || '', cadastrado: !!l.cadastrado,
      criadoEm: l.criado_em,
      itens: (l.loja_itens || []).map(it => ({
        id: it.id, descricao: it.descricao,
        jan: it.jan|0, fev: it.fev|0, mar: it.mar|0, abr: it.abr|0,
        mai: it.mai|0, jun: it.jun|0, jul: it.jul|0, ago: it.ago|0,
        set: it.set|0, out: it.out|0, nov: it.nov|0, dez: it.dez|0,
        obs: it.obs||'', criadoEm: it.criado_em, historico: [],
      }))
    };
  },
  async atualizarSenhaLoja(lojaId, novaSenha){
    if (!this.ok()) return false;
    const { error } = await supa.from('lojas').update({ senha: novaSenha }).eq('id', lojaId);
    if (error) { toast('Erro ao salvar senha', error.message, 'error'); return false; }
    return true;
  },
  async atualizarAcessoLoja(lojaId, novoId){
    if (!this.ok()) return false;
    const { error } = await supa.from('lojas').update({ acesso_id: novoId }).eq('id', lojaId);
    if (error) { toast('Erro ao salvar ID', error.message, 'error'); return false; }
    return true;
  },
  async cadastrarLoja(lojaId, solicitante, novaSenha, endereco){
    if (!this.ok()) return false;
    // Atualiza senha no Supabase Auth (usuário já está logado com a senha padrão)
    const { error: authErr } = await supa.auth.updateUser({ password: novaSenha });
    if (authErr) { toast('Erro ao atualizar senha', authErr.message, 'error'); return false; }
    const patch = { solicitante_nome: solicitante, senha: novaSenha, cadastrado: true };
    if (endereco !== undefined) patch.endereco = endereco;
    const { error } = await supa.from('lojas').update(patch).eq('id', lojaId);
    if (error) { toast('Erro ao cadastrar', error.message, 'error'); return false; }
    return true;
  },
  async atualizarEnderecoLoja(lojaId, endereco){
    if (!this.ok()) return false;
    const { error } = await supa.from('lojas').update({ endereco }).eq('id', lojaId);
    if (error) { toast('Erro ao salvar endereço', error.message, 'error'); return false; }
    return true;
  },
  async resetarCadastroLoja(lojaId){
    if (!this.ok()) return false;
    // Chama função RPC server-side que reseta senha no Auth + zera cadastro
    const { error } = await supa.rpc('reset_loja_acesso', { p_loja_id: lojaId });
    if (error) { toast('Erro ao resetar', error.message, 'error'); return false; }
    return true;
  },

  /* === SUPABASE AUTH === */
  async signInLoja(codigoLoja, senha){
    if (!this.ok()) return { error: { message: 'Supabase offline' } };
    const email = `${codigoLoja}@solys.local`;
    return await supa.auth.signInWithPassword({ email, password: senha });
  },
  async signInDiretoria(senha){
    if (!this.ok()) return { error: { message: 'Supabase offline' } };
    return await supa.auth.signInWithPassword({ email: 'diretoria@solys.local', password: senha });
  },
  async signOut(){
    if (!this.ok()) return;
    await supa.auth.signOut();
  },
  async getSession(){
    if (!this.ok()) return null;
    const { data } = await supa.auth.getSession();
    return data.session;
  },
  _mapPedido(p) {
    return {
      id: p.id, lojaId: p.loja_id, lojaNome: p.loja_nome, lojaLocal: p.loja_local,
      data: p.data, solicitante: p.solicitante, observacao: p.observacao,
      anexos: p.anexos || [], itens: p.itens || [], historico: p.historico || [],
      status: p.status, respondidoPor: p.respondido_por || '', respostaAdmin: p.resposta_admin || '',
      criadoEm: p.criado_em,
    };
  },

  async loadLojas() {
    if (!this.ok()) return null;
    const { data, error } = await supa.from('lojas').select('*, loja_itens(*)').order('nome');
    if (error) { console.warn('Cloud.loadLojas', error); return null; }
    return data.map(this._mapLoja);
  },
  async loadPedidos() {
    if (!this.ok()) return null;
    const { data, error } = await supa.from('pedidos').select('*').neq('status','Arquivado').order('criado_em', { ascending: false });
    if (error) { console.warn('Cloud.loadPedidos', error); return null; }
    return data.map(this._mapPedido);
  },

  async insertPedido(p) {
    if (!this.ok()) return null;
    const { data, error } = await supa.from('pedidos').insert({
      loja_id: p.lojaId, loja_nome: p.lojaNome, loja_local: p.lojaLocal,
      data: p.data, solicitante: p.solicitante, observacao: p.observacao,
      anexos: p.anexos || [], itens: p.itens || [], historico: p.historico || [],
      status: p.status || 'Pendente',
    }).select().single();
    if (error) { toast('Erro ao enviar pedido', error.message, 'error'); return null; }
    return this._mapPedido(data);
  },
  async updatePedido(id, patch) {
    if (!this.ok()) return false;
    const row = {};
    const map = { status:'status', respondidoPor:'respondido_por', respostaAdmin:'resposta_admin',
                  historico:'historico', itens:'itens', observacao:'observacao',
                  solicitante:'solicitante', data:'data', anexos:'anexos' };
    Object.keys(patch).forEach(k => { if (map[k]) row[map[k]] = patch[k]; });
    const { error } = await supa.from('pedidos').update(row).eq('id', id);
    if (error) { toast('Erro ao atualizar', error.message, 'error'); return false; }
    return true;
  },
  async deletePedido(id) {
    if (!this.ok()) return false;
    const { error } = await supa.from('pedidos').delete().eq('id', id);
    if (error) { toast('Erro ao excluir', error.message, 'error'); return false; }
    return true;
  },

  async upsertLojaItem(lojaId, item) {
    if (!this.ok()) return false;
    const row = {
      loja_id: lojaId, descricao: (item.descricao||'').toUpperCase().trim(),
      jan: item.jan|0, fev: item.fev|0, mar: item.mar|0, abr: item.abr|0,
      mai: item.mai|0, jun: item.jun|0, jul: item.jul|0, ago: item.ago|0,
      set: item.set|0, out: item.out|0, nov: item.nov|0, dez: item.dez|0,
      obs: item.obs || '',
    };
    const { error } = await supa.from('loja_itens').upsert(row, { onConflict:'loja_id,descricao' });
    if (error) { console.warn('Cloud.upsertLojaItem', error); return false; }
    return true;
  },
  async incLojaItemMes(lojaId, descricao, mesKey, delta) {
    // SOMA na grade mensal — busca, soma, salva
    if (!this.ok()) return false;
    const desc = (descricao||'').toUpperCase().trim();
    const { data: existing } = await supa.from('loja_itens')
      .select('*').eq('loja_id', lojaId).eq('descricao', desc).maybeSingle();
    if (existing) {
      const novo = (existing[mesKey]|0) + (delta|0);
      const { error } = await supa.from('loja_itens').update({ [mesKey]: novo }).eq('id', existing.id);
      if (error) { console.warn('inc update', error); return false; }
    } else {
      const row = { loja_id: lojaId, descricao: desc, [mesKey]: delta|0 };
      const { error } = await supa.from('loja_itens').insert(row);
      if (error) { console.warn('inc insert', error); return false; }
    }
    return true;
  },

  _chans: [],
  subscribe(onPedidoChange, onLojaItemChange) {
    if (!this.ok()) return;
    this.unsubscribe();
    const c1 = supa.channel('rt-pedidos')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'pedidos' }, onPedidoChange)
      .subscribe();
    const c2 = supa.channel('rt-loja-itens')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'loja_itens' }, onLojaItemChange)
      .subscribe();
    this._chans = [c1, c2];
  },
  unsubscribe() {
    this._chans.forEach(c => { try { supa.removeChannel(c); } catch(e){} });
    this._chans = [];
  },
};

function detectarCategoria(itens, observacao=''){
  const text = (itens.map(i=>i.descricao).join(' ') + ' ' + observacao).toUpperCase();
  for (const c of CATEGORIAS) {
    if (c.match.some(t => text.includes(t))) return c.key;
  }
  return 'Geral';
}
function catInfo(k){ return CATEGORIAS.find(c=>c.key===k) || { key:k||'Geral', cls:'', icon:'package' }; }

function detectarUrgenciaPorTexto(t=''){
  const s = String(t).toLowerCase();
  return URGENT_KEYWORDS.some(k => s.includes(k));
}

/* SLA: retorna info do prazo (restante, vencido, cor) */
function calcularSLA(pedido){
  if (!pedido) return null;
  const sla = prioInfo(pedido.prioridade).sla; // horas
  const criado = new Date(pedido.criadoEm).getTime();
  const limite = criado + sla*3600*1000;
  const restante = limite - Date.now();
  const horasRest = restante / 3600000;
  if (pedido.status !== 'Pendente' && pedido.status !== 'Aprovado') {
    return { texto: 'concluído', cls:'ok', vencido:false };
  }
  if (restante <= 0) return { texto: `vencido ${fmt.ago(new Date(limite))}`, cls:'danger', vencido:true, horas:horasRest };
  if (horasRest < 4) return { texto: `${Math.floor(horasRest)}h restantes`, cls:'warn', vencido:false, horas:horasRest };
  if (horasRest < 24) return { texto: `${Math.floor(horasRest)}h restantes`, cls:'warn', vencido:false, horas:horasRest };
  return { texto: `${Math.floor(horasRest)}h restantes`, cls:'ok', vencido:false, horas:horasRest };
}

/* ----------------------------------------------------------------
   v2 · IA SOLYS — heurísticas locais inteligentes
   ---------------------------------------------------------------- */
const IA = {
  // detecta itens recorrentes a partir do histórico de uma loja
  recorrentesDaLoja(lojaId, n=8){
    const map = {};
    state.pedidos.filter(p => p.lojaId === lojaId).forEach(p => {
      p.itens.forEach(i => {
        const k = i.descricao.toUpperCase().trim();
        if (!map[k]) map[k] = { descricao:k, ocorrencias:0, total:0, ultima:null };
        map[k].ocorrencias++;
        map[k].total += (i.quantidade||0);
        if (!map[k].ultima || new Date(p.data) > new Date(map[k].ultima)) map[k].ultima = p.data;
      });
    });
    return Object.values(map).sort((a,b)=>b.ocorrencias-a.ocorrencias).slice(0,n);
  },
  // detecta itens repetidos no MESMO pedido (potencial duplicidade)
  itensRepetidosNoPedido(itens){
    const c = {};
    itens.forEach(i => { const k = i.descricao.toUpperCase().trim(); c[k]=(c[k]||0)+1; });
    return Object.entries(c).filter(([,v])=>v>1).map(([k])=>k);
  },
  // sugere estoque baseado em consumo médio (planilha mensal das lojas)
  sugestaoEstoque(loja, mes){
    if (!loja) return [];
    const m = mes || mesAtualKey();
    const idx = MESES.indexOf(m);
    return loja.itens.map(it => {
      const usados = MESES.slice(0, idx+1).map(mm=>it[mm]|0).filter(v=>v>0);
      const media = usados.length ? Math.ceil(usados.reduce((s,v)=>s+v,0)/usados.length) : 0;
      const atual = it[m]|0;
      const recomenda = media > atual ? media - atual : 0;
      return { descricao: it.descricao, media, atual, recomenda };
    }).filter(x => x.recomenda > 0).sort((a,b)=>b.recomenda-a.recomenda).slice(0,8);
  },
  // detecta pedidos urgentes que precisam de atenção
  pedidosUrgentes(){
    return state.pedidos.filter(p => {
      if (p.status !== 'Pendente' && p.status !== 'Aprovado') return false;
      if (p.prioridade === 'Crítico' || p.prioridade === 'Alto') return true;
      const sla = calcularSLA(p);
      return sla && sla.vencido;
    }).sort((a,b) => {
      const sa = calcularSLA(a); const sb = calcularSLA(b);
      return (sa?.horas||999) - (sb?.horas||999);
    });
  },
  // itens mais pedidos em todas as lojas (últimos 30 dias)
  itensMaisPedidos(n=10, dias=30){
    const limite = Date.now() - dias*86400*1000;
    const map = {};
    state.pedidos.filter(p=>new Date(p.criadoEm).getTime() >= limite).forEach(p => {
      p.itens.forEach(i => {
        const k = i.descricao.toUpperCase().trim();
        map[k] = (map[k]||0) + (i.quantidade||0);
      });
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
  },
  // lojas que mais solicitam (últimos N dias)
  lojasMaisAtivas(n=5, dias=30){
    const limite = Date.now() - dias*86400*1000;
    const map = {};
    state.pedidos.filter(p=>new Date(p.criadoEm).getTime() >= limite).forEach(p => {
      map[p.lojaId] = map[p.lojaId] || { id:p.lojaId, nome:p.lojaNome, local:p.lojaLocal, ct:0, itens:0 };
      map[p.lojaId].ct++;
      map[p.lojaId].itens += p.itens.reduce((s,i)=>s+(i.quantidade||0),0);
    });
    return Object.values(map).sort((a,b)=>b.ct-a.ct).slice(0,n);
  },
  // tempo médio de aprovação em horas (Pendente → próximo status)
  tempoMedioAprovacao(){
    const tempos = [];
    state.pedidos.forEach(p => {
      if (!p.historico) return;
      const criado = new Date(p.criadoEm).getTime();
      const mov = p.historico.find(h => h.action && h.action.startsWith('status:'));
      if (mov) tempos.push((new Date(mov.at).getTime() - criado) / 3600000);
    });
    if (!tempos.length) return null;
    const media = tempos.reduce((s,v)=>s+v,0)/tempos.length;
    return { horas: media, n: tempos.length };
  },
  // insights gerais — array de cards para o painel IA
  insights(){
    const out = [];
    const urg = this.pedidosUrgentes();
    if (urg.length) out.push({
      type:'urgent', icon:'alert-octagon',
      title:`<b>${urg.length}</b> pedido${urg.length>1?'s':''} ${urg.length>1?'precisam':'precisa'} de atenção imediata`,
      sub:`SLA estourado ou prioridade crítica`,
      action:()=>navigate('pedidos-colab')
    });
    // lojas com aumento de pedidos
    const ativas = this.lojasMaisAtivas(3);
    if (ativas.length) out.push({
      type:'recurring', icon:'trending-up',
      title:`<b>${ativas[0].nome}</b> é a loja mais ativa (${ativas[0].ct} pedidos)`,
      sub:`No total ${ativas[0].itens} itens nos últimos 30 dias`,
      action:()=>navigate('central')
    });
    // itens mais pedidos
    const top = this.itensMaisPedidos(1, 30);
    if (top.length) out.push({
      type:'recurring', icon:'repeat',
      title:`Item mais solicitado: <b>${top[0][0]}</b>`,
      sub:`${top[0][1]} unidades nos últimos 30 dias — considere compra centralizada`,
      action:()=>navigate('ia')
    });
    // tempo médio
    const t = this.tempoMedioAprovacao();
    if (t) out.push({
      type:'stock', icon:'timer',
      title:`Tempo médio de aprovação: <b>${t.horas.toFixed(1)}h</b>`,
      sub:`Calculado sobre ${t.n} pedido${t.n>1?'s':''} já movimentado${t.n>1?'s':''}`,
      action:()=>navigate('ia')
    });
    // automação ativa
    if (AUTOM.autoAprovaAteValor > 0) out.push({
      type:'stock', icon:'zap',
      title:`Auto-aprovação ativa até <b>${fmt.brl(AUTOM.autoAprovaAteValor)}</b>`,
      sub:`Pedidos abaixo desse valor são aprovados automaticamente`,
      action:()=>navigate('automacoes')
    });
    return out;
  }
};

/* ----------------------------------------------------------------
   v2 · NOTIFICAÇÕES INTERNAS (in-app, persistentes) + SOM
   ---------------------------------------------------------------- */
const NotifCenter = {
  async push(notif){
    const n = {
      id: uid(),
      at: new Date().toISOString(),
      read: false,
      ...notif,
    };
    state.notifications.unshift(n);
    if (state.notifications.length > 200) state.notifications = state.notifications.slice(0,200);
    await Storage.set('solys:notifications', state.notifications);
    if (AUTOM.somNotificacao && notif.sound !== false) playNotificationSound(notif.type);
    refreshBellCount();
    if (document.getElementById('notifPop')?.classList.contains('active')) renderNotifBody();
  },
  async markRead(id){
    const n = state.notifications.find(x=>x.id===id);
    if (n && !n.read) { n.read = true; await Storage.set('solys:notifications', state.notifications); refreshBellCount(); }
  },
  async markAllRead(){
    state.notifications.forEach(n => n.read = true);
    await Storage.set('solys:notifications', state.notifications);
    refreshBellCount();
    renderNotifBody();
  }
};

function playNotificationSound(type='info'){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    const freq = type==='danger' ? 440 : type==='success' ? 880 : 660;
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start();
    o.stop(ctx.currentTime + 0.4);
    // segundo "ping" para urgentes
    if (type === 'danger') {
      setTimeout(()=>{
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.connect(g2); g2.connect(ctx.destination);
        o2.frequency.value = 520; o2.type = 'sine';
        g2.gain.setValueAtTime(0, ctx.currentTime);
        g2.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
        o2.start(); o2.stop(ctx.currentTime + 0.35);
      }, 180);
    }
  } catch(e) {}
}

function toggleSound(){
  AUTOM.somNotificacao = !AUTOM.somNotificacao;
  salvarAutomacoes();
  const btn = document.getElementById('muteBtn');
  btn.classList.toggle('muted', !AUTOM.somNotificacao);
  btn.innerHTML = AUTOM.somNotificacao ? '<i data-lucide="volume-2"></i>' : '<i data-lucide="volume-x"></i>';
  lucide.createIcons();
  toast(AUTOM.somNotificacao ? 'Som ativado' : 'Som silenciado', '', 'info');
}

function refreshBellCount(){
  const unread = state.notifications.filter(n => !n.read).length;
  const el = document.getElementById('bellCount');
  if (!el) return;
  if (unread > 0) { el.textContent = unread > 99 ? '99+' : unread; el.style.display = 'grid'; }
  else el.style.display = 'none';
}

function toggleNotifPop(ev){
  if (ev) ev.stopPropagation();
  const pop = document.getElementById('notifPop');
  pop.classList.toggle('active');
  if (pop.classList.contains('active')) renderNotifBody();
}

function renderNotifBody(){
  const body = document.getElementById('notifBody');
  if (!body) return;
  if (!state.notifications.length) {
    body.innerHTML = `<div class="notif-empty"><i data-lucide="bell-off"></i><div>Nenhuma notificação ainda</div></div>`;
    lucide.createIcons(); return;
  }
  const iconMap = { info:'info', success:'check-circle', warn:'alert-triangle', danger:'alert-octagon', gold:'sparkles', new:'bell' };
  body.innerHTML = state.notifications.slice(0,40).map(n => `
    <div class="notif-row ${n.read?'':'unread'}" onclick="onClickNotif('${n.id}')">
      <div class="ic ${n.type||''}"><i data-lucide="${iconMap[n.type]||'bell'}"></i></div>
      <div class="notif-text">
        ${n.text}
        <div class="nt-time">${fmt.ago(n.at)}</div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

async function onClickNotif(id){
  const n = state.notifications.find(x=>x.id===id);
  if (!n) return;
  await NotifCenter.markRead(id);
  if (n.route) navigate(n.route);
  document.getElementById('notifPop').classList.remove('active');
}

async function markAllRead(){ await NotifCenter.markAllRead(); }

const fmt = {
  brl(n) {
    if (n == null || isNaN(n)) return 'R$ 0,00';
    return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
  },
  num(n) {
    if (n == null || isNaN(n)) return '0';
    return new Intl.NumberFormat('pt-BR').format(n);
  },
  date(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('pt-BR');
  },
  datetime(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  },
  ago(d) {
    if (!d) return '—';
    const diff = (Date.now() - new Date(d).getTime()) / 1000;
    if (diff < 60) return 'agora';
    if (diff < 3600) return Math.floor(diff/60) + ' min atrás';
    if (diff < 86400) return Math.floor(diff/3600) + 'h atrás';
    if (diff < 2592000) return Math.floor(diff/86400) + ' dias atrás';
    return fmt.date(d);
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* Lê ano/mês direto da string YYYY-MM-DD evitando o bug de timezone
   (new Date('2026-06-01') vira 31/05 em UTC-3). */
function isoToMesIdx(iso){
  if (!iso) return new Date().getMonth();
  const m = /^(\d{4})-(\d{2})/.exec(String(iso));
  return m ? parseInt(m[2])-1 : new Date(iso).getMonth();
}
function isoToAno(iso){
  if (!iso) return new Date().getFullYear();
  const m = /^(\d{4})/.exec(String(iso));
  return m ? parseInt(m[1]) : new Date(iso).getFullYear();
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function hashRecord(obj) {
  // Hash simples para deduplicação (apenas campos-chave)
  const str = JSON.stringify(obj, Object.keys(obj).sort()).toLowerCase();
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
  return h.toString(36);
}

function toast(title, desc = '', type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'check-circle', warning:'alert-triangle', error:'x-circle', info:'info' };
  el.innerHTML = `
    <div class="toast-icon"><i data-lucide="${icons[type]||'info'}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${desc ? `<div class="toast-desc">${escapeHtml(desc)}</div>` : ''}
    </div>
  `;
  container.appendChild(el);
  lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; }, 3500);
  setTimeout(() => el.remove(), 3900);
}

async function initAuth() {
  // Carrega usuários do storage (usado pela gestão); se vazio, semeia padrões
  let users = await Storage.get('solys:users', null);
  if (!users) {
    users = [
      { id: uid(), name:'Luís Gustavo', email:'admin@solys.com.br', pass:'solys2026', role:'Administrador', sector:'Diretoria', createdAt: new Date().toISOString() },
      { id: uid(), name:'Karoline Rodrigues', email:'diretoria@solys.com.br', pass:'solys2026', role:'Diretoria', sector:'Diretoria', createdAt: new Date().toISOString() },
    ];
    await Storage.set('solys:users', users);
  }
  state.users = users;

  // Garante que as lojas estejam carregadas (necessárias na tela inicial)
  // Tenta Supabase primeiro; cache local como fallback
  let lojas = null;
  if (Cloud.ok()) lojas = await Cloud.loadLojas();
  if (!Array.isArray(lojas) || !lojas.length) lojas = await Storage.get('solys:lojas', null);
  if (!Array.isArray(lojas) || !lojas.length) lojas = seedLojas();
  state.lojas = lojas;
  await Storage.set('solys:lojas', state.lojas);

  // Sessão ativa? — exige sessão Supabase Auth válida
  const session = await Storage.get('solys:session', null);
  const authSession = await Cloud.getSession();
  if (session && authSession) {
    if (session.tipo === 'loja') {
      const loja = state.lojas.find(l => l.id === session.lojaId);
      if (loja) { state.user = pseudoUserLoja(loja); enterApp(); return; }
    } else {
      const u = users.find(x => x.id === session.userId);
      if (u) { state.user = u; enterApp(); return; }
    }
  } else if (session && !authSession) {
    // Sessão local vazia: limpa pra forçar novo login
    await Storage.del('solys:session');
  }
  showLogin();
}

  // Popula o select com as lojas (ordem alfabética)
  const sel = document.getElementById('loginLojaSelect');

  const lojaId = document.getElementById('loginLojaSelect')?.value;
  if (!lojaId) { toast('Atenção','Selecione sua loja','warning'); return; }

async function loginLoja(lojaId){
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) { toast('Erro','Loja não encontrada','error'); return; }
  const senha = (document.getElementById(`lpw-${lojaId}`)?.value || '');
  if (!senha) { toast('Atenção','Informe a senha','warning'); return; }

  // Tenta autenticar via Supabase Auth (signInWithPassword)
  const { data, error } = await Cloud.signInLoja(loja.codigo, senha);
  if (error || !data?.session) {
    toast('Acesso negado', 'Senha incorreta', 'error');
    return;
  }

  // Atualiza loja com dados frescos do server
  const { data: fresh } = await supa.from('lojas').select('*').eq('id', lojaId).single();
  if (fresh) {
    Object.assign(loja, Cloud._mapLoja(fresh));
  }

  // Se loja ainda não cadastrou: abre modal de cadastro (continua logada na Auth)
  if (!loja.cadastrado) {
    abrirCadastroPrimeiroAcesso(lojaId);
    return;
  }

  state.user = pseudoUserLoja(loja);
  await Storage.set('solys:session', { tipo:'loja', lojaId: loja.id, at: new Date().toISOString() });
  await pushLog('login', `Entrada pela loja ${loja.nome} (${loja.solicitanteNome||'?'})`, { loja: loja.nome });
  enterApp();
}

  if (!loja) return;
  // Defensivo: se por qualquer motivo já estiver cadastrada, não abre
  if (loja.cadastrado) {
    toast('Loja já cadastrada','Acesso é único — entre com a senha pessoal','warning');
    return;
  }
  openModal({
    title:`Primeiro acesso · ${loja.nome}`,
    body:`
      <div style="background:rgba(200,155,60,.08);border:1px solid rgba(200,155,60,.2);border-radius:10px;padding:12px;margin-bottom:14px;font-size:12.5px;color:var(--ink-200);line-height:1.55">
        <b style="color:var(--gold-300);display:block;margin-bottom:4px"><i data-lucide="info" style="width:12px;height:12px;display:inline-block;vertical-align:-1px"></i> Cadastro único.</b>
        Esse cadastro pode ser feito <b>apenas uma vez</b>. Depois de salvar, somente você (com sua senha pessoal) e a Diretoria terão acesso. Confira tudo antes de confirmar.
      </div>
      <label class="fld-label">Seu nome completo</label>
      <input type="text" id="cadNome" class="fld" placeholder="Ex: Luís Gustavo" autofocus />
      <label class="fld-label" style="margin-top:12px">Endereço completo da loja</label>
      <input type="text" id="cadEndereco" class="fld" placeholder="Ex: Av. Bezerra de Menezes, 1234 — Bairro, Fortaleza/CE" value="${escapeHtml(loja.endereco||'')}" />
      <label class="fld-label" style="margin-top:12px">Nova senha</label>
      <input type="password" id="cadSenha1" class="fld" placeholder="Mín. 6 caracteres" />
      <label class="fld-label" style="margin-top:12px">Confirme a nova senha</label>
      <input type="password" id="cadSenha2" class="fld" placeholder="Repita a senha" onkeydown="if(event.key==='Enter')concluirCadastroLoja('${lojaId}')" />
    `,
    actions:`
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn gold" onclick="concluirCadastroLoja('${lojaId}')"><i data-lucide="user-plus"></i>Cadastrar e entrar</button>
    `
  });
  setTimeout(()=>{ lucide.createIcons(); document.getElementById('cadNome')?.focus(); },60);

async function concluirCadastroLoja(lojaId){
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) return;
  const nome = (document.getElementById('cadNome').value||'').trim();
  const endereco = (document.getElementById('cadEndereco').value||'').trim();
  const s1 = document.getElementById('cadSenha1').value || '';
  const s2 = document.getElementById('cadSenha2').value || '';
  if (!nome || nome.length < 2) { toast('Atenção','Informe seu nome completo','warning'); return; }
  if (!endereco || endereco.length < 5) { toast('Atenção','Informe o endereço completo da loja','warning'); return; }
  if (s1.length < 6) { toast('Atenção','A senha precisa ter no mínimo 6 caracteres','warning'); return; }
  if (s1 !== s2) { toast('Atenção','As senhas não conferem','warning'); return; }

  // Re-checa no servidor antes de salvar — evita corrida de cadastro duplo
  if (Cloud.ok()) {
    const { data: fresh } = await supa.from('lojas').select('cadastrado,solicitante_nome').eq('id', lojaId).maybeSingle();
    if (fresh && fresh.cadastrado) {
      // Atualiza estado local com a versão mais nova
      loja.cadastrado = true;
      loja.solicitanteNome = fresh.solicitante_nome || loja.solicitanteNome;
      closeModal();
      toast('Loja já cadastrada', `${fresh.solicitante_nome || 'Outro usuário'} já registrou o acesso`, 'warning');
      showLogin();
      return;
    }
  }

  loja.solicitanteNome = nome;
  loja.endereco = endereco;
  loja.senha = s1;
  loja.cadastrado = true;
  if (Cloud.ok()) await Cloud.cadastrarLoja(lojaId, nome, s1, endereco);
  await Storage.set('solys:lojas', state.lojas);

  state.user = pseudoUserLoja(loja);
  await Storage.set('solys:session', { tipo:'loja', lojaId: loja.id, at: new Date().toISOString() });
  await pushLog('loja-cadastro', `${nome} cadastrou ${loja.nome} (${endereco})`);
  closeModal();
  toast('Cadastro concluído',`Bem-vindo(a), ${nome}`, 'success');
  enterApp();
}

async function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('active');
  await carregarAutomacoes();
  await loadAllData();
  updateUserChip();
  applyRoleVisibility();
  // Sincroniza botão de mute com preferência salva
  const mb = document.getElementById('muteBtn');
  if (mb) {
    mb.classList.toggle('muted', !AUTOM.somNotificacao);
    mb.innerHTML = AUTOM.somNotificacao ? '<i data-lucide="volume-2"></i>' : '<i data-lucide="volume-x"></i>';
  }
  refreshBellCount();
  // Rota inicial: loja vai pra Minha Lista, gestão vai pra Pedidos das lojas (onde caem os pedidos)
  const startRoute = (state.user.role === 'Colaborador') ? 'minha-lista' : 'pedidos-colab';
  navigate(startRoute);
  setTimeout(()=>lucide.createIcons(),50);
  // Inicia real-time polling após app aberto
  startLivePolling();
}

function updateUserChip() {
  if (!state.user) return;
  // Para loja: mostra o nome do solicitante; para gestão: nome do usuário
  const displayName = state.user.isLoja && state.user.solicitante
                    ? state.user.solicitante
                    : state.user.name;
  const initials = displayName.replace('Loja ','').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('userName').textContent = displayName;
  document.getElementById('userRole').textContent = state.user.isLoja
    ? `${state.user.name.replace('Loja ','')} · ${state.user.sector||''}`
    : state.user.role;
}

function applyRoleVisibility() {
  const role = state.user.role;
  // Mostra/esconde seções e itens com base em data-roles
  document.querySelectorAll('[data-roles]').forEach(el => {
    const allowed = el.dataset.roles.split(',').map(s=>s.trim());
    el.style.display = allowed.includes(role) ? '' : 'none';
  });
  // Esconde a topbar de import/export para colaborador
  const topActions = document.querySelector('.topbar-actions');
  if (topActions) {
    const isColab = role === 'Colaborador';
    topActions.querySelectorAll('.icon-btn').forEach(b => {
      const title = b.getAttribute('title') || '';
      if (isColab && (title === 'Importar' || title === 'Exportar')) b.style.display = 'none';
      else b.style.display = '';
    });
    // Esconde busca global para colaborador (não precisa)
    const search = document.querySelector('.search-global');
    if (search) search.style.display = isColab ? 'none' : '';
  }
}

/* ----------------------------------------------------------------
   DATA LOADING / SEEDING
   ---------------------------------------------------------------- */
async function loadAllData() {
  // Dados puramente locais (preferências, logs do usuário)
  state.purchases = await Storage.get('solys:purchases', []) || [];
  state.requests = await Storage.get('solys:requests', []) || [];
  state.documents = await Storage.get('solys:documents', []);
  state.logs = await Storage.get('solys:logs', []);
  state.notifications = await Storage.get('solys:notifications', []);
  state.colabRequests = await Storage.get('solys:colab_requests', []);

  // SUPABASE — fonte da verdade para lojas e pedidos
  if (Cloud.ok()) {
    const [lojas, pedidos] = await Promise.all([Cloud.loadLojas(), Cloud.loadPedidos()]);
    if (Array.isArray(lojas) && lojas.length) {
      state.lojas = lojas;
      await Storage.set('solys:lojas', lojas);    // cache local
    } else {
      // backend não retornou nada — usa cache local ou semeia
      state.lojas = await Storage.get('solys:lojas', null);
      if (!Array.isArray(state.lojas) || !state.lojas.length) state.lojas = seedLojas();
    }
    state.pedidos = Array.isArray(pedidos) ? pedidos : (await Storage.get('solys:pedidos', []) || []);
  } else {
    // offline / SDK não carregou
    state.lojas = await Storage.get('solys:lojas', null);
    if (!Array.isArray(state.lojas) || !state.lojas.length) {
      state.lojas = seedLojas();
      await Storage.set('solys:lojas', state.lojas);
    }
    state.pedidos = await Storage.get('solys:pedidos', []) || [];
  }
}

/* Handler de eventos realtime do Supabase — pedidos chegam e a tela atualiza */
async function onCloudPedidoEvent(payload) {
  const ev = payload.eventType;
  if (ev === 'INSERT' && payload.new) {
    const p = Cloud._mapPedido(payload.new);
    // Evita duplicar se já tem (o autor já vê o pedido localmente)
    if (!state.pedidos.find(x => x.id === p.id)) {
      state.pedidos.unshift(p);
      // Notificação só pra gestão (autor da loja já viu)
      if (state.user && state.user.role !== 'Colaborador') {
        await NotifCenter.push({
          type:'new',
          text:`Novo pedido de <b>${escapeHtml(p.lojaNome)}</b> · ${escapeHtml(p.solicitante)} · <span class="muted">${p.itens.length} itens</span>`,
          route:'pedidos-colab',
        });
      }
    }
  } else if (ev === 'UPDATE' && payload.new) {
    const p = Cloud._mapPedido(payload.new);
    const idx = state.pedidos.findIndex(x => x.id === p.id);
    if (idx >= 0) {
      const before = state.pedidos[idx];
      state.pedidos[idx] = p;
      // Colaborador é notificado quando o status do SEU pedido muda
      if (before.status !== p.status && state.user?.role === 'Colaborador' && state.user.lojaPreferida === p.lojaId) {
        await NotifCenter.push({
          type: p.status==='Aprovado'||p.status==='Entregue' ? 'success' : p.status==='Rejeitado' ? 'danger' : 'info',
          text:`Seu pedido (${MES_NOME[isoToMesIdx(p.data)]}/${isoToAno(p.data)}) mudou para <b>${escapeHtml(p.status)}</b>`,
          route:'minha-lista',
        });
      }
    } else {
      state.pedidos.unshift(p);
    }
  } else if (ev === 'DELETE' && payload.old) {
    state.pedidos = state.pedidos.filter(x => x.id !== payload.old.id);
  }
  await Storage.set('solys:pedidos', state.pedidos);
  updateBadges();
  if (['central','pedidos-colab','minha-lista','dashboard'].includes(state.route)) renderRoute();
}

async function onCloudLojaItemEvent(payload) {
  // Recarrega lojas do servidor pra refletir a grade atual
  if (!Cloud.ok()) return;
  const lojas = await Cloud.loadLojas();
  if (lojas) {
    state.lojas = lojas;
    await Storage.set('solys:lojas', lojas);
    if (['lojas','loja-detalhe','minha-lista'].includes(state.route)) renderRoute();
  }
}

function seedLojas() {
  return LOJAS_SEED.map(loja => ({
    id: uid(),
    codigo: loja.codigo,
    nome: loja.nome,
    localidade: loja.localidade,
    acessoId: (loja.codigo||'XXX').slice(0,3).toUpperCase() + Math.floor(1000+Math.random()*9000),
    senha: 'Sgroup@2026#',
    criadoEm: new Date().toISOString(),
    itens: loja.itens.map(it => ({
      id: uid(),
      descricao: it.descricao,
      jan: it.jan|0, fev: it.fev|0, mar: it.mar|0, abr: it.abr|0,
      mai: it.mai|0, jun: it.jun|0, jul: it.jul|0, ago: it.ago|0,
      set: it.set|0, out: it.out|0, nov: it.nov|0, dez: it.dez|0,
      obs: it.obs || '',
      criadoEm: new Date().toISOString(),
      historico: [{ at: new Date().toISOString(), by:'Sistema (seed)', action:'item criado' }],
    })),
  }));
}

/* ----------------------------------------------------------------
   LOGS (histórico permanente, append-only)
   ---------------------------------------------------------------- */
async function pushLog(action, message, details = {}) {
  const entry = {
    id: uid(),
    at: new Date().toISOString(),
    by: state.user ? state.user.name : 'Sistema',
    role: state.user ? state.user.role : 'sistema',
    action,
    message,
    details,
  };
  state.logs.unshift(entry);
  // Mantém últimos 1000 registros para não estourar storage
  if (state.logs.length > 1000) state.logs = state.logs.slice(0, 1000);
  await Storage.set('solys:logs', state.logs);
}

function toggleMobileSidebar(){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (!sb) return;
  const open = sb.classList.toggle('mobile-open');
  if (bd) bd.classList.toggle('show', open);
}
function closeMobileSidebar(){
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebarBackdrop');
  if (sb) sb.classList.remove('mobile-open');
  if (bd) bd.classList.remove('show');
}

};

function navigate(route) {
  // Colaborador só pode navegar para sua própria lista
  if (state.user && state.user.role === 'Colaborador' && route !== 'minha-lista') {
    route = 'minha-lista';
  }
  state.route = route;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.route === route);
  });
  const mt = document.getElementById('topbarMobileTitle');
  if (mt) mt.textContent = ROUTE_TITLES[route] || 'SOLYS';
  closeMobileSidebar();
  renderRoute();
}

function renderRoute() {
  const c = document.getElementById('content');
  c.style.opacity = '0';
  setTimeout(() => {
    switch(state.route) {
      case 'dashboard': renderDashboard(); break;
      case 'lojas': renderLojas(); break;
      case 'loja-detalhe': renderLojaDetalhe(); break;
      case 'compras': renderCompras(); break;
      case 'solicitacoes': renderSolicitacoes(); break;
      case 'pedidos-colab': renderPedidosColab(); break;
      case 'minha-lista': renderMinhaLista(); break;
      case 'documentos': renderDocumentos(); break;
      case 'importar': renderImportar(); break;
      case 'historico': renderHistorico(); break;
      case 'relatorios': renderRelatorios(); break;
      case 'search': renderSearch(); break;
      case 'usuarios': renderUsuarios(); break;
      case 'configuracoes': renderConfig(); break;
      case 'acessos': renderAcessos(); break;
      default: renderDashboard();
    }
    updateBadges();
    setTimeout(()=>{ lucide.createIcons(); c.style.opacity = '1'; }, 30);
  }, 80);
}

function updateBadges() {
  const setBadge = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  setBadge('badgeCompras', state.purchases.length);
  setBadge('badgeSolic', state.requests.filter(r=>r.status==='Pendente').length);
  setBadge('badgeLojas', state.lojas.length);
  const pendentesPed = state.pedidos.filter(p => p.status==='Pendente').length;
  setBadge('badgeColab', pendentesPed);
  if (state.user && state.user.lojaPreferida) {
    const mine = state.pedidos.filter(p => p.lojaId === state.user.lojaPreferida && p.status==='Pendente').length;
    setBadge('badgeMinhaLista', mine);
  }
}

/* CHARTS */
function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; }
}

function drawChartEvolucao() {
  const ctx = document.getElementById('chartEvolucao');
  if (!ctx) return;
  destroyChart('evolucao');

  // Agrupa por mês dos últimos 12 meses
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    months.push({ key: d.toISOString().slice(0,7), label: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') });
  }
  const data = months.map(m => state.purchases.filter(p=>p.data && p.data.startsWith(m.key)).reduce((s,p)=>s+(parseFloat(p.valor)||0),0));

  const grad = ctx.getContext('2d').createLinearGradient(0,0,0,280);
  grad.addColorStop(0,'rgba(200,155,60,0.4)');
  grad.addColorStop(1,'rgba(200,155,60,0)');

  state.charts.evolucao = new Chart(ctx, {
    type:'line',
    data:{
      labels: months.map(m=>m.label),
      datasets:[{
        label:'Compras',
        data,
        borderColor:'#C89B3C',
        backgroundColor:grad,
        borderWidth:2.5,
        tension:0.4,
        fill:true,
        pointRadius:0,
        pointHoverRadius:6,
        pointHoverBackgroundColor:'#C89B3C',
        pointHoverBorderColor:'#fff',
        pointHoverBorderWidth:2,
      }]
    },
    options: chartOpts({ tickCallback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' })
  });
}

function drawChartSetor() {
  const ctx = document.getElementById('chartSetor');
  if (!ctx) return;
  destroyChart('setor');
  const map = {};
  state.purchases.forEach(p => { map[p.setor] = (map[p.setor]||0) + (parseFloat(p.valor)||0); });
  const top = Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const colors = ['#C89B3C','#2e74c9','#34d399','#fbbf24','#60a5fa','#a78bfa'];
  state.charts.setor = new Chart(ctx, {
    type:'doughnut',
    data:{
      labels: top.map(t=>t[0]),
      datasets:[{
        data: top.map(t=>t[1]),
        backgroundColor: colors,
        borderColor:'#0d1120',
        borderWidth:3,
        hoverOffset:8,
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      cutout:'68%',
      plugins:{
        legend:{
          position:'bottom',
          labels:{ color:'#c4ccdb', font:{family:'Outfit',size:11}, padding:10, usePointStyle:true, pointStyle:'circle' }
        },
        tooltip:{
          backgroundColor:'rgba(13,17,32,.95)',
          titleColor:'#fff', bodyColor:'#c4ccdb',
          borderColor:'rgba(255,255,255,.1)', borderWidth:1,
          padding:12, cornerRadius:8,
          callbacks:{ label: ctx => ` ${ctx.label}: ${fmt.brl(ctx.parsed)}` }
        }
      }
    }
  });
}

function drawChartStatus() {
  const ctx = document.getElementById('chartStatus');
  if (!ctx) return;
  destroyChart('status');
  const counts = {};
  PURCHASE_STATUS.forEach(s => counts[s] = state.purchases.filter(p=>p.status===s).length);
  const colors = { 'Pendente':'#fbbf24','Aprovado':'#60a5fa','Processando':'#a78bfa','Concluído':'#34d399','Rejeitado':'#f87171' };
  state.charts.status = new Chart(ctx, {
    type:'bar',
    data:{
      labels:Object.keys(counts),
      datasets:[{
        data:Object.values(counts),
        backgroundColor:Object.keys(counts).map(s=>colors[s]+'cc'),
        borderColor:Object.keys(counts).map(s=>colors[s]),
        borderWidth:1.5,
        borderRadius:8,
        borderSkipped:false,
      }]
    },
    options: chartOpts({ legend:false, beginAtZero:true })
  });
}

function chartOpts(opt = {}) {
  return {
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{ display: opt.legend !== false, labels:{color:'#c4ccdb'} },
      tooltip:{
        backgroundColor:'rgba(13,17,32,.95)',
        titleColor:'#fff', bodyColor:'#c4ccdb',
        borderColor:'rgba(255,255,255,.1)', borderWidth:1,
        padding:12, cornerRadius:8,
        callbacks: opt.tickCallback ? { label: c => ' ' + (typeof c.parsed.y === 'number' ? fmt.brl(c.parsed.y) : c.parsed) } : undefined,
      }
    },
    scales:{
      x:{ grid:{color:'rgba(255,255,255,.04)',drawBorder:false}, ticks:{color:'#8b95a8',font:{family:'Outfit'}} },
      y:{ beginAtZero: opt.beginAtZero !== false, grid:{color:'rgba(255,255,255,.04)',drawBorder:false}, ticks:{color:'#8b95a8',font:{family:'Outfit'},callback: opt.tickCallback} }
    }
  };
}

    document.getElementById('fStatus').addEventListener('change', e => { comprasFilter.status = e.target.value; comprasFilter.page = 1; renderComprasTable(); });
