.month-card.has-data{background:linear-gradient(180deg, rgba(96,165,250,0.08), rgba(96,165,250,0.02)) !important;border-color:rgba(96,165,250,0.18) !important}
.month-card.has-data .mc-name{color:#93C5FD !important}
.month-card.atual{
  background:linear-gradient(180deg, rgba(193,148,56,0.14), rgba(193,148,56,0.04)) !important;
  border-color:rgba(193,148,56,0.4) !important;
  box-shadow:0 0 0 1px rgba(193,148,56,0.12), 0 0 16px rgba(193,148,56,.12) !important;
}
.month-card.atual .mc-name{color:var(--gold-400) !important}
.month-card.atual::after{background:var(--gold-500) !important;box-shadow:0 0 8px var(--gold-500) !important}
.month-card.sel{
  background:linear-gradient(180deg, rgba(193,148,56,0.25), rgba(193,148,56,0.08)) !important;
  border-color:var(--gold-400) !important;
  box-shadow:0 0 0 2px rgba(193,148,56,0.18), 0 8px 20px rgba(193,148,56,.18) !important;
  transform:translateY(-2px);
}
.month-card.sel .mc-name{color:#fff !important}
.month-detail{
  background:rgba(0,0,0,0.22) !important;
  border:1px solid rgba(193,148,56,0.18) !important;
  border-radius:14px !important;
}
.month-detail .md-title{color:var(--text-primary) !important;font-weight:600}
.month-detail .md-title b{color:var(--gold-300) !important}
.month-detail .md-sub{color:var(--text-muted) !important}

/* ===== REF GRID ===== */
.ref-item{
  background:rgba(255,255,255,0.025) !important;
  border:1px solid rgba(255,255,255,0.05) !important;
  border-radius:10px !important;
  padding:10px 13px !important;
}
.ref-qtd{
  background:linear-gradient(135deg, rgba(193,148,56,.18), rgba(193,148,56,.06)) !important;
  border:1px solid rgba(193,148,56,.28) !important;
  color:var(--gold-300) !important;
  font-weight:700;
}
.ref-desc{color:var(--text-primary) !important}

/* ===== ACESSO CARDS ===== */
.acesso-card{padding:20px !important}
.acesso-card .ac-nome{color:var(--text-primary) !important;font-weight:600 !important;font-size:14.5px;letter-spacing:-0.01em}
.acesso-card .ac-local{color:var(--text-muted) !important;font-size:10px;letter-spacing:0.12em;font-weight:600}
.acesso-card .ac-fields{
  background:rgba(0,0,0,0.25) !important;
  border:1px solid rgba(255,255,255,0.04) !important;
  border-radius:12px !important;
  padding:14px !important;
}
.acesso-card .ac-lbl{color:var(--text-muted) !important;font-weight:700;letter-spacing:0.16em}
.acesso-card .ac-val{
  background:rgba(255,255,255,0.03) !important;
  border:1px solid rgba(255,255,255,0.05) !important;
  color:var(--text-primary) !important;
  font-family:'Inter',monospace !important;letter-spacing:0.04em;
}
.acesso-card .ac-status.ok{background:linear-gradient(135deg, rgba(52,211,153,.18), rgba(52,211,153,.05)) !important;color:#86EFAC !important;border:1px solid rgba(52,211,153,.32) !important}
.acesso-card .ac-status.pend{background:linear-gradient(135deg, rgba(193,148,56,.18), rgba(193,148,56,.05)) !important;color:var(--gold-300) !important;border:1px solid rgba(193,148,56,.32) !important}

/* ===== LOJA CARDS ===== */
.loja-card{padding:18px 20px !important;border-radius:16px !important}
.loja-icon{
  background:linear-gradient(135deg, rgba(193,148,56,0.22), rgba(193,148,56,0.06)) !important;
  border:1px solid rgba(193,148,56,0.26) !important;
  color:var(--gold-400) !important;
  width:42px !important;height:42px !important;
  box-shadow:0 4px 14px rgba(193,148,56,.12);
}
.loja-name{color:var(--text-primary) !important;font-weight:600 !important;letter-spacing:-0.01em}
.loja-local{color:var(--text-muted) !important;font-size:11px;letter-spacing:0.06em;font-weight:500}
.loja-arrow{color:var(--text-muted) !important}
.loja-card:hover{border-color:rgba(193,148,56,0.32) !important;box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 16px 48px -16px rgba(193,148,56,0.16) !important}
.loja-card:hover .loja-arrow{color:var(--gold-400) !important;transform:translateX(4px)}

/* ===== LOJA TABLE (monthly grid) ===== */
.loja-table-wrap{background:rgba(0,0,0,.18) !important;border:1px solid rgba(255,255,255,.05) !important;border-radius:14px !important}
.loja-table thead th{
  background:rgba(255,255,255,.02) !important;
  color:var(--text-muted) !important;
  letter-spacing:0.08em;font-weight:700;
  font-size:10.5px;
}
.loja-table thead th.col-now{background:rgba(193,148,56,.08) !important;color:var(--gold-400) !important}
.loja-table tbody td{border-bottom:1px solid rgba(255,255,255,.03) !important}
.loja-table tbody tr:hover{background:rgba(255,255,255,.02) !important}
.loja-table tbody td.col-now{background:rgba(193,148,56,.03) !important}
.loja-table tfoot th{background:rgba(193,148,56,.05) !important;color:var(--gold-400) !important;border-top:1px solid rgba(193,148,56,.18) !important}
.loja-table tfoot th.col-now{background:rgba(193,148,56,.12) !important;color:#fff !important}
.sticky-left{background:rgba(10,15,30,.95) !important}
.loja-table thead .sticky-left, .loja-table tfoot .sticky-left{background:rgba(10,15,30,.98) !important}
.cell-input{color:var(--text-primary) !important}
.cell-input:hover{border-color:rgba(255,255,255,.1) !important}
.cell-input:focus{background:rgba(193,148,56,.06) !important;border-color:var(--gold-500) !important}

/* ===== MODAL ===== */
.modal-overlay{background:rgba(6,9,26,.7) !important;backdrop-filter:blur(12px)}
.modal{
  background:linear-gradient(180deg, rgba(20,27,48,0.94), rgba(13,17,34,0.96)) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-radius:22px !important;
  backdrop-filter:blur(40px) saturate(180%) !important;
  box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 24px 60px -10px rgba(0,0,0,.6) !important;
}
.modal-head{border-bottom:1px solid rgba(255,255,255,0.05) !important;padding:24px 28px 18px !important}
.modal-title{color:var(--text-primary) !important;font-family:'Inter','Manrope',sans-serif !important;font-weight:600 !important;letter-spacing:-0.02em}
.modal-body{padding:24px 28px !important}
.modal-footer{border-top:1px solid rgba(255,255,255,0.05) !important;padding:18px 28px 24px !important}
.modal-close{color:var(--text-muted) !important;border-radius:10px}
.modal-close:hover{background:rgba(255,255,255,.05) !important;color:var(--text-primary) !important}
.modal-body label{color:var(--text-muted) !important;font-weight:600;letter-spacing:0.04em}
.modal-body input, .modal-body select, .modal-body textarea{
  background:rgba(255,255,255,0.025) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  color:var(--text-primary) !important;
  border-radius:11px !important;
}
.modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus{
  background:rgba(193,148,56,.04) !important;
  border-color:var(--gold-500) !important;
  box-shadow:0 0 0 3px rgba(193,148,56,.12) !important;
}

/* ===== DETAIL HERO MODAL ===== */
.pd-hero-v2{
  background:linear-gradient(135deg, rgba(31,58,102,0.4) 0%, rgba(13,17,34,0.3) 100%) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-radius:16px !important;
  padding:20px !important;
}
.pd-hero-v2 .pd-ic{border-radius:13px !important;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pd-hero-v2 .pd-info h3{color:var(--text-primary) !important;font-family:'Inter','Manrope',sans-serif !important;font-weight:700 !important;letter-spacing:-0.02em}
.pd-hero-v2 .pd-info p{color:var(--text-muted) !important;letter-spacing:0.1em;font-weight:600;font-size:10.5px}
.pd-meta-grid{border:1px solid rgba(255,255,255,0.06) !important;border-radius:13px !important;background:rgba(255,255,255,.03) !important}
.pd-meta-cell{background:rgba(13,17,34,0.5) !important}
.pd-meta-cell .lbl{color:var(--text-muted) !important;letter-spacing:0.16em;font-weight:700}
.pd-meta-cell .val{color:var(--text-primary) !important;font-weight:500}
.pd-meta-cell .val b{color:var(--gold-300) !important}
.pd-section-h{color:var(--text-muted) !important;font-weight:700;letter-spacing:0.16em}
.pd-itens-box{background:rgba(0,0,0,0.3) !important;border:1px solid rgba(255,255,255,0.05) !important;border-radius:13px !important}
.pd-itens-head{background:rgba(255,255,255,0.03) !important;color:var(--text-muted) !important;letter-spacing:0.16em;font-weight:700;border-bottom:1px solid rgba(255,255,255,0.05) !important}
.pd-item-row{color:var(--text-primary) !important;border-bottom:1px solid rgba(255,255,255,0.03) !important}
.pd-it-qtd{color:var(--gold-400) !important;font-weight:700}
.pd-it-un{color:var(--text-muted) !important}
.pd-it-desc{color:var(--text-primary) !important}
.pd-obs{
  background:linear-gradient(135deg, rgba(193,148,56,0.09), rgba(193,148,56,0.02)) !important;
  border-left:3px solid var(--gold-500) !important;
  color:var(--text-secondary) !important;
}
.pd-resp{
  background:linear-gradient(135deg, rgba(96,165,250,0.08), rgba(96,165,250,0.02)) !important;
  border-left:3px solid #60A5FA !important;
  color:var(--text-secondary) !important;
}
.pd-resp b{color:#93C5FD !important;letter-spacing:0.1em;font-weight:700}
.pd-timeline{background:rgba(0,0,0,0.22) !important;border:1px solid rgba(255,255,255,0.05) !important}
.pd-tl-title{color:var(--text-secondary) !important}
.pd-tl-title b{color:var(--text-primary) !important}
.pd-tl-meta{color:var(--text-muted) !important}

/* ===== TOAST ===== */
.toast{
  background:linear-gradient(135deg, rgba(20,27,48,0.96), rgba(13,17,34,0.96)) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-radius:14px !important;
  backdrop-filter:blur(30px) saturate(180%);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 16px 40px -16px rgba(0,0,0,.6) !important;
}
.toast-title{color:var(--text-primary) !important;font-weight:600}
.toast-desc{color:var(--text-muted) !important}
.toast.success{border-left:3px solid #34D399}
.toast.warning{border-left:3px solid #F0B83B}
.toast.error{border-left:3px solid #F87171}
.toast.info{border-left:3px solid #60A5FA}

/* ===== ANEXO CHIP ===== */
.anexo-chip{
  background:rgba(255,255,255,0.04) !important;
  border:1px solid rgba(255,255,255,0.06) !important;
  color:var(--text-secondary) !important;
  border-radius:8px;
}
.anexo-chip svg{color:var(--gold-400) !important}

/* ===== CMD-K ===== */
.cmdk-overlay{background:rgba(6,9,26,.6) !important;backdrop-filter:blur(16px)}
.cmdk{
  background:linear-gradient(180deg, rgba(20,27,48,0.96), rgba(13,17,34,0.96)) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-radius:18px !important;
  box-shadow:0 24px 60px -10px rgba(0,0,0,.6) !important;
  backdrop-filter:blur(40px) saturate(180%);
}
.cmdk-input{border-bottom:1px solid rgba(255,255,255,0.05) !important;padding:18px 20px !important}
.cmdk-input input{color:var(--text-primary) !important}
.cmdk-input svg{color:var(--text-muted) !important}
.cmdk-result{padding:11px 14px !important;border-radius:10px !important}
.cmdk-result:hover, .cmdk-result.sel{background:rgba(193,148,56,.12) !important}
.cmdk-result .ic{background:rgba(255,255,255,.05) !important;color:var(--gold-400) !important}
.cmdk-result .txt strong{color:var(--text-primary) !important}
.cmdk-result .txt small{color:var(--text-muted) !important}
.cmdk-result .kbd{background:rgba(255,255,255,.05) !important;border:1px solid rgba(255,255,255,.05);color:var(--text-muted) !important}

/* ===== NOTIF POP ===== */
.notif-pop{
  background:linear-gradient(180deg, rgba(20,27,48,0.96), rgba(13,17,34,0.96)) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-radius:18px !important;
  backdrop-filter:blur(40px) saturate(180%) !important;
  box-shadow:0 24px 60px -10px rgba(0,0,0,.6) !important;
}
.notif-pop > header{border-bottom:1px solid rgba(255,255,255,0.05) !important}
.notif-pop > header h4{color:var(--text-primary) !important;font-family:'Inter','Manrope',sans-serif !important;font-weight:600}
.notif-pop .notif-empty{color:var(--text-muted) !important}
.notif-row{padding:13px 14px !important;border-radius:10px}
.notif-row:hover{background:rgba(255,255,255,.04) !important}
.notif-row.unread{background:linear-gradient(135deg, rgba(193,148,56,0.08), rgba(193,148,56,0.02)) !important}
.notif-row.unread::before{background:var(--gold-500);box-shadow:0 0 10px var(--gold-500)}
.notif-text{color:var(--text-secondary) !important}
.notif-text .nt-time{color:var(--text-muted) !important}

/* ===== EMPTY / MUTED ===== */
.empty-state{color:var(--text-muted) !important}
.empty-state svg{color:var(--text-muted) !important;opacity:.5}
.empty-state h3{color:var(--text-secondary) !important;font-family:'Inter','Manrope',sans-serif !important;font-weight:600}
.muted{color:var(--text-muted) !important}

/* ===== PAGINATION ===== */
.pagination{border-top:1px solid rgba(255,255,255,.04) !important;color:var(--text-muted) !important}
.pagination button{color:var(--text-secondary) !important;border-radius:8px}
.pagination button:hover{background:rgba(255,255,255,.04) !important;color:var(--text-primary) !important}
.pagination button.active{
  background:linear-gradient(135deg, var(--gold-500), var(--gold-600)) !important;
  color:#0F1322 !important;font-weight:700 !important;
  box-shadow:0 4px 14px rgba(193,148,56,.25);
}

/* ===== TIMELINE ===== */
.tl-item{border-color:rgba(255,255,255,.05) !important}
.tl-title{color:var(--text-primary) !important}
.tl-title strong{color:var(--gold-300) !important}
.tl-meta{color:var(--text-muted) !important}
.tl-details{background:rgba(0,0,0,.25) !important;border-color:rgba(255,255,255,.05) !important;color:var(--text-secondary) !important}

/* ===== ACTIVITY ===== */
.activity-item{padding:13px 10px !important;border-radius:10px}
.activity-item:hover{background:rgba(255,255,255,.025) !important}
.activity-icon{
  background:rgba(96,165,250,0.1) !important;color:#93C5FD !important;
  width:34px;height:34px;border-radius:10px;
}
.activity-icon.gold{background:rgba(193,148,56,0.12) !important;color:var(--gold-400) !important}
.activity-icon.green{background:rgba(52,211,153,.1) !important;color:#86EFAC !important}
.activity-icon.amber{background:rgba(240,184,59,.12) !important;color:#FCD34D !important}
.activity-text{color:var(--text-secondary) !important;font-size:13px;line-height:1.5}
.activity-text strong{color:var(--text-primary) !important;font-weight:600}
.activity-meta{color:var(--text-muted) !important;font-size:11px}

/* ===== AI PANEL ===== */
.ai-panel{
  background:
    radial-gradient(400px 200px at 100% 0%, rgba(167,139,250,.12), transparent 60%),
    linear-gradient(180deg, rgba(20,27,48,0.6) 0%, rgba(13,17,34,0.65) 100%) !important;
  border:1px solid rgba(167,139,250,0.22) !important;
}
.ai-badge{
  background:linear-gradient(135deg, rgba(167,139,250,.2), rgba(96,165,250,.08)) !important;
  border:1px solid rgba(167,139,250,.32) !important;
  color:#C4B5FD !important;
}

/* ===== EXEC HERO (original — keep refinements consistent) ===== */
.exec-hero{
  background:
    radial-gradient(800px 300px at 90% -10%, rgba(193,148,56,.1), transparent 60%),
    radial-gradient(700px 300px at 10% 110%, rgba(31,58,102,.18), transparent 60%),
    linear-gradient(180deg, rgba(20,27,48,0.7) 0%, rgba(13,17,34,0.72) 100%) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  border-radius:22px !important;
  padding:28px 32px !important;
}

/* ===== IMPORT ZONE ===== */
.import-zone{
  background:rgba(255,255,255,0.015) !important;
  border:2px dashed rgba(255,255,255,0.1) !important;
  border-radius:18px !important;
}
.import-zone:hover{border-color:var(--gold-500) !important;background:rgba(193,148,56,.03) !important}
.import-zone svg{color:var(--gold-400) !important}
.import-zone h3{color:var(--text-primary) !important;font-family:'Inter','Manrope',sans-serif !important}
.import-zone p{color:var(--text-muted) !important}
.import-zone .format{background:rgba(255,255,255,0.04) !important;color:var(--text-secondary) !important;font-family:'Inter',monospace}

/* ===== FORM PEDIDO ===== */
.fld{
  background:rgba(255,255,255,0.025) !important;
  border:1px solid rgba(255,255,255,0.08) !important;
  color:var(--text-primary) !important;
  border-radius:11px !important;
}
.fld:focus{
  background:rgba(193,148,56,0.04) !important;
  border-color:var(--gold-500) !important;
  box-shadow:0 0 0 3px rgba(193,148,56,.12) !important;
}
.fld-label{color:var(--text-muted) !important;font-weight:600;letter-spacing:0.04em}

/* ===== KANBAN ===== */
.kcol{
  background:linear-gradient(180deg, rgba(20,27,48,0.4), rgba(13,17,34,0.5)) !important;
  border:1px solid rgba(255,255,255,.04) !important;
  border-radius:14px !important;
}
.kcol-card{
  background:linear-gradient(180deg, rgba(20,27,48,0.65), rgba(13,17,34,0.55)) !important;
  border:1px solid rgba(255,255,255,.06) !important;
  border-radius:11px !important;
}
.kcol-card:hover{border-color:rgba(193,148,56,.3) !important;transform:translateY(-1px)}

/* ===== EDITOR PEDIDO (Diretoria) ===== */
.eg-head{border-bottom:1px solid rgba(255,255,255,.05) !important;padding:0 4px 10px !important}
.eg-th{color:var(--text-muted) !important;font-weight:700;letter-spacing:0.16em}
.eg-row .fld{background:rgba(255,255,255,0.025) !important;border-color:rgba(255,255,255,0.08) !important;color:var(--text-primary) !important}

/* ===== Chips genéricos refinados ===== */
.chip{
  background:rgba(255,255,255,0.04) !important;
  border:1px solid rgba(255,255,255,0.06) !important;
  color:var(--text-secondary) !important;
  font-weight:500 !important;
}
.chip.active{
  background:linear-gradient(135deg, rgba(193,148,56,0.18), rgba(193,148,56,0.06)) !important;
  border:1px solid rgba(193,148,56,0.32) !important;
  color:var(--gold-300) !important;
}
.chip.success{background:rgba(52,211,153,.1) !important;color:#86EFAC !important;border-color:rgba(52,211,153,.22) !important}
.chip.warning{background:rgba(240,184,59,.12) !important;color:#FCD34D !important;border-color:rgba(240,184,59,.25) !important}
.chip.danger{background:rgba(248,113,113,.12) !important;color:#FCA5A5 !important;border-color:rgba(248,113,113,.28) !important}
.chip.info{background:rgba(96,165,250,.1) !important;color:#93C5FD !important;border-color:rgba(96,165,250,.22) !important}

/* ===== PRIO ===== */
.prio.critico{background:linear-gradient(135deg, rgba(248,113,113,.22), rgba(220,38,38,.08)) !important;border-color:rgba(248,113,113,.42) !important;color:#FCA5A5 !important;font-weight:700}
.prio.alto{background:linear-gradient(135deg, rgba(249,115,22,.2), rgba(234,88,12,.08)) !important;border-color:rgba(249,115,22,.36) !important;color:#FDBA74 !important;font-weight:700}
.prio.medio{background:linear-gradient(135deg, rgba(240,184,59,.16), rgba(217,119,6,.05)) !important;border-color:rgba(240,184,59,.32) !important;color:#FCD34D !important;font-weight:700}
.prio.baixo{background:rgba(167,176,194,.1) !important;border-color:rgba(167,176,194,.2) !important;color:var(--text-secondary) !important;font-weight:700}

/* ===== CAT TAGS ===== */
.cat-tag{
  background:rgba(96,165,250,0.08) !important;
  border:1px solid rgba(96,165,250,0.18) !important;
  color:#93C5FD !important;
}
.cat-tag.gold{background:rgba(193,148,56,.08) !important;border-color:rgba(193,148,56,.2) !important;color:var(--gold-300) !important}
.cat-tag.green{background:rgba(52,211,153,.08) !important;border-color:rgba(52,211,153,.22) !important;color:#86EFAC !important}
.cat-tag.violet{background:rgba(167,139,250,.08) !important;border-color:rgba(167,139,250,.22) !important;color:#C4B5FD !important}
.cat-tag.rose{background:rgba(244,114,182,.08) !important;border-color:rgba(244,114,182,.2) !important;color:#F9A8D4 !important}

/* ===== SLA ===== */
.sla{background:rgba(255,255,255,0.04) !important;border:1px solid rgba(255,255,255,0.06) !important;color:var(--text-muted) !important;font-weight:600;letter-spacing:0.02em}
.sla.warn{background:rgba(240,184,59,.1) !important;border-color:rgba(240,184,59,.25) !important;color:#FCD34D !important}
.sla.danger{background:rgba(248,113,113,.12) !important;border-color:rgba(248,113,113,.3) !important;color:#FCA5A5 !important}
.sla.ok{background:rgba(52,211,153,.08) !important;border-color:rgba(52,211,153,.22) !important;color:#86EFAC !important}

/* ===== ANIMAÇÕES PREMIUM ===== */
@keyframes solysFadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.panel, .kpi-card, .ped-v2, .acesso-card, .loja-card, .metric, .solys-hero{animation:solysFadeIn .4s cubic-bezier(.16,1,.3,1)}

@keyframes solysShimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(90deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.03) 100%) !important;
  background-size:200% 100% !important;
  animation:solysShimmer 1.8s infinite;
}

/* Selection */
::selection{background:rgba(193,148,56,.28);color:#fff}

/* Login lojas v2 (compatibilidade) */
.login-loja-v2{
  background:rgba(255,255,255,0.025) !important;
  border:1px solid rgba(255,255,255,0.06) !important;
  border-radius:12px !important;
}
.login-loja-v2:hover{background:rgba(193,148,56,.05) !important;border-color:rgba(193,148,56,.32) !important}
.login-loja-v2 .ll-input{background:rgba(0,0,0,.3) !important;border:1px solid rgba(255,255,255,.06) !important;color:var(--text-primary) !important}
.login-loja-v2 .ll-btn{
  background:linear-gradient(135deg, var(--gold-500), var(--gold-600)) !important;
  color:#0F1322 !important;
}

</style>
</head>

    <div class="field">
      <label>Loja</label>

      <label>Senha</label>

/* ----------------------------------------------------------------

   Em produção real isto seria substituído por chamadas Supabase.
   ---------------------------------------------------------------- */
const Storage = {
  async get(key, def = null) {
    try {
      // window.storage no host; fallback pra localStorage no browser comum
      if (window.storage?.get) {
        const r = await window.storage.get(key);
        return r && r.value ? JSON.parse(r.value) : def;
      }
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : def;
    } catch (e) { return def; }
  },
  async set(key, value) {
    try {
      if (window.storage?.set) { await window.storage.set(key, JSON.stringify(value)); return true; }
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { console.error('Storage set error', key, e); return false; }
  },
  async del(key) {
    try {
      if (window.storage?.delete) await window.storage.delete(key);
      else localStorage.removeItem(key);
    } catch (e) {}
  },
};

/* SLA: retorna info do prazo (restante, vencido, cor) */
function calcularSLA(pedido){
  if (!pedido) return null;
  const sla = prioInfo(pedido.prioridade).sla; // horas
  const criado = new Date(pedido.criadoEm).getTime();
  const limite = criado + sla*3600*1000;
  const restante = limite - Date.now();
  const horasRest = restante / 3600000;
  if (pedido.status !== 'Pendente' && pedido.status !== 'Aprovado') {
    return { texto: 'concluído', cls:'ok', vencido:false };
  }
  if (restante <= 0) return { texto: `vencido ${fmt.ago(new Date(limite))}`, cls:'danger', vencido:true, horas:horasRest };
  if (horasRest < 4) return { texto: `${Math.floor(horasRest)}h restantes`, cls:'warn', vencido:false, horas:horasRest };
  if (horasRest < 24) return { texto: `${Math.floor(horasRest)}h restantes`, cls:'warn', vencido:false, horas:horasRest };
  return { texto: `${Math.floor(horasRest)}h restantes`, cls:'ok', vencido:false, horas:horasRest };
}

/* ----------------------------------------------------------------
   v2 · IA SOLYS — heurísticas locais inteligentes
   ---------------------------------------------------------------- */
const IA = {
  // detecta itens recorrentes a partir do histórico de uma loja
  recorrentesDaLoja(lojaId, n=8){
    const map = {};
    state.pedidos.filter(p => p.lojaId === lojaId).forEach(p => {
      p.itens.forEach(i => {
        const k = i.descricao.toUpperCase().trim();
        if (!map[k]) map[k] = { descricao:k, ocorrencias:0, total:0, ultima:null };
        map[k].ocorrencias++;
        map[k].total += (i.quantidade||0);
        if (!map[k].ultima || new Date(p.data) > new Date(map[k].ultima)) map[k].ultima = p.data;
      });
    });
    return Object.values(map).sort((a,b)=>b.ocorrencias-a.ocorrencias).slice(0,n);
  },
  // detecta itens repetidos no MESMO pedido (potencial duplicidade)
  itensRepetidosNoPedido(itens){
    const c = {};
    itens.forEach(i => { const k = i.descricao.toUpperCase().trim(); c[k]=(c[k]||0)+1; });
    return Object.entries(c).filter(([,v])=>v>1).map(([k])=>k);
  },
  // sugere estoque baseado em consumo médio (planilha mensal das lojas)
  sugestaoEstoque(loja, mes){
    if (!loja) return [];
    const m = mes || mesAtualKey();
    const idx = MESES.indexOf(m);
    return loja.itens.map(it => {
      const usados = MESES.slice(0, idx+1).map(mm=>it[mm]|0).filter(v=>v>0);
      const media = usados.length ? Math.ceil(usados.reduce((s,v)=>s+v,0)/usados.length) : 0;
      const atual = it[m]|0;
      const recomenda = media > atual ? media - atual : 0;
      return { descricao: it.descricao, media, atual, recomenda };
    }).filter(x => x.recomenda > 0).sort((a,b)=>b.recomenda-a.recomenda).slice(0,8);
  },
  // detecta pedidos urgentes que precisam de atenção
  pedidosUrgentes(){
    return state.pedidos.filter(p => {
      if (p.status !== 'Pendente' && p.status !== 'Aprovado') return false;
      if (p.prioridade === 'Crítico' || p.prioridade === 'Alto') return true;
      const sla = calcularSLA(p);
      return sla && sla.vencido;
    }).sort((a,b) => {
      const sa = calcularSLA(a); const sb = calcularSLA(b);
      return (sa?.horas||999) - (sb?.horas||999);
    });
  },
  // itens mais pedidos em todas as lojas (últimos 30 dias)
  itensMaisPedidos(n=10, dias=30){
    const limite = Date.now() - dias*86400*1000;
    const map = {};
    state.pedidos.filter(p=>new Date(p.criadoEm).getTime() >= limite).forEach(p => {
      p.itens.forEach(i => {
        const k = i.descricao.toUpperCase().trim();
        map[k] = (map[k]||0) + (i.quantidade||0);
      });
    });
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,n);
  },
  // lojas que mais solicitam (últimos N dias)
  lojasMaisAtivas(n=5, dias=30){
    const limite = Date.now() - dias*86400*1000;
    const map = {};
    state.pedidos.filter(p=>new Date(p.criadoEm).getTime() >= limite).forEach(p => {
      map[p.lojaId] = map[p.lojaId] || { id:p.lojaId, nome:p.lojaNome, local:p.lojaLocal, ct:0, itens:0 };
      map[p.lojaId].ct++;
      map[p.lojaId].itens += p.itens.reduce((s,i)=>s+(i.quantidade||0),0);
    });
    return Object.values(map).sort((a,b)=>b.ct-a.ct).slice(0,n);
  },
  // tempo médio de aprovação em horas (Pendente → próximo status)
  tempoMedioAprovacao(){
    const tempos = [];
    state.pedidos.forEach(p => {
      if (!p.historico) return;
      const criado = new Date(p.criadoEm).getTime();
      const mov = p.historico.find(h => h.action && h.action.startsWith('status:'));
      if (mov) tempos.push((new Date(mov.at).getTime() - criado) / 3600000);
    });
    if (!tempos.length) return null;
    const media = tempos.reduce((s,v)=>s+v,0)/tempos.length;
    return { horas: media, n: tempos.length };
  },
  // insights gerais — array de cards para o painel IA
  insights(){
    const out = [];
    const urg = this.pedidosUrgentes();
    if (urg.length) out.push({
      type:'urgent', icon:'alert-octagon',
      title:`<b>${urg.length}</b> pedido${urg.length>1?'s':''} ${urg.length>1?'precisam':'precisa'} de atenção imediata`,
      sub:`SLA estourado ou prioridade crítica`,
      action:()=>navigate('pedidos-colab')
    });
    // lojas com aumento de pedidos
    const ativas = this.lojasMaisAtivas(3);
    if (ativas.length) out.push({
      type:'recurring', icon:'trending-up',
      title:`<b>${ativas[0].nome}</b> é a loja mais ativa (${ativas[0].ct} pedidos)`,
      sub:`No total ${ativas[0].itens} itens nos últimos 30 dias`,
      action:()=>navigate('central')
    });
    // itens mais pedidos
    const top = this.itensMaisPedidos(1, 30);
    if (top.length) out.push({
      type:'recurring', icon:'repeat',
      title:`Item mais solicitado: <b>${top[0][0]}</b>`,

    });

      title:`Tempo médio de aprovação: <b>${t.horas.toFixed(1)}h</b>`,

    });

      sub:`Pedidos abaixo desse valor são aprovados automaticamente`,
      action:()=>navigate('automacoes')
    });
    return out;

};

/* ----------------------------------------------------------------
   v2 · NOTIFICAÇÕES INTERNAS (in-app, persistentes) + SOM
   ---------------------------------------------------------------- */
const NotifCenter = {
  async push(notif){
    const n = {
      id: uid(),
      at: new Date().toISOString(),
      read: false,
      ...notif,
    };
    state.notifications.unshift(n);
    if (state.notifications.length > 200) state.notifications = state.notifications.slice(0,200);
    await Storage.set('solys:notifications', state.notifications);
    if (AUTOM.somNotificacao && notif.sound !== false) playNotificationSound(notif.type);
    refreshBellCount();
    if (document.getElementById('notifPop')?.classList.contains('active')) renderNotifBody();
  },
  async markRead(id){
    const n = state.notifications.find(x=>x.id===id);
    if (n && !n.read) { n.read = true; await Storage.set('solys:notifications', state.notifications); refreshBellCount(); }
  },
  async markAllRead(){
    state.notifications.forEach(n => n.read = true);
    await Storage.set('solys:notifications', state.notifications);
    refreshBellCount();
    renderNotifBody();
  }
};

function playNotificationSound(type='info'){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    const freq = type==='danger' ? 440 : type==='success' ? 880 : 660;
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.35);
    o.start();
    o.stop(ctx.currentTime + 0.4);
    // segundo "ping" para urgentes
    if (type === 'danger') {
      setTimeout(()=>{
        const o2 = ctx.createOscillator(); const g2 = ctx.createGain();
        o2.connect(g2); g2.connect(ctx.destination);
        o2.frequency.value = 520; o2.type = 'sine';
        g2.gain.setValueAtTime(0, ctx.currentTime);
        g2.gain.linearRampToValueAtTime(0.08, ctx.currentTime + 0.02);
        g2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
        o2.start(); o2.stop(ctx.currentTime + 0.35);
      }, 180);
    }
  } catch(e) {}
}

  const btn = document.getElementById('muteBtn');

const fmt = {
  brl(n) {
    if (n == null || isNaN(n)) return 'R$ 0,00';
    return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
  },
  num(n) {
    if (n == null || isNaN(n)) return '0';
    return new Intl.NumberFormat('pt-BR').format(n);
  },
  date(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('pt-BR');
  },
  datetime(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  },
  ago(d) {
    if (!d) return '—';
    const diff = (Date.now() - new Date(d).getTime()) / 1000;
    if (diff < 60) return 'agora';
    if (diff < 3600) return Math.floor(diff/60) + ' min atrás';
    if (diff < 86400) return Math.floor(diff/3600) + 'h atrás';
    if (diff < 2592000) return Math.floor(diff/86400) + ' dias atrás';
    return fmt.date(d);
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* Lê ano/mês direto da string YYYY-MM-DD evitando o bug de timezone
   (new Date('2026-06-01') vira 31/05 em UTC-3). */
function isoToMesIdx(iso){
  if (!iso) return new Date().getMonth();
  const m = /^(\d{4})-(\d{2})/.exec(String(iso));
  return m ? parseInt(m[2])-1 : new Date(iso).getMonth();
}
function isoToAno(iso){
  if (!iso) return new Date().getFullYear();
  const m = /^(\d{4})/.exec(String(iso));
  return m ? parseInt(m[1]) : new Date(iso).getFullYear();
}
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function hashRecord(obj) {
  // Hash simples para deduplicação (apenas campos-chave)
  const str = JSON.stringify(obj, Object.keys(obj).sort()).toLowerCase();
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
  return h.toString(36);
}

function toast(title, desc = '', type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'check-circle', warning:'alert-triangle', error:'x-circle', info:'info' };
  el.innerHTML = `
    <div class="toast-icon"><i data-lucide="${icons[type]||'info'}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${desc ? `<div class="toast-desc">${escapeHtml(desc)}</div>` : ''}
    </div>
  `;
  container.appendChild(el);
  lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; }, 3500);
  setTimeout(() => el.remove(), 3900);
}

async function initAuth() {
  // Carrega usuários do storage (usado pela gestão); se vazio, semeia padrões
  let users = await Storage.get('solys:users', null);
  if (!users) {
    users = [
      { id: uid(), name:'Luís Gustavo', email:'admin@solys.com.br', pass:'solys2026', role:'Administrador', sector:'Diretoria', createdAt: new Date().toISOString() },
      { id: uid(), name:'Karoline Rodrigues', email:'diretoria@solys.com.br', pass:'solys2026', role:'Diretoria', sector:'Diretoria', createdAt: new Date().toISOString() },
    ];
    await Storage.set('solys:users', users);
  }
  state.users = users;

  // Garante que as lojas estejam carregadas (necessárias na tela inicial)
  // Tenta Supabase primeiro; cache local como fallback
  let lojas = null;
  if (Cloud.ok()) lojas = await Cloud.loadLojas();
  if (!Array.isArray(lojas) || !lojas.length) lojas = await Storage.get('solys:lojas', null);
  if (!Array.isArray(lojas) || !lojas.length) lojas = seedLojas();
  state.lojas = lojas;
  await Storage.set('solys:lojas', state.lojas);

  // Sessão ativa?
  const session = await Storage.get('solys:session', null);
  if (session) {
    if (session.tipo === 'loja') {
      const loja = state.lojas.find(l => l.id === session.lojaId);
      if (loja) { state.user = pseudoUserLoja(loja); enterApp(); return; }
    } else {
      const u = users.find(x => x.id === session.userId);
      if (u) { state.user = u; enterApp(); return; }
    }
  }
  showLogin();
}

async function loginLoja(lojaId){
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) { toast('Erro','Loja não encontrada','error'); return; }
  const senha = (document.getElementById(`lpw-${lojaId}`)?.value || '');
  if (!senha) { toast('Atenção','Informe a senha','warning'); return; }

  // Senha atual da loja precisa bater
  if (senha !== (loja.senha||'')) {
    toast('Acesso negado','Senha incorreta','error');
    return;
  }

  // Se não cadastrada: abre modal pra cadastrar nome + nova senha
  if (!loja.cadastrado) {
    abrirCadastroPrimeiroAcesso(lojaId);
    return;
  }

  // Já cadastrada: entra direto
  state.user = pseudoUserLoja(loja);
  await Storage.set('solys:session', { tipo:'loja', lojaId: loja.id, at: new Date().toISOString() });
  await pushLog('login', `Entrada pela loja ${loja.nome} (${loja.solicitanteNome||'?'})`, { loja: loja.nome });
  enterApp();
}

      <input type="password" id="cadSenha2" class="fld" placeholder="Repita a senha" onkeydown="if(event.key==='Enter')concluirCadastroLoja('${lojaId}')" />
    `,
    actions:`
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn gold" onclick="concluirCadastroLoja('${lojaId}')"><i data-lucide="user-plus"></i>Cadastrar e entrar</button>
    `
  });
  setTimeout(()=>{ lucide.createIcons(); document.getElementById('cadNome')?.focus(); },60);
}

async function concluirCadastroLoja(lojaId){
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) return;
  const nome = (document.getElementById('cadNome').value||'').trim();
  const endereco = (document.getElementById('cadEndereco').value||'').trim();
  const s1 = document.getElementById('cadSenha1').value || '';
  const s2 = document.getElementById('cadSenha2').value || '';
  if (!nome || nome.length < 2) { toast('Atenção','Informe seu nome completo','warning'); return; }
  if (!endereco || endereco.length < 5) { toast('Atenção','Informe o endereço completo da loja','warning'); return; }
  if (s1.length < 6) { toast('Atenção','A senha precisa ter no mínimo 6 caracteres','warning'); return; }
  if (s1 !== s2) { toast('Atenção','As senhas não conferem','warning'); return; }

  // Re-checa no servidor antes de salvar — evita corrida de cadastro duplo
  if (Cloud.ok()) {
    const { data: fresh } = await supa.from('lojas').select('cadastrado,solicitante_nome').eq('id', lojaId).maybeSingle();
    if (fresh && fresh.cadastrado) {
      // Atualiza estado local com a versão mais nova
      loja.cadastrado = true;
      loja.solicitanteNome = fresh.solicitante_nome || loja.solicitanteNome;
      closeModal();
      toast('Loja já cadastrada', `${fresh.solicitante_nome || 'Outro usuário'} já registrou o acesso`, 'warning');
      showLogin();
      return;
    }
  }

  loja.solicitanteNome = nome;
  loja.endereco = endereco;
  loja.senha = s1;
  loja.cadastrado = true;
  if (Cloud.ok()) await Cloud.cadastrarLoja(lojaId, nome, s1, endereco);
  await Storage.set('solys:lojas', state.lojas);

  state.user = pseudoUserLoja(loja);
  await Storage.set('solys:session', { tipo:'loja', lojaId: loja.id, at: new Date().toISOString() });
  await pushLog('loja-cadastro', `${nome} cadastrou ${loja.nome} (${endereco})`);
  closeModal();
  toast('Cadastro concluído',`Bem-vindo(a), ${nome}`, 'success');
  enterApp();
}

function applyRoleVisibility() {
  const role = state.user.role;
  // Mostra/esconde seções e itens com base em data-roles
  document.querySelectorAll('[data-roles]').forEach(el => {
    const allowed = el.dataset.roles.split(',').map(s=>s.trim());
    el.style.display = allowed.includes(role) ? '' : 'none';

  // Esconde a topbar de import/export para colaborador
  const topActions = document.querySelector('.topbar-actions');
  if (topActions) {
    const isColab = role === 'Colaborador';
    topActions.querySelectorAll('.icon-btn').forEach(b => {
      const title = b.getAttribute('title') || '';
      if (isColab && (title === 'Importar' || title === 'Exportar')) b.style.display = 'none';
      else b.style.display = '';
    });
    // Esconde busca global para colaborador (não precisa)
    const search = document.querySelector('.search-global');
    if (search) search.style.display = isColab ? 'none' : '';
  }
}

async function loadAllData() {
  // Dados puramente locais (preferências, logs do usuário)
  state.purchases = await Storage.get('solys:purchases', []) || [];
  state.requests = await Storage.get('solys:requests', []) || [];
  state.documents = await Storage.get('solys:documents', []);

  state.colabRequests = await Storage.get('solys:colab_requests', []);

  // SUPABASE — fonte da verdade para lojas e pedidos
  if (Cloud.ok()) {
    const [lojas, pedidos] = await Promise.all([Cloud.loadLojas(), Cloud.loadPedidos()]);
    if (Array.isArray(lojas) && lojas.length) {
      state.lojas = lojas;
      await Storage.set('solys:lojas', lojas);    // cache local
    } else {
      // backend não retornou nada — usa cache local ou semeia
      state.lojas = await Storage.get('solys:lojas', null);
      if (!Array.isArray(state.lojas) || !state.lojas.length) state.lojas = seedLojas();
    }
    state.pedidos = Array.isArray(pedidos) ? pedidos : (await Storage.get('solys:pedidos', []) || []);
  } else {
    // offline / SDK não carregou
    state.lojas = await Storage.get('solys:lojas', null);
    if (!Array.isArray(state.lojas) || !state.lojas.length) {
      state.lojas = seedLojas();
      await Storage.set('solys:lojas', state.lojas);
    }
    state.pedidos = await Storage.get('solys:pedidos', []) || [];
  }
}

/* Handler de eventos realtime do Supabase — pedidos chegam e a tela atualiza */
async function onCloudPedidoEvent(payload) {
  const ev = payload.eventType;
  if (ev === 'INSERT' && payload.new) {
    const p = Cloud._mapPedido(payload.new);
    // Evita duplicar se já tem (o autor já vê o pedido localmente)
    if (!state.pedidos.find(x => x.id === p.id)) {
      state.pedidos.unshift(p);
      // Notificação só pra gestão (autor da loja já viu)
      if (state.user && state.user.role !== 'Colaborador') {
        await NotifCenter.push({
          type:'new',
          text:`Novo pedido de <b>${escapeHtml(p.lojaNome)}</b> · ${escapeHtml(p.solicitante)} · <span class="muted">${p.itens.length} itens</span>`,
          route:'pedidos-colab',
        });
      }
    }
  } else if (ev === 'UPDATE' && payload.new) {
    const p = Cloud._mapPedido(payload.new);
    const idx = state.pedidos.findIndex(x => x.id === p.id);
    if (idx >= 0) {
      const before = state.pedidos[idx];
      state.pedidos[idx] = p;
      // Colaborador é notificado quando o status do SEU pedido muda
      if (before.status !== p.status && state.user?.role === 'Colaborador' && state.user.lojaPreferida === p.lojaId) {
        await NotifCenter.push({
          type: p.status==='Aprovado'||p.status==='Entregue' ? 'success' : p.status==='Rejeitado' ? 'danger' : 'info',
          text:`Seu pedido (${MES_NOME[isoToMesIdx(p.data)]}/${isoToAno(p.data)}) mudou para <b>${escapeHtml(p.status)}</b>`,
          route:'minha-lista',
        });
      }
    } else {
      state.pedidos.unshift(p);
    }
  } else if (ev === 'DELETE' && payload.old) {
    state.pedidos = state.pedidos.filter(x => x.id !== payload.old.id);
  }
  await Storage.set('solys:pedidos', state.pedidos);
  updateBadges();
  if (['central','pedidos-colab','minha-lista','dashboard'].includes(state.route)) renderRoute();
}

async function onCloudLojaItemEvent(payload) {
  // Recarrega lojas do servidor pra refletir a grade atual
  if (!Cloud.ok()) return;
  const lojas = await Cloud.loadLojas();
  if (lojas) {
    state.lojas = lojas;
    await Storage.set('solys:lojas', lojas);
    if (['lojas','loja-detalhe','minha-lista'].includes(state.route)) renderRoute();
  }
}

function seedLojas() {
  return LOJAS_SEED.map(loja => ({
    id: uid(),
    codigo: loja.codigo,
    nome: loja.nome,
    localidade: loja.localidade,
    acessoId: (loja.codigo||'XXX').slice(0,3).toUpperCase() + Math.floor(1000+Math.random()*9000),
    senha: 'Sgroup@2026#',
    criadoEm: new Date().toISOString(),
    itens: loja.itens.map(it => ({
      id: uid(),
      descricao: it.descricao,
      jan: it.jan|0, fev: it.fev|0, mar: it.mar|0, abr: it.abr|0,
      mai: it.mai|0, jun: it.jun|0, jul: it.jul|0, ago: it.ago|0,
      set: it.set|0, out: it.out|0, nov: it.nov|0, dez: it.dez|0,
      obs: it.obs || '',
      criadoEm: new Date().toISOString(),
      historico: [{ at: new Date().toISOString(), by:'Sistema (seed)', action:'item criado' }],
    })),
  }));
}

/* ----------------------------------------------------------------
   LOGS (histórico permanente, append-only)
   ---------------------------------------------------------------- */
async function pushLog(action, message, details = {}) {
  const entry = {
    id: uid(),
    at: new Date().toISOString(),
    by: state.user ? state.user.name : 'Sistema',
    role: state.user ? state.user.role : 'sistema',
    action,
    message,
    details,
  };
  state.logs.unshift(entry);
  // Mantém últimos 1000 registros para não estourar storage
  if (state.logs.length > 1000) state.logs = state.logs.slice(0, 1000);
  await Storage.set('solys:logs', state.logs);
}

/* ----------------------------------------------------------------
   ROUTER
   ---------------------------------------------------------------- */
function navigate(route) {
  // Colaborador só pode navegar para sua própria lista
  if (state.user && state.user.role === 'Colaborador' && route !== 'minha-lista') {
    route = 'minha-lista';
  }
  state.route = route;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.route === route);
  });
  renderRoute();
}

function renderRoute() {
  const c = document.getElementById('content');
  c.style.opacity = '0';
  setTimeout(() => {
    switch(state.route) {
      case 'dashboard': renderDashboard(); break;
      case 'lojas': renderLojas(); break;
      case 'loja-detalhe': renderLojaDetalhe(); break;
      case 'compras': renderCompras(); break;
      case 'solicitacoes': renderSolicitacoes(); break;
      case 'pedidos-colab': renderPedidosColab(); break;
      case 'minha-lista': renderMinhaLista(); break;
      case 'documentos': renderDocumentos(); break;
      case 'importar': renderImportar(); break;
      case 'historico': renderHistorico(); break;
      case 'relatorios': renderRelatorios(); break;
      case 'search': renderSearch(); break;
      case 'usuarios': renderUsuarios(); break;
      case 'configuracoes': renderConfig(); break;
      case 'acessos': renderAcessos(); break;
      default: renderDashboard();
    }
    updateBadges();
    setTimeout(()=>{ lucide.createIcons(); c.style.opacity = '1'; }, 30);
  }, 80);
}

function updateBadges() {
  const setBadge = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  setBadge('badgeCompras', state.purchases.length);
  setBadge('badgeSolic', state.requests.filter(r=>r.status==='Pendente').length);
  setBadge('badgeLojas', state.lojas.length);
  const pendentesPed = state.pedidos.filter(p => p.status==='Pendente').length;
  setBadge('badgeColab', pendentesPed);
  if (state.user && state.user.lojaPreferida) {
    const mine = state.pedidos.filter(p => p.lojaId === state.user.lojaPreferida && p.status==='Pendente').length;
    setBadge('badgeMinhaLista', mine);
  }
}

function renderRecentActivity() {

  if (!el) return;
  const recent = state.logs.slice(0, 8);
  if (!recent.length) {
    el.innerHTML = '<div class="muted" style="padding:14px;font-size:13px">Nenhuma atividade ainda.</div>';
    return;
  }
  const iconMap = { login:'log-in', logout:'log-out', create:'plus-circle', update:'edit-3', delete:'trash-2', import:'upload', export:'download', seed:'database' };
  const colorMap = { login:'', logout:'', create:'green', update:'gold', delete:'amber', import:'gold', export:'', seed:'' };
  el.innerHTML = recent.map(l => `
    <div class="activity-item">
      <div class="activity-icon ${colorMap[l.action]||''}"><i data-lucide="${iconMap[l.action]||'circle'}"></i></div>
      <div class="activity-body">
        <div class="activity-text">${escapeHtml(l.message)}</div>
        <div class="activity-meta">${escapeHtml(l.by)} · ${fmt.ago(l.at)}</div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

/* CHARTS */
function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; }
}

function drawChartEvolucao() {
  const ctx = document.getElementById('chartEvolucao');
  if (!ctx) return;
  destroyChart('evolucao');

  // Agrupa por mês dos últimos 12 meses
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    months.push({ key: d.toISOString().slice(0,7), label: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') });
  }
  const data = months.map(m => state.purchases.filter(p=>p.data && p.data.startsWith(m.key)).reduce((s,p)=>s+(parseFloat(p.valor)||0),0));

  const grad = ctx.getContext('2d').createLinearGradient(0,0,0,280);
  grad.addColorStop(0,'rgba(200,155,60,0.4)');
  grad.addColorStop(1,'rgba(200,155,60,0)');

  state.charts.evolucao = new Chart(ctx, {
    type:'line',
    data:{
      labels: months.map(m=>m.label),
      datasets:[{
        label:'Compras',
        data,
        borderColor:'#C89B3C',
        backgroundColor:grad,
        borderWidth:2.5,
        tension:0.4,
        fill:true,
        pointRadius:0,
        pointHoverRadius:6,
        pointHoverBackgroundColor:'#C89B3C',
        pointHoverBorderColor:'#fff',
        pointHoverBorderWidth:2,
      }]
    },
    options: chartOpts({ tickCallback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' })
  });
}

function drawChartStatus() {
  const ctx = document.getElementById('chartStatus');
  if (!ctx) return;
  destroyChart('status');
  const counts = {};
  PURCHASE_STATUS.forEach(s => counts[s] = state.purchases.filter(p=>p.status===s).length);
  const colors = { 'Pendente':'#fbbf24','Aprovado':'#60a5fa','Processando':'#a78bfa','Concluído':'#34d399','Rejeitado':'#f87171' };
  state.charts.status = new Chart(ctx, {
    type:'bar',
    data:{
      labels:Object.keys(counts),
      datasets:[{
        data:Object.values(counts),
        backgroundColor:Object.keys(counts).map(s=>colors[s]+'cc'),
        borderColor:Object.keys(counts).map(s=>colors[s]),
        borderWidth:1.5,
        borderRadius:8,
        borderSkipped:false,
      }]
    },
    options: chartOpts({ legend:false, beginAtZero:true })
  });
}

function chartOpts(opt = {}) {
  return {
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{ display: opt.legend !== false, labels:{color:'#c4ccdb'} },
      tooltip:{
        backgroundColor:'rgba(13,17,32,.95)',
        titleColor:'#fff', bodyColor:'#c4ccdb',
        borderColor:'rgba(255,255,255,.1)', borderWidth:1,
        padding:12, cornerRadius:8,
        callbacks: opt.tickCallback ? { label: c => ' ' + (typeof c.parsed.y === 'number' ? fmt.brl(c.parsed.y) : c.parsed) } : undefined,
      }
    },
    scales:{
      x:{ grid:{color:'rgba(255,255,255,.04)',drawBorder:false}, ticks:{color:'#8b95a8',font:{family:'Outfit'}} },
      y:{ beginAtZero: opt.beginAtZero !== false, grid:{color:'rgba(255,255,255,.04)',drawBorder:false}, ticks:{color:'#8b95a8',font:{family:'Outfit'},callback: opt.tickCallback} }
    }
  };
}

function filterPurchases() {
  return state.purchases.filter(p => {
    if (comprasFilter.setor && p.setor !== comprasFilter.setor) return false;
    if (comprasFilter.status && p.status !== comprasFilter.status) return false;
    if (comprasFilter.q) {
      const q = comprasFilter.q.toLowerCase();
      const hit = [p.descricao,p.fornecedor,p.codigo,p.setor,p.status].some(v => v && String(v).toLowerCase().includes(q));
      if (!hit) return false;
    }
    return true;
  });
}

function renderComprasTable() {
  const filtered = filterPurchases();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / comprasFilter.perPage));
  if (comprasFilter.page > totalPages) comprasFilter.page = totalPages;
  const slice = filtered.slice((comprasFilter.page-1)*comprasFilter.perPage, comprasFilter.page*comprasFilter.perPage);
  document.getElementById('comprasTableBody').innerHTML = renderPurchaseTable(slice, true) + renderPagination(comprasFilter.page, totalPages, p=>{comprasFilter.page=p;renderComprasTable();}, total);
  lucide.createIcons();
}

function renderPurchaseTable(items, withActions) {
  if (!items.length) {
    return `<div class="empty-state"><i data-lucide="inbox"></i><h3>Nenhum registro encontrado</h3><p>Tente ajustar os filtros ou importar dados.</p></div>`;
  }
  return `

      <thead><tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Fornecedor</th>
        <th>Setor</th>

        <th>Valor</th>
        <th>Status</th>

      </tr></thead>
      <tbody>
        ${items.map(p => `
          <tr>
            <td><code style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gold-400)">${escapeHtml(p.codigo||'—')}</code></td>
            <td class="cell-strong">${escapeHtml(p.descricao||'—')}</td>

          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderPagination(page, totalPages, onPage, totalItems) {
  if (totalPages <= 1) return `<div class="pagination"><span>${totalItems||0} registro(s)</span></div>`;
  const buttons = [];
  buttons.push(`<button onclick="(${onPage.toString()})(${page-1})" ${page<=1?'disabled':''}><i data-lucide="chevron-left"></i></button>`);
  for (let i=1; i<=totalPages; i++) {
    if (i===1 || i===totalPages || Math.abs(i-page)<=1) {
      buttons.push(`<button class="${i===page?'active':''}" onclick="(${onPage.toString()})(${i})">${i}</button>`);
    } else if (Math.abs(i-page)===2) {
      buttons.push(`<span style="padding:0 4px;color:var(--ink-400)">…</span>`);
    }
  }
  buttons.push(`<button onclick="(${onPage.toString()})(${page+1})" ${page>=totalPages?'disabled':''}><i data-lucide="chevron-right"></i></button>`);
  return `<div class="pagination"><span>${totalItems} registro(s) · página ${page} de ${totalPages}</span><div class="pages">${buttons.join('')}</div></div>`;
}

async function openPurchaseModal(id) {
  const editing = id ? state.purchases.find(p=>p.id===id) : null;
  const data = editing || { codigo: 'CMP-' + (1000 + state.purchases.length), descricao:'', fornecedor:'', setor:'Operacional', valor:'', status:'Pendente', data:new Date().toISOString().slice(0,10), observacoes:'' };
  showModal({
    title: editing ? 'Editar compra' : 'Nova compra',
    body: `
      <div class="form-grid">
        <div class="field"><label>Código</label><input id="m_codigo" value="${escapeHtml(data.codigo)}" /></div>
        <div class="field"><label>Data</label><input id="m_data" type="date" value="${data.data||''}" /></div>
        <div class="field full"><label>Descrição</label><input id="m_descricao" value="${escapeHtml(data.descricao)}" placeholder="Ex.: Toner impressora HP" /></div>
        <div class="field"><label>Fornecedor</label><input id="m_fornecedor" value="${escapeHtml(data.fornecedor)}" /></div>
        <div class="field"><label>Setor</label><select id="m_setor">${SECTORS.map(s=>`<option value="${s}" ${data.setor===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Valor (R$)</label><input id="m_valor" type="number" step="0.01" value="${data.valor||''}" placeholder="0,00" /></div>
        <div class="field"><label>Status</label><select id="m_status">${PURCHASE_STATUS.map(s=>`<option value="${s}" ${data.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field full"><label>Observações</label><textarea id="m_obs" rows="3" placeholder="Observações internas...">${escapeHtml(data.observacoes||'')}</textarea></div>
      </div>
    `,
    onConfirm: async () => {
      const novo = {
        ...data,
        codigo: document.getElementById('m_codigo').value.trim(),
        descricao: document.getElementById('m_descricao').value.trim(),
        fornecedor: document.getElementById('m_fornecedor').value.trim(),
        setor: document.getElementById('m_setor').value,
        valor: parseFloat(document.getElementById('m_valor').value) || 0,
        status: document.getElementById('m_status').value,
        data: document.getElementById('m_data').value,
        observacoes: document.getElementById('m_obs').value.trim(),
      };
      if (!novo.descricao) { toast('Descrição obrigatória','','warning'); return false; }

      if (editing) {
        const changes = {};
        Object.keys(novo).forEach(k => { if (data[k] !== novo[k] && k !== 'historico') changes[k] = { de: data[k], para: novo[k] }; });
        novo.historico = [...(data.historico||[]), { at: new Date().toISOString(), by: state.user.name, action:'atualizado', changes }];
        const idx = state.purchases.findIndex(p=>p.id===editing.id);
        state.purchases[idx] = novo;
        await pushLog('update', `Compra <strong>${novo.codigo}</strong> atualizada`, { id: novo.id, changes });
        toast('Compra atualizada','Histórico de alteração registrado','success');
      } else {
        novo.id = uid();
        novo.criadoPor = state.user.name;
        novo.criadoEm = new Date().toISOString();
        novo.historico = [{ at: new Date().toISOString(), by: state.user.name, action:'criado' }];
        novo._hash = hashRecord({d:novo.descricao,f:novo.fornecedor,s:novo.setor,v:novo.valor});
        state.purchases.unshift(novo);
        await pushLog('create', `Nova compra <strong>${novo.codigo}</strong>: ${novo.descricao}`, { id: novo.id, valor: novo.valor });
        toast('Compra registrada','Registro adicionado ao sistema','success');
      }
      await Storage.set('solys:purchases', state.purchases);
      renderComprasTable();
      updateBadges();
      return true;
    }
  });
}

async function deletePurchase(id) {
  if (!confirm('Arquivar este registro? O dado permanece no histórico permanente.')) return;
  const p = state.purchases.find(x=>x.id===id);
  if (!p) return;
  // Arquivamento lógico — NÃO deleta, marca como arquivado
  p.arquivado = true;
  p.arquivadoEm = new Date().toISOString();
  p.arquivadoPor = state.user.name;
  // Para esta demo, removemos da lista visível mas guardamos em arquivo
  const arquivados = await Storage.get('solys:purchases:arquivo', []);
  arquivados.unshift(p);
  await Storage.set('solys:purchases:arquivo', arquivados);
  state.purchases = state.purchases.filter(x=>x.id!==id);
  await Storage.set('solys:purchases', state.purchases);
  await pushLog('delete', `Compra <strong>${p.codigo}</strong> arquivada`, { id });
  toast('Compra arquivada','O registro permanece no histórico','info');
  renderComprasTable();
  updateBadges();
}

async function changeRequestStatus(id) {
  const r = state.requests.find(x=>x.id===id);
  if (!r) return;
  const idx = PURCHASE_STATUS.indexOf(r.status);
  const next = PURCHASE_STATUS[(idx+1) % PURCHASE_STATUS.length];
  const before = r.status;
  r.status = next;
  await Storage.set('solys:requests', state.requests);
  await pushLog('update', `Solicitação <strong>${r.codigo}</strong> mudou de ${before} para ${next}`, { id });
  toast('Status atualizado',`${before} → ${next}`,'success');
  renderSolicitacoes();

function openImport() { navigate('importar'); }

async function handleImport(file) {
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  toast('Processando arquivo','Analisando estrutura...','info');

  try {
    if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
      await importSpreadsheet(file, ext);
    } else if (ext === 'pdf') {
      await importPDF(file);
    } else {
      toast('Formato não suportado','Use .xlsx, .csv ou .pdf','error');
    }
  } catch (e) {
    console.error(e);
    toast('Erro ao importar', e.message || 'Falha ao ler o arquivo','error');
  }
}

async function importSpreadsheet(file, ext) {
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type:'array', cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw:false });
  if (!rows.length) { toast('Planilha vazia','Nenhuma linha encontrada','warning'); return; }

  const headers = Object.keys(rows[0]);
  const mapping = autoMapColumns(headers);

  // Preview
  const preview = document.getElementById('importPreview');
  preview.classList.remove('hidden');
  preview.innerHTML = `
    <div class="preview-meta">
      <div class="meta-icon"><i data-lucide="file-spreadsheet"></i></div>
      <div class="meta-text">
        <strong>${escapeHtml(file.name)}</strong>
        <small>${rows.length} linhas · ${headers.length} colunas detectadas</small>
      </div>
    </div>
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title" style="font-size:14px;margin-bottom:10px">Mapeamento detectado automaticamente</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px">
        ${Object.entries(mapping).map(([field,col])=>`
          <div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.02);border-radius:8px">
            <i data-lucide="check-circle" style="width:14px;height:14px;color:${col?'var(--success)':'var(--ink-400)'}"></i>
            <strong style="color:${col?'#fff':'var(--ink-400)'};text-transform:capitalize">${field}:</strong>
            <span class="muted">${col ? escapeHtml(col) : '(não encontrado)'}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn gold" onclick="confirmImport()"><i data-lucide="check"></i>Confirmar importação</button>
      <button class="btn ghost" onclick="document.getElementById('importPreview').classList.add('hidden')"><i data-lucide="x"></i>Cancelar</button>
    </div>
  `;
  lucide.createIcons();

  // Stash para confirmação
  state._pendingImport = { rows, mapping, file, ext, headers };
}

function autoMapColumns(headers) {
  // Detecta colunas por nome aproximado (case insensitive, sem acentos)
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const dict = {
    codigo:     ['codigo','cod','id','numero','num'],
    descricao:  ['descricao','desc','descrip','produto','item','servico','obj','titulo','assunto'],
    fornecedor: ['fornecedor','forn','empresa','vendor','razao','razao social'],
    setor:      ['setor','departamento','depto','area','centro custo'],
    valor:      ['valor','preco','total','vlr','custo','amount'],
    data:       ['data','date','dt','emissao','vencimento'],
    status:     ['status','situacao','estado','condicao'],
    observacoes:['observacao','obs','comentario','nota'],
  };
  const out = {};
  Object.keys(dict).forEach(field => {
    const tokens = dict[field];
    const match = headers.find(h => tokens.some(t => norm(h).includes(t)));
    if (match) out[field] = match;
  });
  return out;
}

async function confirmImport() {
  const pending = state._pendingImport;
  if (!pending) return;

  const { rows, mapping, file, ext } = pending;
  let novos = 0, atualizados = 0, duplicados = 0;

  rows.forEach(row => {
    const rec = {
      codigo: mapping.codigo ? String(row[mapping.codigo]||'').trim() : '',
      descricao: mapping.descricao ? String(row[mapping.descricao]||'').trim() : '',
      fornecedor: mapping.fornecedor ? String(row[mapping.fornecedor]||'').trim() : '',
      setor: mapping.setor ? String(row[mapping.setor]||'Operacional').trim() : 'Operacional',
      valor: mapping.valor ? parseValor(row[mapping.valor]) : 0,
      data: mapping.data ? parseDate(row[mapping.data]) : new Date().toISOString().slice(0,10),
      status: mapping.status ? String(row[mapping.status]||'Pendente').trim() : 'Pendente',
      observacoes: mapping.observacoes ? String(row[mapping.observacoes]||'') : '',
    };

    if (!rec.descricao && !rec.codigo) return; // Linha vazia

    // Normaliza status para conjunto válido
    if (!PURCHASE_STATUS.includes(rec.status)) {
      const found = PURCHASE_STATUS.find(s => s.toLowerCase()===rec.status.toLowerCase());
      rec.status = found || 'Pendente';
    }

    const hash = hashRecord({d:rec.descricao,f:rec.fornecedor,s:rec.setor,v:rec.valor});

    // 1) tenta por código (chave forte)
    let existing = rec.codigo ? state.purchases.find(p=>p.codigo===rec.codigo) : null;
    // 2) fallback: hash
    if (!existing) existing = state.purchases.find(p=>p._hash===hash);

    if (existing) {
      // Atualizar se algo mudou
      const changes = {};
      Object.keys(rec).forEach(k => {
        if (rec[k] && existing[k] !== rec[k]) {
          changes[k] = { de: existing[k], para: rec[k] };
          existing[k] = rec[k];
        }
      });
      if (Object.keys(changes).length) {
        existing.historico = [...(existing.historico||[]), { at: new Date().toISOString(), by: state.user.name, action:'importação', changes }];
        atualizados++;
      } else {
        duplicados++;
      }
    } else {
      const novo = {
        ...rec,
        id: uid(),
        codigo: rec.codigo || ('CMP-' + (1000 + state.purchases.length + novos)),
        criadoPor: state.user.name + ' (importação)',
        criadoEm: new Date().toISOString(),
        importadoDe: file.name,
        _hash: hash,
        historico: [{ at: new Date().toISOString(), by: state.user.name, action:'importado', fonte: file.name }],
      };
      state.purchases.unshift(novo);
      novos++;
    }
  });

  await Storage.set('solys:purchases', state.purchases);

  // Registra documento
  const docMeta = {
    id: uid(),
    name: file.name,
    type: ext,
    size: file.size,
    sizeStr: (file.size / 1024).toFixed(1) + ' KB',
    by: state.user.name,
    at: new Date().toISOString(),
    records: novos,
    updated: atualizados,
    duplicates: duplicados,
    columns: pending.headers,
  };
  state.documents.unshift(docMeta);
  await Storage.set('solys:documents', state.documents);

  await pushLog('import', `Planilha <strong>${file.name}</strong> importada (${novos} novos, ${atualizados} atualizados, ${duplicados} duplicados)`, { file: file.name, novos, atualizados, duplicados });

  toast('Importação concluída', `${novos} novos · ${atualizados} atualizados · ${duplicados} duplicados`, 'success');

  state._pendingImport = null;
  document.getElementById('importPreview').classList.add('hidden');
  updateBadges();
}

function parseValor(v) {
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  // Remove R$, pontos de milhar, troca vírgula por ponto
  const s = String(v).replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseDate(v) {
  if (!v) return new Date().toISOString().slice(0,10);
  if (v instanceof Date) return v.toISOString().slice(0,10);
  // dd/mm/yyyy
  const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let y = m[3].length === 2 ? '20'+m[3] : m[3];
    return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  const d = new Date(v);
  return isNaN(d) ? new Date().toISOString().slice(0,10) : d.toISOString().slice(0,10);
}

async function importPDF(file) {
  // PDF: registramos como documento (extração textual via PDF.js fica como TODO em produção)
  const docMeta = {
    id: uid(),
    name: file.name,
    type:'pdf',
    size: file.size,
    sizeStr: (file.size/1024).toFixed(1) + ' KB',
    by: state.user.name,
    at: new Date().toISOString(),
    records: 0, updated: 0, duplicates: 0,
    columns: [],
  };
  state.documents.unshift(docMeta);
  await Storage.set('solys:documents', state.documents);
  await pushLog('import', `Documento PDF <strong>${file.name}</strong> arquivado`, { file: file.name });
  toast('PDF arquivado','PDF salvo na biblioteca de documentos','success');
}

  return loja.itens.reduce((s, it) => s + MESES.reduce((a,m)=>a+(it[m]|0),0), 0);

function lojaTotalMes(loja, mes) {
  return loja.itens.reduce((s, it) => s + (it[mes]|0), 0);
}

  return MESES[new Date().getMonth()];
}

async function updateLojaCell(lojaId, itemId, field, value) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const it = loja.itens.find(x => x.id === itemId); if (!it) return;
  const oldVal = it[field];
  if (MESES.includes(field)) {
    it[field] = parseInt(value)||0;
  } else {
    it[field] = value;
  }
  if (!it.historico) it.historico = [];
  it.historico.push({ at:new Date().toISOString(), by:state.user?.name||'?', action:`alterou ${field}`, de:oldVal, para:it[field] });
  await Storage.set('solys:lojas', state.lojas);
  // Persiste no Supabase
  if (Cloud.ok()) await Cloud.upsertLojaItem(lojaId, it);
  await pushLog('loja-edit', `${state.user?.name||'?'} alterou ${field} de "${it.descricao}" em ${loja.nome}`, { de:oldVal, para:it[field] });
  // re-render row + footer totals
  const tbody = document.getElementById('lojaTbody');
  if (tbody) {
    // Atualiza só a linha trocada e o footer
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(tr => {
      if (tr.dataset.desc === it.descricao.toLowerCase()) {
        tr.outerHTML = renderLojaRow(lojaId, it);
      }
    });
    // re-render footer
    const tfootCells = document.querySelectorAll('#lojaTable tfoot th');
    if (tfootCells.length >= 14) {
      MESES.forEach((m,i) => { tfootCells[1+i].textContent = lojaTotalMes(loja, m); });
      tfootCells[13].textContent = lojaTotalAno(loja);
    }
    setTimeout(()=>lucide.createIcons(),20);
  }
}

/* ----------------------------------------------------------------
   PEDIDOS POR LOJA — modelo: data + solicitante + lista de produtos
   Colaborador (loja) faz seu pedido; gestão acompanha tudo
   ---------------------------------------------------------------- */

const PEDIDO_STATUS = ['Pendente','Aprovado','Em compra','Entregue','Rejeitado'];
const MES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function getLojaSelecionada() {
  if (!state.user) return null;

  if (!state.user) return;

  if (idx !== -1) { state.users[idx].lojaPreferida = lojaId; await Storage.set('solys:users', state.users); }
}

function pedidosDaLoja(lojaId) {
  return state.pedidos
    .filter(p => p.lojaId === lojaId)
    .sort((a,b) => new Date(b.criadoEm) - new Date(a.criadoEm));
}

/* Constrói o histórico ANO → MÊS → ITENS da loja.
   Combina os pedidos enviados + a planilha SISTEMA_SOLYS_COMPRAS (loja.itens).
   Pedidos vencem em caso de dúvida (somarPedidoNaGradeLoja mantém a grade
   sincronizada com pedidos do ano corrente). */
function historicoAnualLoja(loja){
  if (!loja) return {};
  const anoAtual = new Date().getFullYear();
  const out = {};

  // 1) Pedidos (qualquer ano, agrupados por ano/mês)
  state.pedidos.filter(p => p.lojaId === loja.id).forEach(p => {
    if (!p.data) return;
    const ano = isoToAno(p.data);
    const mes = MESES[isoToMesIdx(p.data)];
    out[ano] = out[ano] || {};
    out[ano][mes] = out[ano][mes] || { itens:{}, pedidos:[] };
    out[ano][mes].pedidos.push(p);
    p.itens.forEach(it => {
      const k = (it.descricao||'').toUpperCase().trim();
      if (!k) return;
      if (!out[ano][mes].itens[k]) out[ano][mes].itens[k] = { descricao:k, quantidade:0, unidade:it.unidade||'un' };
      out[ano][mes].itens[k].quantidade += (it.quantidade|0);
    });
  });

  // 2) Planilha do ano corrente (loja.itens) — usada quando não há pedido naquele mês
  out[anoAtual] = out[anoAtual] || {};
  loja.itens.forEach(it => {
    MESES.forEach(m => {
      const q = it[m]|0;
      if (q <= 0) return;
      out[anoAtual][m] = out[anoAtual][m] || { itens:{}, pedidos:[] };
      const k = (it.descricao||'').toUpperCase().trim();
      // Se já existe via pedido, não duplica
      if (out[anoAtual][m].itens[k]) return;
      out[anoAtual][m].itens[k] = { descricao:k, quantidade:q, unidade:'un' };
    });
  });

  // Garante todos os 12 meses no ano corrente, mesmo vazios
  MESES.forEach(m => {
    if (!out[anoAtual][m]) out[anoAtual][m] = { itens:{}, pedidos:[] };
  });

  return out;
}

// Referência do "mês anterior": último pedido feito pela loja,
// ou, se não houver, os itens do mês anterior no controle mensal da loja
function referenciaMesAnterior(loja) {
  const meus = pedidosDaLoja(loja.id);
  if (meus.length) {
    const ultimo = meus[0];
    return {
      tipo:'pedido',
      pedido: ultimo,
      itens: ultimo.itens.map(i => ({
        descricao: i.descricao,
        quantidade: i.quantidade||1,
        unidade: i.unidade||'un'
      }))
    };
  }
  // fallback: controle mensal da loja (planilha SISTEMA_SOLYS_COMPRAS)
  const mesIdx = new Date().getMonth();
  const prevIdx = (mesIdx + 11) % 12;
  const ordem = [prevIdx];
  for (let i=1;i<12;i++) ordem.push((prevIdx - i + 12) % 12);
  for (const idx of ordem) {
    const m = MESES[idx];
    const itens = loja.itens.filter(it => (it[m]|0) > 0).map(it => ({ descricao: it.descricao, quantidade: it[m]|0, unidade:'un' }));
    if (itens.length) return { tipo:'grid', mesIdx: idx, itens };
  }
  return null;
}
