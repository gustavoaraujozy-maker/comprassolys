<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SOLYS · Central Administrativa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.7.0/jspdf.plugin.autotable.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
/* ============================================================
   SOLYS · DESIGN SYSTEM
   Cores institucionais: #0A3D7C (navy) · #C89B3C (gold)
   Estética: Linear + Stripe + Notion · dark premium
   ============================================================ */
:root{
  --navy-900:#06122a;
  --navy-800:#0a1c3d;
  --navy-700:#0A3D7C;
  --navy-600:#1456a6;
  --navy-500:#2e74c9;
  --gold-300:#e8c878;
  --gold-400:#d4ad55;
  --gold-500:#C89B3C;
  --gold-600:#a47e2c;
  --ink-50:#f7f9fc;
  --ink-100:#e6ebf3;
  --ink-200:#c4ccdb;
  --ink-300:#8b95a8;
  --ink-400:#5d6679;
  --ink-500:#3a4258;
  --ink-600:#252c40;
  --ink-700:#181d2e;
  --ink-800:#0f1322;
  --ink-900:#080b16;
  --bg:#070912;
  --surface:#0d1120;
  --surface-2:#131830;
  --surface-3:#1a2042;
  --border:rgba(255,255,255,0.06);
  --border-strong:rgba(255,255,255,0.12);
  --success:#34d399;
  --warning:#fbbf24;
  --danger:#f87171;
  --info:#60a5fa;
  --radius-sm:8px;
  --radius:12px;
  --radius-lg:16px;
  --radius-xl:24px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow:0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px rgba(0,0,0,.5);
  --shadow-gold:0 0 0 1px rgba(200,155,60,.3), 0 8px 30px rgba(200,155,60,.15);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink-100);
  font-size:14px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  letter-spacing:-0.005em;
}

/* Atmosfera de fundo - gradientes e ruído sutil */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(10,61,124,.35), transparent 60%),
    radial-gradient(900px 500px at 85% 110%, rgba(200,155,60,.08), transparent 60%),
    radial-gradient(600px 400px at 50% 50%, rgba(46,116,201,.05), transparent 70%);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/%3E%3C/svg%3E");
  opacity:.025;
  pointer-events:none;
  mix-blend-mode:overlay;
  z-index:1;
}

button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16)}

/* ============================================================
   LOGIN
   ============================================================ */
.login-screen{
  position:fixed;inset:0;z-index:100;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  background:radial-gradient(900px 600px at 30% 30%, rgba(10,61,124,.5), var(--bg) 60%);
}
.login-card{
  position:relative;z-index:2;
  width:100%;max-width:440px;
  background:linear-gradient(180deg, rgba(19,24,48,.85), rgba(13,17,32,.85));
  backdrop-filter:blur(40px) saturate(180%);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-xl);
  padding:44px 36px;
  box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.05);
}
.login-brand{display:flex;align-items:center;gap:14px;margin-bottom:32px}
.login-mark{
  width:52px;height:52px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--navy-700),var(--navy-500));
  border-radius:14px;
  font-family:'Playfair Display',serif;
  font-weight:800;font-size:24px;
  color:var(--gold-400);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 8px 30px rgba(10,61,124,.5);
}
.login-brand h1{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;letter-spacing:-.02em}
.login-brand p{font-size:11px;color:var(--ink-300);letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
.login-title{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;margin-bottom:6px;letter-spacing:-.02em}
.login-sub{color:var(--ink-300);font-size:13px;margin-bottom:28px}

.login-card-wide{max-width:600px}
.login-lojas-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;
}
.login-loja{
  display:flex;align-items:center;gap:11px;
  padding:14px 14px;text-align:left;
  background:rgba(255,255,255,.025);
  border:1px solid var(--border);
  border-radius:12px;cursor:pointer;
  transition:all .18s ease;color:inherit;font-family:inherit;
}
.login-loja:hover{
  border-color:rgba(200,155,60,.45);
  background:rgba(200,155,60,.05);
  transform:translateY(-2px);
  box-shadow:0 8px 22px rgba(0,0,0,.28);
}
.login-loja-icon{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg, rgba(200,155,60,.18), rgba(200,155,60,.06));
  border:1px solid rgba(200,155,60,.25);
  display:grid;place-items:center;color:var(--gold-400);
}
.login-loja-icon svg{width:17px;height:17px}
.login-loja-name{font-weight:600;font-size:13.5px;color:#fff;line-height:1.2}
.login-loja-local{font-size:11px;color:var(--ink-300);margin-top:2px}

.login-admin-toggle{margin-top:24px;text-align:center}
.admin-login-box{
  margin-top:16px;padding:18px;
  background:rgba(0,0,0,.2);
  border:1px solid var(--border);border-radius:12px;
  animation:fadeIn .25s ease;
}
.admin-login-box input{
  width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);color:#fff;
  padding:10px 12px;border-radius:8px;font-size:13px;font-family:inherit;
}
.admin-login-box input:focus{
  outline:none;border-color:var(--gold-500);
  box-shadow:0 0 0 3px rgba(200,155,60,.12);
}

.field{margin-bottom:16px}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-300);margin-bottom:8px;font-weight:500}
.field input,.field select,.field textarea{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border-strong);
  border-radius:var(--radius);
  padding:12px 14px;
  font-size:14px;
  transition:all .2s ease;
}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;
  border-color:var(--gold-500);
  background:rgba(200,155,60,.04);
  box-shadow:0 0 0 4px rgba(200,155,60,.1);
}
.btn-primary{
  width:100%;
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:#1a1208;
  font-weight:600;
  padding:13px 18px;
  border-radius:var(--radius);
  font-size:14px;
  letter-spacing:.02em;
  transition:all .2s ease;
  box-shadow:0 8px 24px rgba(200,155,60,.25), inset 0 1px 0 rgba(255,255,255,.2);
  margin-top:8px;
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(200,155,60,.35), inset 0 1px 0 rgba(255,255,255,.2)}
.btn-primary:active{transform:translateY(0)}

.login-hint{
  margin-top:24px;
  padding:14px;
  background:rgba(46,116,201,.08);
  border:1px solid rgba(46,116,201,.2);
  border-radius:var(--radius);
  font-size:12px;
  color:var(--ink-200);
  line-height:1.6;
}
.login-hint strong{color:var(--gold-400);font-weight:600}
.login-hint code{font-family:'JetBrains Mono',monospace;background:rgba(0,0,0,.3);padding:1px 6px;border-radius:4px;font-size:11px}

/* ============================================================
   APP SHELL
   ============================================================ */
.app{display:none;height:100vh;position:relative;z-index:2}
.app.active{display:grid;grid-template-columns:260px 1fr}

/* SIDEBAR */
.sidebar{
  background:linear-gradient(180deg, rgba(13,17,32,.7), rgba(8,11,22,.9));
  backdrop-filter:blur(30px);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  height:100vh;
  position:relative;
  overflow:hidden;
}
.sidebar::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(10,61,124,.15), transparent 30%);
  pointer-events:none;
}
.brand{
  position:relative;
  display:flex;align-items:center;gap:12px;
  padding:22px 22px 24px;
  border-bottom:1px solid var(--border);
}
.brand-mark{
  width:38px;height:38px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,var(--navy-700),var(--navy-500));
  border-radius:10px;
  font-family:'Playfair Display',serif;
  font-weight:800;font-size:18px;
  color:var(--gold-400);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.brand-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand-tag{font-size:9px;color:var(--ink-300);letter-spacing:.22em;text-transform:uppercase;margin-top:2px}

.nav{padding:16px 12px;flex:1;overflow-y:auto;position:relative}
.nav-section{margin-bottom:20px}
.nav-label{
  font-size:10px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--ink-400);font-weight:600;
  padding:8px 12px 6px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:9px 12px;
  border-radius:10px;
  font-size:13.5px;
  color:var(--ink-200);
  font-weight:500;
  cursor:pointer;
  transition:all .15s ease;
  position:relative;
  width:100%;
  text-align:left;
}
.nav-item svg{width:17px;height:17px;color:var(--ink-300);transition:color .15s ease}
.nav-item:hover{background:rgba(255,255,255,.04);color:#fff}
.nav-item:hover svg{color:var(--gold-400)}
.nav-item.active{
  background:linear-gradient(90deg, rgba(200,155,60,.12), rgba(200,155,60,.02));
  color:#fff;
}
.nav-item.active::before{
  content:'';position:absolute;left:-12px;top:8px;bottom:8px;
  width:3px;background:var(--gold-500);border-radius:0 3px 3px 0;
}
.nav-item.active svg{color:var(--gold-400)}
.nav-item .badge{
  margin-left:auto;
  background:rgba(200,155,60,.15);
  color:var(--gold-300);
  font-size:10px;
  padding:2px 7px;
  border-radius:99px;
  font-weight:600;
}

.sidebar-footer{
  padding:14px;
  border-top:1px solid var(--border);
  position:relative;
}
.user-chip{
  display:flex;align-items:center;gap:11px;
  padding:10px;
  border-radius:12px;
  cursor:pointer;
  transition:background .15s ease;
}
.user-chip:hover{background:rgba(255,255,255,.04)}
.avatar{
  width:36px;height:36px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--gold-500),var(--navy-700));
  display:grid;place-items:center;
  font-weight:700;font-size:13px;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
  flex-shrink:0;
}
.user-info{min-width:0;flex:1}
.user-info .name{font-size:13px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-info .role{font-size:10.5px;color:var(--ink-300);text-transform:uppercase;letter-spacing:.1em}
.user-chip .logout-btn{color:var(--ink-300);padding:6px}
.user-chip .logout-btn:hover{color:var(--danger)}

/* MAIN */
.main{
  display:flex;flex-direction:column;
  height:100vh;
  overflow:hidden;
}

/* TOPBAR */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:14px 28px;
  border-bottom:1px solid var(--border);
  background:rgba(13,17,32,.5);
  backdrop-filter:blur(30px);
  position:relative;z-index:5;
}
.search-global{
  flex:1;max-width:480px;
  position:relative;
}
.search-global svg{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--ink-300);
}
.search-global input{
  width:100%;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px 14px 9px 40px;
  font-size:13px;
  transition:all .15s ease;
}
.search-global input:focus{
  outline:none;border-color:var(--border-strong);
  background:rgba(255,255,255,.06);
}
.search-global .kbd{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  font-family:'JetBrains Mono',monospace;font-size:10px;
  color:var(--ink-300);background:rgba(255,255,255,.05);
  padding:2px 6px;border-radius:4px;border:1px solid var(--border);
}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{
  width:36px;height:36px;
  display:grid;place-items:center;
  border-radius:10px;
  color:var(--ink-200);
  transition:all .15s ease;
  position:relative;
}
.icon-btn:hover{background:rgba(255,255,255,.06);color:#fff}
.icon-btn svg{width:17px;height:17px}
.icon-btn .dot{
  position:absolute;top:8px;right:8px;
  width:8px;height:8px;border-radius:50%;
  background:var(--gold-500);
  box-shadow:0 0 0 2px var(--surface);
}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:28px;position:relative}
.content::before{
  content:'';position:absolute;top:0;left:0;right:0;height:80px;
  background:linear-gradient(180deg, rgba(13,17,32,.4), transparent);
  pointer-events:none;z-index:1;
}

.page-header{margin-bottom:24px;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.page-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.page-sub{color:var(--ink-300);font-size:13.5px;margin-top:6px}
.page-actions{display:flex;align-items:center;gap:8px}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:9px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-strong);
  border-radius:10px;
  font-size:13px;
  font-weight:500;
  transition:all .15s ease;
}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.btn svg{width:15px;height:15px}
.btn.gold{
  background:linear-gradient(135deg,var(--gold-500),var(--gold-600));
  color:#1a1208;border:none;font-weight:600;
  box-shadow:0 6px 20px rgba(200,155,60,.2);
}
.btn.gold:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(200,155,60,.3)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3)}

/* ============================================================
   DASHBOARD - KPIs e cards
   ============================================================ */
.kpi-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  margin-bottom:24px;
}
.kpi-card{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg, rgba(19,24,48,.6), rgba(13,17,32,.6));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:20px;
  transition:all .25s ease;
}
.kpi-card:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--shadow)}
.kpi-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent);
}
.kpi-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--ink-300);font-weight:600}
.kpi-icon{
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:9px;
  background:rgba(200,155,60,.1);
  color:var(--gold-400);
}
.kpi-icon svg{width:16px;height:16px}
.kpi-icon.blue{background:rgba(46,116,201,.12);color:var(--navy-500)}
.kpi-icon.green{background:rgba(52,211,153,.1);color:var(--success)}
.kpi-icon.amber{background:rgba(251,191,36,.1);color:var(--warning)}
.kpi-value{font-family:'Playfair Display',serif;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px}
.kpi-trend{font-size:11.5px;display:flex;align-items:center;gap:5px;color:var(--ink-300)}
.kpi-trend .up{color:var(--success)}
.kpi-trend .down{color:var(--danger)}
.kpi-trend svg{width:12px;height:12px}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
.grid-3-2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:24px}

.panel{
  background:linear-gradient(135deg, rgba(19,24,48,.5), rgba(13,17,32,.5));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:22px;
  position:relative;overflow:hidden;
}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.panel-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;letter-spacing:-.01em}
.panel-sub{font-size:12px;color:var(--ink-300);margin-top:2px}
.panel-actions{display:flex;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:99px;
  font-size:11px;color:var(--ink-200);
  font-weight:500;
}
.chip.active{background:rgba(200,155,60,.12);border-color:rgba(200,155,60,.3);color:var(--gold-300)}
.chip.success{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.25);color:var(--success)}
.chip.warning{background:rgba(251,191,36,.1);border-color:rgba(251,191,36,.25);color:var(--warning)}
.chip.danger{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.25);color:var(--danger)}
.chip.info{background:rgba(96,165,250,.1);border-color:rgba(96,165,250,.25);color:var(--info)}

.chart-wrap{position:relative;height:280px}

/* Atividade recente */
.activity{display:flex;flex-direction:column;gap:2px}
.activity-item{
  display:flex;align-items:flex-start;gap:12px;
  padding:11px 8px;
  border-radius:10px;
  transition:background .15s ease;
}
.activity-item:hover{background:rgba(255,255,255,.03)}
.activity-icon{
  width:32px;height:32px;
  display:grid;place-items:center;border-radius:9px;
  background:rgba(46,116,201,.1);color:var(--navy-500);
  flex-shrink:0;
}
.activity-icon svg{width:14px;height:14px}
.activity-icon.gold{background:rgba(200,155,60,.12);color:var(--gold-400)}
.activity-icon.green{background:rgba(52,211,153,.1);color:var(--success)}
.activity-icon.amber{background:rgba(251,191,36,.1);color:var(--warning)}
.activity-body{flex:1;min-width:0}
.activity-text{font-size:13px;color:var(--ink-100);line-height:1.45}
.activity-text strong{font-weight:600;color:#fff}
.activity-meta{font-size:11px;color:var(--ink-300);margin-top:2px}

/* ============================================================
   TABELAS
   ============================================================ */
.table-wrap{
  background:linear-gradient(135deg, rgba(19,24,48,.5), rgba(13,17,32,.5));
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  overflow:hidden;
}
.table-toolbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  flex-wrap:wrap;
}
.table-toolbar .search-mini{
  flex:1;min-width:220px;position:relative;
}
.table-toolbar .search-mini svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--ink-300);
}
.table-toolbar .search-mini input{
  width:100%;background:rgba(255,255,255,.03);
  border:1px solid var(--border);
  border-radius:8px;padding:8px 12px 8px 34px;
  font-size:12.5px;
}
.table-toolbar .search-mini input:focus{outline:none;border-color:var(--border-strong)}
.filter-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 12px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:8px;
  font-size:12px;color:var(--ink-200);
}
.filter-pill svg{width:13px;height:13px;color:var(--ink-300)}
.filter-pill select{background:transparent;border:none;font-size:12px;color:#fff;cursor:pointer}
.filter-pill select option{background:var(--surface-2);color:#fff}

table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data thead th{
  text-align:left;
  padding:10px 16px;
  font-size:10.5px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--ink-300);
  font-weight:600;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.data tbody td{
  padding:12px 16px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}
table.data tbody tr{transition:background .12s ease}
table.data tbody tr:hover{background:rgba(255,255,255,.025)}
table.data tbody tr:last-child td{border-bottom:none}
.cell-strong{color:#fff;font-weight:500}
.cell-mute{color:var(--ink-300)}
.cell-money{font-family:'JetBrains Mono',monospace;font-size:12.5px}
.row-action{
  width:28px;height:28px;display:grid;place-items:center;
  border-radius:7px;color:var(--ink-300);transition:all .15s;
}
.row-action:hover{background:rgba(255,255,255,.06);color:#fff}
.row-action svg{width:14px;height:14px}

.empty-state{
  text-align:center;padding:60px 24px;color:var(--ink-300);
}
.empty-state svg{width:48px;height:48px;color:var(--ink-400);margin-bottom:14px}
.empty-state h3{font-family:'Playfair Display',serif;font-size:18px;color:var(--ink-100);margin-bottom:6px;font-weight:600}
.empty-state p{font-size:13px}

.pagination{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;border-top:1px solid var(--border);
  font-size:12px;color:var(--ink-300);
}
.pagination .pages{display:flex;gap:4px}
.pagination button{
  width:28px;height:28px;display:grid;place-items:center;
  border-radius:7px;color:var(--ink-200);
  font-size:12px;
}
.pagination button:hover{background:rgba(255,255,255,.05)}
.pagination button.active{background:var(--gold-500);color:#1a1208;font-weight:600}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* ============================================================
   IMPORTAÇÃO - drag and drop
   ============================================================ */
.import-zone{
  border:2px dashed var(--border-strong);
  border-radius:var(--radius-lg);
  padding:48px 24px;
  text-align:center;
  background:rgba(255,255,255,.015);
  transition:all .2s ease;
  position:relative;overflow:hidden;
  cursor:pointer;
}
.import-zone:hover{border-color:var(--gold-500);background:rgba(200,155,60,.04)}
.import-zone.drag{border-color:var(--gold-500);background:rgba(200,155,60,.08);box-shadow:var(--shadow-gold)}
.import-zone svg{width:48px;height:48px;color:var(--gold-400);margin-bottom:14px}
.import-zone h3{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;margin-bottom:6px}
.import-zone p{font-size:13px;color:var(--ink-300);margin-bottom:14px}
.import-zone .formats{display:flex;justify-content:center;gap:8px}
.import-zone .format{
  padding:4px 10px;background:rgba(255,255,255,.04);
  border-radius:6px;font-size:11px;color:var(--ink-200);
  font-family:'JetBrains Mono',monospace;
}

.import-preview{margin-top:20px}
.preview-meta{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;
  background:rgba(200,155,60,.06);
  border:1px solid rgba(200,155,60,.2);
  border-radius:var(--radius);
  margin-bottom:14px;
}
.preview-meta .meta-icon{
  width:36px;height:36px;display:grid;place-items:center;
  background:rgba(200,155,60,.15);border-radius:9px;color:var(--gold-400);
}
.preview-meta .meta-text{flex:1}
.preview-meta .meta-text strong{display:block;font-weight:600;font-size:13.5px}
.preview-meta .meta-text small{color:var(--ink-300);font-size:11.5px}

/* ============================================================
   TIMELINE - histórico
   ============================================================ */
.timeline{padding:8px}
.tl-item{
  display:flex;gap:14px;
  padding:14px 0;
  border-bottom:1px dashed var(--border);
  position:relative;
}
.tl-item:last-child{border-bottom:none}
.tl-dot{
  width:32px;height:32px;flex-shrink:0;
  display:grid;place-items:center;
  background:linear-gradient(135deg, var(--navy-700), var(--navy-500));
  border-radius:50%;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.tl-dot svg{width:14px;height:14px}
.tl-dot.gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-600));color:#1a1208}
.tl-dot.green{background:linear-gradient(135deg,#10b981,#059669)}
.tl-dot.amber{background:linear-gradient(135deg,#f59e0b,#d97706)}
.tl-dot.red{background:linear-gradient(135deg,#ef4444,#dc2626)}
.tl-body{flex:1;min-width:0}
.tl-title{font-size:13.5px;color:#fff;font-weight:500}
.tl-title strong{font-weight:600;color:var(--gold-300)}
.tl-meta{font-size:11.5px;color:var(--ink-300);margin-top:3px;display:flex;gap:10px;align-items:center}
.tl-meta .dot-sep{width:3px;height:3px;background:var(--ink-400);border-radius:50%}
.tl-details{
  margin-top:8px;font-size:12px;color:var(--ink-200);
  background:rgba(255,255,255,.02);
  border-left:2px solid var(--border-strong);
  padding:8px 12px;border-radius:0 6px 6px 0;
  font-family:'JetBrains Mono',monospace;font-size:11.5px;
}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(5,8,18,.7);
  backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;
  padding:24px;
  animation:fadeIn .2s ease;
}
.modal-overlay.active{display:flex}
.modal{
  background:linear-gradient(180deg, rgba(19,24,48,.95), rgba(13,17,32,.95));
  backdrop-filter:blur(40px);
  border:1px solid var(--border-strong);
  border-radius:var(--radius-xl);
  width:100%;max-width:560px;
  max-height:90vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);
  animation:slideUp .3s cubic-bezier(.16,1,.3,1);
}
.modal.lg{max-width:780px}
.modal-head{
  padding:22px 26px 16px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600}
.modal-close{
  width:32px;height:32px;display:grid;place-items:center;
  border-radius:8px;color:var(--ink-300);
}
.modal-close:hover{background:rgba(255,255,255,.05);color:#fff}
.modal-close svg{width:16px;height:16px}
.modal-body{padding:22px 26px}
.modal-footer{
  padding:16px 26px 22px;
  display:flex;justify-content:flex-end;gap:10px;
  border-top:1px solid var(--border);
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:span 2}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* ============================================================
   TOAST
   ============================================================ */
.toast-container{
  position:fixed;top:20px;right:20px;z-index:300;
  display:flex;flex-direction:column;gap:10px;
  pointer-events:none;
}
.toast{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;
  background:linear-gradient(135deg, rgba(19,24,48,.95), rgba(13,17,32,.95));
  backdrop-filter:blur(20px);
  border:1px solid var(--border-strong);
  border-radius:12px;
  box-shadow:var(--shadow-lg);
  min-width:280px;max-width:380px;
  pointer-events:auto;
  animation:slideInRight .3s cubic-bezier(.16,1,.3,1);
}
.toast.success{border-left:3px solid var(--success)}
.toast.warning{border-left:3px solid var(--warning)}
.toast.error{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--info)}
.toast-icon{
  width:28px;height:28px;display:grid;place-items:center;
  border-radius:7px;background:rgba(255,255,255,.05);
  flex-shrink:0;
}
.toast-icon svg{width:14px;height:14px}
.toast.success .toast-icon{color:var(--success)}
.toast.warning .toast-icon{color:var(--warning)}
.toast.error .toast-icon{color:var(--danger)}
.toast.info .toast-icon{color:var(--info)}
.toast-content{flex:1;min-width:0}
.toast-title{font-size:13px;font-weight:600;color:#fff}
.toast-desc{font-size:11.5px;color:var(--ink-300);margin-top:2px}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
.cmdk-overlay{
  position:fixed;inset:0;z-index:250;
  background:rgba(5,8,18,.6);
  backdrop-filter:blur(12px);
  display:none;align-items:flex-start;justify-content:center;
  padding-top:14vh;
}
.cmdk-overlay.active{display:flex}
.cmdk{
  width:100%;max-width:580px;
  background:linear-gradient(180deg, rgba(19,24,48,.95), rgba(13,17,32,.95));
  border:1px solid var(--border-strong);
  border-radius:16px;
  box-shadow:var(--shadow-lg);
  overflow:hidden;
}
.cmdk-input{
  display:flex;align-items:center;gap:10px;
  padding:16px 18px;border-bottom:1px solid var(--border);
}
.cmdk-input svg{width:18px;height:18px;color:var(--ink-300)}
.cmdk-input input{
  flex:1;background:none;border:none;outline:none;
  font-size:15px;color:#fff;
}
.cmdk-list{max-height:50vh;overflow-y:auto;padding:8px}
.cmdk-result{
  display:flex;align-items:center;gap:12px;
  padding:9px 12px;border-radius:8px;
  cursor:pointer;font-size:13px;
}
.cmdk-result:hover, .cmdk-result.sel{background:rgba(200,155,60,.1)}
.cmdk-result .ic{width:28px;height:28px;display:grid;place-items:center;background:rgba(255,255,255,.04);border-radius:7px;color:var(--gold-400)}
.cmdk-result .ic svg{width:14px;height:14px}
.cmdk-result .txt{flex:1}
.cmdk-result .txt strong{color:#fff;font-weight:500}
.cmdk-result .txt small{display:block;color:var(--ink-300);font-size:11px}
.cmdk-result .kbd{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-300);background:rgba(255,255,255,.04);padding:2px 6px;border-radius:4px}

/* ============================================================
   STATUS PILLS
   ============================================================ */
.status{
  display:inline-flex;align-items:center;gap:5px;
  padding:3px 9px;
  border-radius:99px;
  font-size:11px;
  font-weight:500;
  text-transform:lowercase;
}
.status::before{content:'';width:5px;height:5px;border-radius:50%}
.status.aprovado{background:rgba(52,211,153,.12);color:var(--success)}
.status.aprovado::before{background:var(--success);box-shadow:0 0 6px var(--success)}
.status.pendente{background:rgba(251,191,36,.12);color:var(--warning)}
.status.pendente::before{background:var(--warning);box-shadow:0 0 6px var(--warning)}
.status.rejeitado{background:rgba(248,113,113,.12);color:var(--danger)}
.status.rejeitado::before{background:var(--danger)}
.status.processando{background:rgba(96,165,250,.12);color:var(--info)}
.status.processando::before{background:var(--info);box-shadow:0 0 6px var(--info);animation:pulse 1.5s infinite}
.status.concluido{background:rgba(52,211,153,.12);color:var(--success)}
.status.concluido::before{background:var(--success)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:980px){
  .app.active{grid-template-columns:72px 1fr}
  .brand-name,.brand-tag,.nav-label,.nav-item span,.user-info,.user-chip .logout-btn{display:none}
  .nav-item{justify-content:center;padding:9px}
  .nav-item.active::before{display:none}
  .brand{justify-content:center;padding:18px 0}
  .sidebar-footer .user-chip{justify-content:center}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3-2{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .form-grid .full{grid-column:span 1}
}
@media(max-width:600px){
  .kpi-grid{grid-template-columns:1fr}
  .content{padding:18px}
  .page-title{font-size:24px}
}

.skeleton{
  background:linear-gradient(90deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.08) 50%, rgba(255,255,255,.04) 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:6px;
}

.spinner{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:var(--gold-400);
  border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.divider{height:1px;background:var(--border);margin:14px 0}
.muted{color:var(--ink-300)}
.hidden{display:none !important}

/* ============================================================
   LOJAS — grid de cards e tabela mensal
   ============================================================ */
.lojas-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;
}
.loja-card{
  background:linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.01));
  border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;
  transition:all .2s ease;position:relative;overflow:hidden;
}
.loja-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold-500),transparent);
  opacity:0;transition:opacity .25s;
}
.loja-card:hover{
  border-color:rgba(200,155,60,.35);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(0,0,0,.25), 0 0 0 1px rgba(200,155,60,.15);
}
.loja-card:hover::before{opacity:1}
.loja-card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.loja-icon{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg, rgba(200,155,60,.18), rgba(200,155,60,.06));
  border:1px solid rgba(200,155,60,.25);
  display:grid;place-items:center;color:var(--gold-400);flex-shrink:0;
}
.loja-icon svg{width:18px;height:18px}
.loja-name{font-weight:600;font-size:14.5px;color:#fff;letter-spacing:-.01em}
.loja-local{font-size:11.5px;color:var(--ink-300);margin-top:2px}
.loja-arrow{width:16px;height:16px;color:var(--ink-300);transition:transform .2s,color .2s}
.loja-card:hover .loja-arrow{color:var(--gold-400);transform:translateX(3px)}
.loja-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.loja-stat{
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
  border-radius:8px;padding:8px 6px;text-align:center;
}
.loja-stat-label{display:block;font-size:10px;color:var(--ink-300);text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.loja-stat-val{display:block;font-size:15px;font-weight:600;color:#fff}
.loja-stat-val.gold{color:var(--gold-400)}

.mes-mini{padding:10px !important;text-align:center;cursor:pointer;transition:all .2s}
.mes-mini .kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-300);font-weight:500}
.mes-mini .kpi-value{font-size:20px !important;margin-top:4px}
.mes-mini:hover{border-color:rgba(200,155,60,.3)}
.mes-mini.mes-now{
  border-color:rgba(200,155,60,.5);
  background:linear-gradient(180deg, rgba(200,155,60,.08), rgba(200,155,60,.02));
}
.mes-mini.mes-now .kpi-value{color:var(--gold-400)}

.loja-table-wrap{
  overflow-x:auto;border-radius:10px;border:1px solid var(--border);
  background:rgba(0,0,0,.18);max-width:100%;
}
.loja-table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:1100px}
.loja-table thead th{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink-300);text-align:center;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:2;
}
.loja-table thead th.sticky-left{text-align:left}
.loja-table thead th.col-now{color:var(--gold-400);background:linear-gradient(180deg, rgba(200,155,60,.1), rgba(200,155,60,.02))}
.loja-table tbody td{
  padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.04);text-align:center;
}
.loja-table tbody td.sticky-left{text-align:left;padding-left:12px;padding-right:8px}
.loja-table tbody tr:hover{background:rgba(255,255,255,.02)}
.loja-table tbody td.col-now{background:rgba(200,155,60,.04)}
.loja-table tfoot th{
  padding:10px 8px;font-size:12px;font-weight:600;
  background:rgba(200,155,60,.06);color:var(--gold-400);
  border-top:2px solid rgba(200,155,60,.2);text-align:center;
}
.loja-table tfoot th.sticky-left{text-align:left}
.loja-table tfoot th.col-now{color:#fff;background:rgba(200,155,60,.14)}

.sticky-left{position:sticky;left:0;background:rgba(6,18,42,.92);z-index:1;min-width:240px;max-width:260px}
.loja-table thead .sticky-left{background:rgba(10,28,61,.95);z-index:3}
.loja-table tfoot .sticky-left{background:rgba(10,28,61,.95);z-index:3}

.cell-input{
  width:54px;background:transparent;border:1px solid transparent;color:#fff;
  text-align:center;font-size:12.5px;padding:5px 4px;border-radius:6px;
  font-family:inherit;transition:all .15s;
}
.cell-input:hover{border-color:rgba(255,255,255,.08)}
.cell-input:focus{
  outline:none;border-color:var(--gold-500);background:rgba(200,155,60,.06);
  box-shadow:0 0 0 2px rgba(200,155,60,.15);
}
.cell-input.cell-text{width:140px;text-align:left}
.cell-input::-webkit-outer-spin-button,.cell-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cell-input[type=number]{-moz-appearance:textfield}

/* ============================================================
   COLABORADOR — Minha Lista / Pedidos Colab.
   ============================================================ */
.modal-body label{
  display:block;font-size:11.5px;font-weight:500;color:var(--ink-200);
  margin-bottom:6px;letter-spacing:.02em;
}
.modal-body input[type="text"],
.modal-body input[type="number"],
.modal-body input[type="email"],
.modal-body input[type="password"],
.modal-body select,
.modal-body textarea{
  width:100%;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  color:#fff;padding:9px 12px;border-radius:8px;
  font-size:13px;font-family:inherit;
  transition:all .15s;
}
.modal-body input:focus,.modal-body select:focus,.modal-body textarea:focus{
  outline:none;border-color:var(--gold-500);
  background:rgba(200,155,60,.04);
  box-shadow:0 0 0 3px rgba(200,155,60,.12);
}
.modal-body textarea{resize:vertical;min-height:60px;line-height:1.5}
.modal-body select{cursor:pointer}

.colab-list{display:flex;flex-direction:column;gap:10px}
.colab-item{
  display:flex;align-items:flex-start;gap:14px;
  padding:14px 16px;
  background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.05);
  border-radius:12px;
  transition:all .15s;
}
.colab-item:hover{border-color:rgba(255,255,255,.1);background:rgba(255,255,255,.03)}
.colab-item.urg{
  border-left:3px solid #f87171;
  background:linear-gradient(90deg, rgba(239,68,68,.04), rgba(255,255,255,.02));
}
.colab-item-main{flex:1;min-width:0}
.colab-item-head{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:5px;
}
.colab-item-head strong{font-size:14px;color:#fff;font-weight:600;letter-spacing:-.01em}
.colab-item-desc{
  font-size:12.5px;color:var(--ink-200);margin-top:3px;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
}

<script>
/* ================================================================
   SOLYS · Central Administrativa
   Sistema SPA com persistência via window.storage
   ================================================================ */

/* ----------------------------------------------------------------
   STORAGE LAYER
   Abstração sobre window.storage para persistência entre sessões.
   Em produção real isto seria substituído por chamadas Supabase.
   ---------------------------------------------------------------- */
const Storage = {
  async get(key, def = null) {
    try {
      const r = await window.storage.get(key);
      return r && r.value ? JSON.parse(r.value) : def;
    } catch (e) {
      return def;
    }
  },
  async set(key, value) {
    try {
      await window.storage.set(key, JSON.stringify(value));
      return true;
    } catch (e) {
      console.error('Storage set error', key, e);
      return false;
    }
  },
  async del(key) {
    try { await window.storage.delete(key); } catch (e) {}
  },
  async list(prefix = '') {
    try {
      const r = await window.storage.list(prefix);
      return r ? r.keys || [] : [];
    } catch (e) { return []; }
  }
};

/* ----------------------------------------------------------------
   STATE
   ---------------------------------------------------------------- */
const state = {
  user: null,
  users: [],
  purchases: [],
  requests: [],
  documents: [],
  logs: [],
  notifications: [],
  lojas: [],
  lojaAtiva: null,
  colabRequests: [],
  pedidos: [],
  route: 'dashboard',
  charts: {},
};

const SECTORS = ['24 Horas','Cobrança','Rastreamento','Jurídico','Eventos','Implantação','Financeiro','RH/DP','Comercial','Operacional','Diretoria'];
const PURCHASE_STATUS = ['Pendente','Aprovado','Processando','Concluído','Rejeitado'];
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_LABEL = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

/* ----------------------------------------------------------------
   UTILS
   ---------------------------------------------------------------- */
const fmt = {
  brl(n) {
    if (n == null || isNaN(n)) return 'R$ 0,00';
    return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
  },
  num(n) {
    if (n == null || isNaN(n)) return '0';
    return new Intl.NumberFormat('pt-BR').format(n);
  },
  date(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleDateString('pt-BR');
  },
  datetime(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return d;
    return dt.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  },
  ago(d) {
    if (!d) return '—';
    const diff = (Date.now() - new Date(d).getTime()) / 1000;
    if (diff < 60) return 'agora';
    if (diff < 3600) return Math.floor(diff/60) + ' min atrás';
    if (diff < 86400) return Math.floor(diff/3600) + 'h atrás';
    if (diff < 2592000) return Math.floor(diff/86400) + ' dias atrás';
    return fmt.date(d);
  }
};

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function hashRecord(obj) {
  // Hash simples para deduplicação (apenas campos-chave)
  const str = JSON.stringify(obj, Object.keys(obj).sort()).toLowerCase();
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h<<5)-h) + str.charCodeAt(i); h |= 0; }
  return h.toString(36);
}

/* ----------------------------------------------------------------
   TOAST
   ---------------------------------------------------------------- */
function toast(title, desc = '', type = 'info') {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const icons = { success:'check-circle', warning:'alert-triangle', error:'x-circle', info:'info' };
  el.innerHTML = `
    <div class="toast-icon"><i data-lucide="${icons[type]||'info'}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${escapeHtml(title)}</div>
      ${desc ? `<div class="toast-desc">${escapeHtml(desc)}</div>` : ''}
    </div>
  `;
  container.appendChild(el);
  lucide.createIcons();
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(40px)'; }, 3500);
  setTimeout(() => el.remove(), 3900);
}

/* ----------------------------------------------------------------
   AUTH
   ---------------------------------------------------------------- */
async function initAuth() {
  // Carrega usuários do storage (usado pela gestão); se vazio, semeia padrões
  let users = await Storage.get('solys:users', null);
  if (!users) {
    users = [
      { id: uid(), name:'Luís Gustavo', email:'admin@solys.com.br', pass:'solys2026', role:'Administrador', sector:'Diretoria', createdAt: new Date().toISOString() },
      { id: uid(), name:'Karoline Rodrigues', email:'diretoria@solys.com.br', pass:'solys2026', role:'Diretoria', sector:'Diretoria', createdAt: new Date().toISOString() },
    ];
    await Storage.set('solys:users', users);
  }
  state.users = users;

  // Garante que as lojas estejam carregadas (necessárias na tela inicial)
  state.lojas = await Storage.get('solys:lojas', null);
  if (state.lojas === null) {
    state.lojas = seedLojas();
    await Storage.set('solys:lojas', state.lojas);
  }

  // Sessão ativa?
  const session = await Storage.get('solys:session', null);
  if (session) {
    if (session.tipo === 'loja') {
      const loja = state.lojas.find(l => l.id === session.lojaId);
      if (loja) { state.user = pseudoUserLoja(loja); enterApp(); return; }
    } else {
      const u = users.find(x => x.id === session.userId);
      if (u) { state.user = u; enterApp(); return; }
    }
  }
  showLogin();
}

function pseudoUserLoja(loja) {
  return {
    id: 'loja-' + loja.id,
    name: loja.nome,
    role: 'Colaborador',
    sector: loja.localidade,
    lojaPreferida: loja.id,
    isLoja: true,
  };
}

function showLogin() {
  document.getElementById('login').style.display = 'flex';
  document.getElementById('app').classList.remove('active');
  // Preenche a grade de lojas
  const grid = document.getElementById('loginLojas');
  if (grid && state.lojas) {
    grid.innerHTML = state.lojas.map(l => `
      <button class="login-loja" onclick="entrarComoLoja('${l.id}')">
        <div class="login-loja-icon"><i data-lucide="store"></i></div>
        <div style="min-width:0">
          <div class="login-loja-name">${escapeHtml(l.nome.replace('Loja ',''))}</div>
          <div class="login-loja-local">${escapeHtml(l.localidade)}</div>
        </div>
      </button>
    `).join('');
  }
  setTimeout(()=>lucide.createIcons(),30);
}

function toggleAdminLogin() {
  const box = document.getElementById('adminLoginBox');
  box.classList.toggle('hidden');
  if (!box.classList.contains('hidden')) {
    setTimeout(()=>document.getElementById('adminPass').focus(), 50);
  }
}

async function entrarComoLoja(lojaId) {
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) { toast('Erro','Loja não encontrada','error'); return; }
  state.user = pseudoUserLoja(loja);
  await Storage.set('solys:session', { tipo:'loja', lojaId: loja.id, at: new Date().toISOString() });
  await pushLog('login', `Entrada pela loja ${loja.nome}`, { loja: loja.nome });
  enterApp();
}

async function entrarComoGestao(role) {
  const pass = document.getElementById('adminPass').value;
  if (pass !== 'solys2026') { toast('Acesso negado','Senha incorreta','error'); return; }
  const u = state.users.find(x => x.role === role);
  if (!u) { toast('Erro',`Nenhum usuário ${role} cadastrado`,'error'); return; }
  state.user = u;
  await Storage.set('solys:session', { tipo:'user', userId: u.id, at: new Date().toISOString() });
  await pushLog('login', `${u.name} (${role}) iniciou sessão`, { role });
  enterApp();
}

async function doLogin(email, pass) {
  const u = state.users.find(x => x.email.toLowerCase() === email.toLowerCase() && x.pass === pass);
  if (!u) {
    toast('Acesso negado','Credenciais inválidas','error');
    return;
  }
  state.user = u;
  await Storage.set('solys:session', { userId: u.id, at: new Date().toISOString() });
  await pushLog('login', `${u.name} iniciou sessão`, { role: u.role });
  enterApp();
}

async function logout() {
  if (state.user) await pushLog('logout', `${state.user.name} encerrou sessão`);
  await Storage.del('solys:session');
  state.user = null;
  showLogin();
}

async function enterApp() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('active');
  await loadAllData();
  updateUserChip();
  applyRoleVisibility();
  // Rota inicial muda conforme papel
  const startRoute = (state.user.role === 'Colaborador') ? 'minha-lista' : 'dashboard';
  navigate(startRoute);
  setTimeout(()=>lucide.createIcons(),50);
}

function updateUserChip() {
  if (!state.user) return;
  const initials = state.user.name.replace('Loja ','').split(' ').slice(0,2).map(s=>s[0]).join('').toUpperCase();
  document.getElementById('userAvatar').textContent = initials;
  document.getElementById('userName').textContent = state.user.name;
  document.getElementById('userRole').textContent = state.user.isLoja ? ('Loja · ' + (state.user.sector||'')) : state.user.role;
}

function applyRoleVisibility() {
  const role = state.user.role;
  // Mostra/esconde seções e itens com base em data-roles
  document.querySelectorAll('[data-roles]').forEach(el => {
    const allowed = el.dataset.roles.split(',').map(s=>s.trim());
    el.style.display = allowed.includes(role) ? '' : 'none';
  });
  // Esconde a topbar de import/export para colaborador
  const topActions = document.querySelector('.topbar-actions');
  if (topActions) {
    const isColab = role === 'Colaborador';
    topActions.querySelectorAll('.icon-btn').forEach(b => {
      const title = b.getAttribute('title') || '';
      if (isColab && (title === 'Importar' || title === 'Exportar')) b.style.display = 'none';
      else b.style.display = '';
    });
    // Esconde busca global para colaborador (não precisa)
    const search = document.querySelector('.search-global');
    if (search) search.style.display = isColab ? 'none' : '';
  }
}

/* ----------------------------------------------------------------
   DATA LOADING / SEEDING
   ---------------------------------------------------------------- */
async function loadAllData() {
  state.purchases = await Storage.get('solys:purchases', null);
  state.requests = await Storage.get('solys:requests', null);
  state.documents = await Storage.get('solys:documents', []);
  state.logs = await Storage.get('solys:logs', []);
  state.notifications = await Storage.get('solys:notifications', []);
  state.lojas = await Storage.get('solys:lojas', null);
  state.colabRequests = await Storage.get('solys:colab_requests', []);
  state.pedidos = await Storage.get('solys:pedidos', []);

  // Seed inicial apenas se NUNCA houver dados
  if (state.purchases === null) {
    state.purchases = seedPurchases();
    await Storage.set('solys:purchases', state.purchases);
    await pushLog('seed', 'Dados iniciais de demonstração criados — compras', { count: state.purchases.length });
  }
  if (state.requests === null) {
    state.requests = seedRequests();
    await Storage.set('solys:requests', state.requests);
    await pushLog('seed', 'Dados iniciais de demonstração criados — solicitações', { count: state.requests.length });
  }
  if (state.lojas === null) {
    state.lojas = seedLojas();
    await Storage.set('solys:lojas', state.lojas);
    const totalItens = state.lojas.reduce((s,l)=>s+l.itens.length,0);
    await pushLog('seed', 'Lojas importadas da planilha SISTEMA_SOLYS_COMPRAS', { lojas: state.lojas.length, itens: totalItens });
  }
}

function seedLojas() {
  return LOJAS_SEED.map(loja => ({
    id: uid(),
    codigo: loja.codigo,
    nome: loja.nome,
    localidade: loja.localidade,
    criadoEm: new Date().toISOString(),
    itens: loja.itens.map(it => ({
      id: uid(),
      descricao: it.descricao,
      jan: it.jan|0, fev: it.fev|0, mar: it.mar|0, abr: it.abr|0,
      mai: it.mai|0, jun: it.jun|0, jul: it.jul|0, ago: it.ago|0,
      set: it.set|0, out: it.out|0, nov: it.nov|0, dez: it.dez|0,
      obs: it.obs || '',
      criadoEm: new Date().toISOString(),
      historico: [{ at: new Date().toISOString(), by:'Sistema (seed)', action:'item criado' }],
    })),
  }));
}

/* ----------------------------------------------------------------
   LOGS (histórico permanente, append-only)
   ---------------------------------------------------------------- */
async function pushLog(action, message, details = {}) {
  const entry = {
    id: uid(),
    at: new Date().toISOString(),
    by: state.user ? state.user.name : 'Sistema',
    role: state.user ? state.user.role : 'sistema',
    action,
    message,
    details,
  };
  state.logs.unshift(entry);
  // Mantém últimos 1000 registros para não estourar storage
  if (state.logs.length > 1000) state.logs = state.logs.slice(0, 1000);
  await Storage.set('solys:logs', state.logs);
}

/* ----------------------------------------------------------------
   ROUTER
   ---------------------------------------------------------------- */
function navigate(route) {
  // Colaborador só pode navegar para sua própria lista
  if (state.user && state.user.role === 'Colaborador' && route !== 'minha-lista') {
    route = 'minha-lista';
  }
  state.route = route;
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.route === route);
  });
  renderRoute();
}

function renderRoute() {
  const c = document.getElementById('content');
  c.style.opacity = '0';
  setTimeout(() => {
    switch(state.route) {
      case 'dashboard': renderDashboard(); break;
      case 'lojas': renderLojas(); break;
      case 'loja-detalhe': renderLojaDetalhe(); break;
      case 'compras': renderCompras(); break;
      case 'solicitacoes': renderSolicitacoes(); break;
      case 'pedidos-colab': renderPedidosColab(); break;
      case 'minha-lista': renderMinhaLista(); break;
      case 'documentos': renderDocumentos(); break;
      case 'importar': renderImportar(); break;
      case 'historico': renderHistorico(); break;
      case 'relatorios': renderRelatorios(); break;
      case 'search': renderSearch(); break;
      case 'usuarios': renderUsuarios(); break;
      case 'configuracoes': renderConfig(); break;
      default: renderDashboard();
    }
    updateBadges();
    setTimeout(()=>{ lucide.createIcons(); c.style.opacity = '1'; }, 30);
  }, 80);
}

function updateBadges() {
  const setBadge = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
  setBadge('badgeCompras', state.purchases.length);
  setBadge('badgeSolic', state.requests.filter(r=>r.status==='Pendente').length);
  setBadge('badgeLojas', state.lojas.length);
  const pendentesPed = state.pedidos.filter(p => p.status==='Pendente').length;
  setBadge('badgeColab', pendentesPed);
  if (state.user && state.user.lojaPreferida) {
    const mine = state.pedidos.filter(p => p.lojaId === state.user.lojaPreferida && p.status==='Pendente').length;
    setBadge('badgeMinhaLista', mine);
  }
}

function renderRecentActivity() {
  const el = document.getElementById('recentActivity');
  if (!el) return;
  const recent = state.logs.slice(0, 8);
  if (!recent.length) {
    el.innerHTML = '<div class="muted" style="padding:14px;font-size:13px">Nenhuma atividade ainda.</div>';
    return;
  }
  const iconMap = { login:'log-in', logout:'log-out', create:'plus-circle', update:'edit-3', delete:'trash-2', import:'upload', export:'download', seed:'database' };
  const colorMap = { login:'', logout:'', create:'green', update:'gold', delete:'amber', import:'gold', export:'', seed:'' };
  el.innerHTML = recent.map(l => `
    <div class="activity-item">
      <div class="activity-icon ${colorMap[l.action]||''}"><i data-lucide="${iconMap[l.action]||'circle'}"></i></div>
      <div class="activity-body">
        <div class="activity-text">${escapeHtml(l.message)}</div>
        <div class="activity-meta">${escapeHtml(l.by)} · ${fmt.ago(l.at)}</div>
      </div>
    </div>
  `).join('');
  lucide.createIcons();
}

/* CHARTS */
function destroyChart(key) {
  if (state.charts[key]) { state.charts[key].destroy(); delete state.charts[key]; }
}

function drawChartEvolucao() {
  const ctx = document.getElementById('chartEvolucao');
  if (!ctx) return;
  destroyChart('evolucao');

  // Agrupa por mês dos últimos 12 meses
  const months = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(); d.setMonth(d.getMonth() - i);
    months.push({ key: d.toISOString().slice(0,7), label: d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','') });
  }
  const data = months.map(m => state.purchases.filter(p=>p.data && p.data.startsWith(m.key)).reduce((s,p)=>s+(parseFloat(p.valor)||0),0));

  const grad = ctx.getContext('2d').createLinearGradient(0,0,0,280);
  grad.addColorStop(0,'rgba(200,155,60,0.4)');
  grad.addColorStop(1,'rgba(200,155,60,0)');

  state.charts.evolucao = new Chart(ctx, {
    type:'line',
    data:{
      labels: months.map(m=>m.label),
      datasets:[{
        label:'Compras',
        data,
        borderColor:'#C89B3C',
        backgroundColor:grad,
        borderWidth:2.5,
        tension:0.4,
        fill:true,
        pointRadius:0,
        pointHoverRadius:6,
        pointHoverBackgroundColor:'#C89B3C',
        pointHoverBorderColor:'#fff',
        pointHoverBorderWidth:2,
      }]
    },
    options: chartOpts({ tickCallback: v => 'R$ ' + (v/1000).toFixed(0) + 'k' })
  });
}

function drawChartStatus() {
  const ctx = document.getElementById('chartStatus');
  if (!ctx) return;
  destroyChart('status');
  const counts = {};
  PURCHASE_STATUS.forEach(s => counts[s] = state.purchases.filter(p=>p.status===s).length);
  const colors = { 'Pendente':'#fbbf24','Aprovado':'#60a5fa','Processando':'#a78bfa','Concluído':'#34d399','Rejeitado':'#f87171' };
  state.charts.status = new Chart(ctx, {
    type:'bar',
    data:{
      labels:Object.keys(counts),
      datasets:[{
        data:Object.values(counts),
        backgroundColor:Object.keys(counts).map(s=>colors[s]+'cc'),
        borderColor:Object.keys(counts).map(s=>colors[s]),
        borderWidth:1.5,
        borderRadius:8,
        borderSkipped:false,
      }]
    },
    options: chartOpts({ legend:false, beginAtZero:true })
  });
}

function chartOpts(opt = {}) {
  return {
    responsive:true,
    maintainAspectRatio:false,
    plugins:{
      legend:{ display: opt.legend !== false, labels:{color:'#c4ccdb'} },
      tooltip:{
        backgroundColor:'rgba(13,17,32,.95)',
        titleColor:'#fff', bodyColor:'#c4ccdb',
        borderColor:'rgba(255,255,255,.1)', borderWidth:1,
        padding:12, cornerRadius:8,
        callbacks: opt.tickCallback ? { label: c => ' ' + (typeof c.parsed.y === 'number' ? fmt.brl(c.parsed.y) : c.parsed) } : undefined,
      }
    },
    scales:{
      x:{ grid:{color:'rgba(255,255,255,.04)',drawBorder:false}, ticks:{color:'#8b95a8',font:{family:'Outfit'}} },
      y:{ beginAtZero: opt.beginAtZero !== false, grid:{color:'rgba(255,255,255,.04)',drawBorder:false}, ticks:{color:'#8b95a8',font:{family:'Outfit'},callback: opt.tickCallback} }
    }
  };
}

function filterPurchases() {
  return state.purchases.filter(p => {
    if (comprasFilter.setor && p.setor !== comprasFilter.setor) return false;
    if (comprasFilter.status && p.status !== comprasFilter.status) return false;
    if (comprasFilter.q) {
      const q = comprasFilter.q.toLowerCase();
      const hit = [p.descricao,p.fornecedor,p.codigo,p.setor,p.status].some(v => v && String(v).toLowerCase().includes(q));
      if (!hit) return false;
    }
    return true;
  });
}

function renderComprasTable() {
  const filtered = filterPurchases();
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / comprasFilter.perPage));
  if (comprasFilter.page > totalPages) comprasFilter.page = totalPages;
  const slice = filtered.slice((comprasFilter.page-1)*comprasFilter.perPage, comprasFilter.page*comprasFilter.perPage);
  document.getElementById('comprasTableBody').innerHTML = renderPurchaseTable(slice, true) + renderPagination(comprasFilter.page, totalPages, p=>{comprasFilter.page=p;renderComprasTable();}, total);
  lucide.createIcons();
}

function renderPurchaseTable(items, withActions) {
  if (!items.length) {
    return `<div class="empty-state"><i data-lucide="inbox"></i><h3>Nenhum registro encontrado</h3><p>Tente ajustar os filtros ou importar dados.</p></div>`;
  }
  return `
    <table class="data">
      <thead><tr>
        <th>Código</th>
        <th>Descrição</th>
        <th>Fornecedor</th>
        <th>Setor</th>
        <th>Data</th>
        <th>Valor</th>
        <th>Status</th>
        ${withActions ? '<th></th>' : ''}
      </tr></thead>
      <tbody>
        ${items.map(p => `
          <tr>
            <td><code style="font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--gold-400)">${escapeHtml(p.codigo||'—')}</code></td>
            <td class="cell-strong">${escapeHtml(p.descricao||'—')}</td>

          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderPagination(page, totalPages, onPage, totalItems) {
  if (totalPages <= 1) return `<div class="pagination"><span>${totalItems||0} registro(s)</span></div>`;
  const buttons = [];
  buttons.push(`<button onclick="(${onPage.toString()})(${page-1})" ${page<=1?'disabled':''}><i data-lucide="chevron-left"></i></button>`);
  for (let i=1; i<=totalPages; i++) {
    if (i===1 || i===totalPages || Math.abs(i-page)<=1) {
      buttons.push(`<button class="${i===page?'active':''}" onclick="(${onPage.toString()})(${i})">${i}</button>`);
    } else if (Math.abs(i-page)===2) {
      buttons.push(`<span style="padding:0 4px;color:var(--ink-400)">…</span>`);
    }
  }
  buttons.push(`<button onclick="(${onPage.toString()})(${page+1})" ${page>=totalPages?'disabled':''}><i data-lucide="chevron-right"></i></button>`);
  return `<div class="pagination"><span>${totalItems} registro(s) · página ${page} de ${totalPages}</span><div class="pages">${buttons.join('')}</div></div>`;
}

async function openPurchaseModal(id) {
  const editing = id ? state.purchases.find(p=>p.id===id) : null;
  const data = editing || { codigo: 'CMP-' + (1000 + state.purchases.length), descricao:'', fornecedor:'', setor:'Operacional', valor:'', status:'Pendente', data:new Date().toISOString().slice(0,10), observacoes:'' };
  showModal({
    title: editing ? 'Editar compra' : 'Nova compra',
    body: `
      <div class="form-grid">
        <div class="field"><label>Código</label><input id="m_codigo" value="${escapeHtml(data.codigo)}" /></div>
        <div class="field"><label>Data</label><input id="m_data" type="date" value="${data.data||''}" /></div>
        <div class="field full"><label>Descrição</label><input id="m_descricao" value="${escapeHtml(data.descricao)}" placeholder="Ex.: Toner impressora HP" /></div>
        <div class="field"><label>Fornecedor</label><input id="m_fornecedor" value="${escapeHtml(data.fornecedor)}" /></div>
        <div class="field"><label>Setor</label><select id="m_setor">${SECTORS.map(s=>`<option value="${s}" ${data.setor===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Valor (R$)</label><input id="m_valor" type="number" step="0.01" value="${data.valor||''}" placeholder="0,00" /></div>
        <div class="field"><label>Status</label><select id="m_status">${PURCHASE_STATUS.map(s=>`<option value="${s}" ${data.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field full"><label>Observações</label><textarea id="m_obs" rows="3" placeholder="Observações internas...">${escapeHtml(data.observacoes||'')}</textarea></div>
      </div>
    `,
    onConfirm: async () => {
      const novo = {
        ...data,
        codigo: document.getElementById('m_codigo').value.trim(),
        descricao: document.getElementById('m_descricao').value.trim(),
        fornecedor: document.getElementById('m_fornecedor').value.trim(),
        setor: document.getElementById('m_setor').value,
        valor: parseFloat(document.getElementById('m_valor').value) || 0,
        status: document.getElementById('m_status').value,
        data: document.getElementById('m_data').value,
        observacoes: document.getElementById('m_obs').value.trim(),
      };
      if (!novo.descricao) { toast('Descrição obrigatória','','warning'); return false; }

      if (editing) {
        const changes = {};
        Object.keys(novo).forEach(k => { if (data[k] !== novo[k] && k !== 'historico') changes[k] = { de: data[k], para: novo[k] }; });
        novo.historico = [...(data.historico||[]), { at: new Date().toISOString(), by: state.user.name, action:'atualizado', changes }];
        const idx = state.purchases.findIndex(p=>p.id===editing.id);
        state.purchases[idx] = novo;
        await pushLog('update', `Compra <strong>${novo.codigo}</strong> atualizada`, { id: novo.id, changes });
        toast('Compra atualizada','Histórico de alteração registrado','success');
      } else {
        novo.id = uid();
        novo.criadoPor = state.user.name;
        novo.criadoEm = new Date().toISOString();
        novo.historico = [{ at: new Date().toISOString(), by: state.user.name, action:'criado' }];
        novo._hash = hashRecord({d:novo.descricao,f:novo.fornecedor,s:novo.setor,v:novo.valor});
        state.purchases.unshift(novo);
        await pushLog('create', `Nova compra <strong>${novo.codigo}</strong>: ${novo.descricao}`, { id: novo.id, valor: novo.valor });
        toast('Compra registrada','Registro adicionado ao sistema','success');
      }
      await Storage.set('solys:purchases', state.purchases);
      renderComprasTable();
      updateBadges();
      return true;
    }
  });
}

async function deletePurchase(id) {
  if (!confirm('Arquivar este registro? O dado permanece no histórico permanente.')) return;
  const p = state.purchases.find(x=>x.id===id);
  if (!p) return;
  // Arquivamento lógico — NÃO deleta, marca como arquivado
  p.arquivado = true;
  p.arquivadoEm = new Date().toISOString();
  p.arquivadoPor = state.user.name;
  // Para esta demo, removemos da lista visível mas guardamos em arquivo
  const arquivados = await Storage.get('solys:purchases:arquivo', []);
  arquivados.unshift(p);
  await Storage.set('solys:purchases:arquivo', arquivados);
  state.purchases = state.purchases.filter(x=>x.id!==id);
  await Storage.set('solys:purchases', state.purchases);
  await pushLog('delete', `Compra <strong>${p.codigo}</strong> arquivada`, { id });
  toast('Compra arquivada','O registro permanece no histórico','info');
  renderComprasTable();
  updateBadges();
}

async function changeRequestStatus(id) {
  const r = state.requests.find(x=>x.id===id);
  if (!r) return;
  const idx = PURCHASE_STATUS.indexOf(r.status);
  const next = PURCHASE_STATUS[(idx+1) % PURCHASE_STATUS.length];
  const before = r.status;
  r.status = next;
  await Storage.set('solys:requests', state.requests);
  await pushLog('update', `Solicitação <strong>${r.codigo}</strong> mudou de ${before} para ${next}`, { id });
  toast('Status atualizado',`${before} → ${next}`,'success');
  renderSolicitacoes();
}

function openImport() { navigate('importar'); }

async function handleImport(file) {
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  toast('Processando arquivo','Analisando estrutura...','info');

  try {
    if (ext === 'csv' || ext === 'xlsx' || ext === 'xls') {
      await importSpreadsheet(file, ext);
    } else if (ext === 'pdf') {
      await importPDF(file);
    } else {
      toast('Formato não suportado','Use .xlsx, .csv ou .pdf','error');
    }
  } catch (e) {
    console.error(e);
    toast('Erro ao importar', e.message || 'Falha ao ler o arquivo','error');
  }
}

async function importSpreadsheet(file, ext) {
  const data = await file.arrayBuffer();
  const wb = XLSX.read(data, { type:'array', cellDates:true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:'', raw:false });
  if (!rows.length) { toast('Planilha vazia','Nenhuma linha encontrada','warning'); return; }

  const headers = Object.keys(rows[0]);
  const mapping = autoMapColumns(headers);

  // Preview
  const preview = document.getElementById('importPreview');
  preview.classList.remove('hidden');
  preview.innerHTML = `
    <div class="preview-meta">
      <div class="meta-icon"><i data-lucide="file-spreadsheet"></i></div>
      <div class="meta-text">
        <strong>${escapeHtml(file.name)}</strong>
        <small>${rows.length} linhas · ${headers.length} colunas detectadas</small>
      </div>
    </div>
    <div class="panel" style="margin-bottom:14px">
      <div class="panel-title" style="font-size:14px;margin-bottom:10px">Mapeamento detectado automaticamente</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12.5px">
        ${Object.entries(mapping).map(([field,col])=>`
          <div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(255,255,255,.02);border-radius:8px">
            <i data-lucide="check-circle" style="width:14px;height:14px;color:${col?'var(--success)':'var(--ink-400)'}"></i>
            <strong style="color:${col?'#fff':'var(--ink-400)'};text-transform:capitalize">${field}:</strong>
            <span class="muted">${col ? escapeHtml(col) : '(não encontrado)'}</span>
          </div>
        `).join('')}
      </div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn gold" onclick="confirmImport()"><i data-lucide="check"></i>Confirmar importação</button>
      <button class="btn ghost" onclick="document.getElementById('importPreview').classList.add('hidden')"><i data-lucide="x"></i>Cancelar</button>
    </div>
  `;
  lucide.createIcons();

  // Stash para confirmação
  state._pendingImport = { rows, mapping, file, ext, headers };
}

function autoMapColumns(headers) {
  // Detecta colunas por nome aproximado (case insensitive, sem acentos)
  const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  const dict = {
    codigo:     ['codigo','cod','id','numero','num'],
    descricao:  ['descricao','desc','descrip','produto','item','servico','obj','titulo','assunto'],
    fornecedor: ['fornecedor','forn','empresa','vendor','razao','razao social'],
    setor:      ['setor','departamento','depto','area','centro custo'],
    valor:      ['valor','preco','total','vlr','custo','amount'],
    data:       ['data','date','dt','emissao','vencimento'],
    status:     ['status','situacao','estado','condicao'],
    observacoes:['observacao','obs','comentario','nota'],
  };
  const out = {};
  Object.keys(dict).forEach(field => {
    const tokens = dict[field];
    const match = headers.find(h => tokens.some(t => norm(h).includes(t)));
    if (match) out[field] = match;
  });
  return out;
}

async function confirmImport() {
  const pending = state._pendingImport;
  if (!pending) return;

  const { rows, mapping, file, ext } = pending;
  let novos = 0, atualizados = 0, duplicados = 0;

  rows.forEach(row => {
    const rec = {
      codigo: mapping.codigo ? String(row[mapping.codigo]||'').trim() : '',
      descricao: mapping.descricao ? String(row[mapping.descricao]||'').trim() : '',
      fornecedor: mapping.fornecedor ? String(row[mapping.fornecedor]||'').trim() : '',
      setor: mapping.setor ? String(row[mapping.setor]||'Operacional').trim() : 'Operacional',
      valor: mapping.valor ? parseValor(row[mapping.valor]) : 0,
      data: mapping.data ? parseDate(row[mapping.data]) : new Date().toISOString().slice(0,10),
      status: mapping.status ? String(row[mapping.status]||'Pendente').trim() : 'Pendente',
      observacoes: mapping.observacoes ? String(row[mapping.observacoes]||'') : '',
    };

    if (!rec.descricao && !rec.codigo) return; // Linha vazia

    // Normaliza status para conjunto válido
    if (!PURCHASE_STATUS.includes(rec.status)) {
      const found = PURCHASE_STATUS.find(s => s.toLowerCase()===rec.status.toLowerCase());
      rec.status = found || 'Pendente';
    }

    const hash = hashRecord({d:rec.descricao,f:rec.fornecedor,s:rec.setor,v:rec.valor});

    // 1) tenta por código (chave forte)
    let existing = rec.codigo ? state.purchases.find(p=>p.codigo===rec.codigo) : null;
    // 2) fallback: hash
    if (!existing) existing = state.purchases.find(p=>p._hash===hash);

    if (existing) {
      // Atualizar se algo mudou
      const changes = {};
      Object.keys(rec).forEach(k => {
        if (rec[k] && existing[k] !== rec[k]) {
          changes[k] = { de: existing[k], para: rec[k] };
          existing[k] = rec[k];
        }
      });
      if (Object.keys(changes).length) {
        existing.historico = [...(existing.historico||[]), { at: new Date().toISOString(), by: state.user.name, action:'importação', changes }];
        atualizados++;
      } else {
        duplicados++;
      }
    } else {
      const novo = {
        ...rec,
        id: uid(),
        codigo: rec.codigo || ('CMP-' + (1000 + state.purchases.length + novos)),
        criadoPor: state.user.name + ' (importação)',
        criadoEm: new Date().toISOString(),
        importadoDe: file.name,
        _hash: hash,
        historico: [{ at: new Date().toISOString(), by: state.user.name, action:'importado', fonte: file.name }],
      };
      state.purchases.unshift(novo);
      novos++;
    }
  });

  await Storage.set('solys:purchases', state.purchases);

  // Registra documento
  const docMeta = {
    id: uid(),
    name: file.name,
    type: ext,
    size: file.size,
    sizeStr: (file.size / 1024).toFixed(1) + ' KB',
    by: state.user.name,
    at: new Date().toISOString(),
    records: novos,
    updated: atualizados,
    duplicates: duplicados,
    columns: pending.headers,
  };
  state.documents.unshift(docMeta);
  await Storage.set('solys:documents', state.documents);

  await pushLog('import', `Planilha <strong>${file.name}</strong> importada (${novos} novos, ${atualizados} atualizados, ${duplicados} duplicados)`, { file: file.name, novos, atualizados, duplicados });

  toast('Importação concluída', `${novos} novos · ${atualizados} atualizados · ${duplicados} duplicados`, 'success');

  state._pendingImport = null;
  document.getElementById('importPreview').classList.add('hidden');
  updateBadges();
}

function parseValor(v) {
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  // Remove R$, pontos de milhar, troca vírgula por ponto
  const s = String(v).replace(/[R$\s]/g,'').replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function parseDate(v) {
  if (!v) return new Date().toISOString().slice(0,10);
  if (v instanceof Date) return v.toISOString().slice(0,10);
  // dd/mm/yyyy
  const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if (m) {
    let y = m[3].length === 2 ? '20'+m[3] : m[3];
    return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  const d = new Date(v);
  return isNaN(d) ? new Date().toISOString().slice(0,10) : d.toISOString().slice(0,10);
}

async function importPDF(file) {
  // PDF: registramos como documento (extração textual via PDF.js fica como TODO em produção)
  const docMeta = {
    id: uid(),
    name: file.name,
    type:'pdf',
    size: file.size,
    sizeStr: (file.size/1024).toFixed(1) + ' KB',
    by: state.user.name,
    at: new Date().toISOString(),
    records: 0, updated: 0, duplicates: 0,
    columns: [],
  };
  state.documents.unshift(docMeta);
  await Storage.set('solys:documents', state.documents);
  await pushLog('import', `Documento PDF <strong>${file.name}</strong> arquivado`, { file: file.name });
  toast('PDF arquivado','PDF salvo na biblioteca de documentos','success');
}
