function renderLojaRow(lojaId, it) {
  const mesNow = mesAtualKey();
  const total = MESES.reduce((s,m)=>s+(it[m]|0),0);
  return `<tr data-desc="${escapeHtml(it.descricao.toLowerCase())}">
    <td class="sticky-left"><strong>${escapeHtml(it.descricao)}</strong></td>
    ${MESES.map(m => `
      <td class="${m===mesNow?'col-now':''}"><input type="number" min="0" class="cell-input" value="${it[m]|0}"
        onchange="updateLojaCell('${lojaId}','${it.id}','${m}',this.value)" /></td>
    `).join('')}
    <td><strong style="color:var(--gold-400)">${total}</strong></td>
    <td><input type="text" class="cell-input cell-text" value="${escapeHtml(it.obs||'')}"
        onchange="updateLojaCell('${lojaId}','${it.id}','obs',this.value)" placeholder="—" /></td>
    <td><button class="icon-btn" onclick="delLojaItem('${lojaId}','${it.id}')" title="Excluir item"><i data-lucide="trash-2"></i></button></td>
  </tr>`;
}

async function updateLojaCell(lojaId, itemId, field, value) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const it = loja.itens.find(x => x.id === itemId); if (!it) return;
  const oldVal = it[field];
  if (MESES.includes(field)) {
    it[field] = parseInt(value)||0;
  } else {
    it[field] = value;
  }
  if (!it.historico) it.historico = [];
  it.historico.push({ at:new Date().toISOString(), by:state.user?.name||'?', action:`alterou ${field}`, de:oldVal, para:it[field] });
  await Storage.set('solys:lojas', state.lojas);
  await pushLog('loja-edit', `${state.user?.name||'?'} alterou ${field} de "${it.descricao}" em ${loja.nome}`, { de:oldVal, para:it[field] });
  // re-render row + footer totals
  const tbody = document.getElementById('lojaTbody');
  if (tbody) {
    // Atualiza só a linha trocada e o footer
    const rows = tbody.querySelectorAll('tr');
    rows.forEach(tr => {
      if (tr.dataset.desc === it.descricao.toLowerCase()) {
        tr.outerHTML = renderLojaRow(lojaId, it);
      }
    });
    // re-render footer
    const tfootCells = document.querySelectorAll('#lojaTable tfoot th');
    if (tfootCells.length >= 14) {
      MESES.forEach((m,i) => { tfootCells[1+i].textContent = lojaTotalMes(loja, m); });
      tfootCells[13].textContent = lojaTotalAno(loja);
    }
    setTimeout(()=>lucide.createIcons(),20);
  }
}

async function addLojaItem(lojaId) {
  openModal({
    title: 'Novo item',
    body: `
      <label>Descrição</label>
      <input type="text" id="newItemDesc" placeholder="Ex: PAPEL HIGIÊNICO 12 ROLOS" autofocus />
      <label style="margin-top:10px">Quantidade em ${MESES_LABEL[MESES.indexOf(mesAtualKey())]}</label>
      <input type="number" id="newItemQtd" min="0" value="0" />
      <label style="margin-top:10px">Observações</label>
      <input type="text" id="newItemObs" placeholder="(opcional)" />
    `,
    actions: `<button class="btn ghost" onclick="closeModal()">Cancelar</button>
              <button class="btn gold" onclick="saveNewLojaItem('${lojaId}')">Adicionar</button>`,
  });
}

async function saveNewLojaItem(lojaId) {
  const desc = document.getElementById('newItemDesc').value.trim();
  const qtd = parseInt(document.getElementById('newItemQtd').value)||0;
  const obs = document.getElementById('newItemObs').value.trim();
  if (!desc) { toast('Atenção','Descrição é obrigatória','warning'); return; }
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const mNow = mesAtualKey();
  const novo = {
    id: uid(), descricao: desc.toUpperCase(),
    jan:0, fev:0, mar:0, abr:0, mai:0, jun:0, jul:0, ago:0, set:0, out:0, nov:0, dez:0,
    obs, criadoEm:new Date().toISOString(),
    historico: [{ at:new Date().toISOString(), by:state.user?.name||'?', action:'item criado' }],
  };
  novo[mNow] = qtd;
  loja.itens.push(novo);
  await Storage.set('solys:lojas', state.lojas);
  await pushLog('loja-add', `${state.user?.name||'?'} adicionou "${desc}" em ${loja.nome}`, { qtd });
  closeModal();
  toast('Item adicionado', desc, 'success');
  renderLojaDetalhe();
  setTimeout(()=>lucide.createIcons(),50);
}

async function delLojaItem(lojaId, itemId) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const it = loja.itens.find(x => x.id === itemId); if (!it) return;
  if (!confirm(`Excluir "${it.descricao}"? Esta ação não pode ser desfeita.`)) return;
  loja.itens = loja.itens.filter(x => x.id !== itemId);
  await Storage.set('solys:lojas', state.lojas);
  await pushLog('loja-del', `${state.user?.name||'?'} removeu "${it.descricao}" de ${loja.nome}`);
  toast('Item removido', it.descricao, 'info');
  renderLojaDetalhe();
  setTimeout(()=>lucide.createIcons(),50);
}

function openLojaModal() {
  openModal({

      <input type="text" id="newLojaNome" placeholder="Ex: Loja Aquiraz" autofocus />

async function saveNewLoja() {
  const nome = document.getElementById('newLojaNome').value.trim();
  const local = document.getElementById('newLojaLocal').value.trim();
  if (!nome) { toast('Atenção','Nome é obrigatório','warning'); return; }

    nome, localidade: local || '—',

  };

  navigate('loja-detalhe');

async function exportLojaXLSX(lojaId) {
  const loja = state.lojas.find(l => l.id === lojaId); if (!loja) return;
  const rows = [['DESCRICAO', ...MESES_LABEL, 'TOTAL', 'OBS']];
  loja.itens.forEach(it => {
    const total = MESES.reduce((s,m)=>s+(it[m]|0),0);
    rows.push([it.descricao, ...MESES.map(m=>it[m]|0), total, it.obs||'']);
  });
  rows.push(['TOTAL', ...MESES.map(m=>lojaTotalMes(loja,m)), lojaTotalAno(loja), '']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, loja.nome.slice(0,30));
  XLSX.writeFile(wb, `${loja.nome.replace(/\s+/g,'_')}.xlsx`);
  toast('Exportado', loja.nome+'.xlsx', 'success');
}

async function exportLojasXLSX() {
  const wb = XLSX.utils.book_new();
  // Dashboard
  const dash = [['LOJA','LOCALIDADE','ITENS', ...MESES_LABEL, 'TOTAL ANO']];
  state.lojas.forEach(l => {
    dash.push([l.nome, l.localidade, l.itens.length, ...MESES.map(m=>lojaTotalMes(l,m)), lojaTotalAno(l)]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dash), 'DASHBOARD');
  // Uma aba por loja
  state.lojas.forEach(loja => {
    const rows = [['DESCRICAO', ...MESES_LABEL, 'TOTAL', 'OBS']];
    loja.itens.forEach(it => {
      const total = MESES.reduce((s,m)=>s+(it[m]|0),0);
      rows.push([it.descricao, ...MESES.map(m=>it[m]|0), total, it.obs||'']);
    });
    rows.push(['TOTAL', ...MESES.map(m=>lojaTotalMes(loja,m)), lojaTotalAno(loja), '']);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), loja.nome.replace('Loja ','').slice(0,30));
  });
  XLSX.writeFile(wb, 'SOLYS_Lojas_completo.xlsx');
  toast('Exportado', 'SOLYS_Lojas_completo.xlsx', 'success');
}

/* ----------------------------------------------------------------
   PEDIDOS POR LOJA — modelo: data + solicitante + lista de produtos
   Colaborador (loja) faz seu pedido; gestão acompanha tudo
   ---------------------------------------------------------------- */

const PEDIDO_STATUS = ['Pendente','Aprovado','Em compra','Entregue','Rejeitado'];
const MES_NOME = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function getLojaSelecionada() {
  if (!state.user) return null;
  return state.user.lojaPreferida || null;
}
async function setLojaSelecionada(lojaId) {
  if (!state.user) return;
  state.user.lojaPreferida = lojaId;
  const idx = state.users.findIndex(u => u.id === state.user.id);
  if (idx !== -1) { state.users[idx].lojaPreferida = lojaId; await Storage.set('solys:users', state.users); }
}

function pedidosDaLoja(lojaId) {
  return state.pedidos
    .filter(p => p.lojaId === lojaId)
    .sort((a,b) => new Date(b.criadoEm) - new Date(a.criadoEm));
}

// Referência do "mês anterior": último pedido feito pela loja,
// ou, se não houver, os itens do mês anterior no controle mensal da loja
function referenciaMesAnterior(loja) {
  const meus = pedidosDaLoja(loja.id);
  if (meus.length) {
    return { tipo:'pedido', pedido: meus[0] };
  }
  // fallback: controle mensal da loja
  const mesIdx = new Date().getMonth();
  const prevIdx = (mesIdx + 11) % 12;
  const ordem = [prevIdx];
  for (let i=1;i<12;i++) ordem.push((prevIdx - i + 12) % 12);
  for (const idx of ordem) {
    const m = MESES[idx];
    const itens = loja.itens.filter(it => (it[m]|0) > 0).map(it => ({ descricao: it.descricao, quantidade: it[m]|0, unidade:'un' }));
    if (itens.length) return { tipo:'grid', mesIdx: idx, itens };
  }
  return null;
}

function renderMinhaLista() {
  const c = document.getElementById('content');
  const lojaId = getLojaSelecionada();
  const loja = state.lojas.find(l => l.id === lojaId);

  if (!loja) {
    c.innerHTML = `<div class="panel" style="text-align:center;padding:40px">
      <p class="muted">Não foi possível identificar sua loja.</p>
      <button class="btn gold" onclick="logout()" style="margin-top:12px">Voltar e escolher loja</button>
    </div>`;
    return;
  }

  const meus = pedidosDaLoja(loja.id);
  const pendentes = meus.filter(p => p.status === 'Pendente');
  const ref = referenciaMesAnterior(loja);

  c.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">${escapeHtml(loja.nome)}</h1>
        <p class="page-sub">
          <i data-lucide="map-pin" style="width:13px;height:13px;display:inline-block;vertical-align:-2px"></i>
          ${escapeHtml(loja.localidade)}
          <button class="link-btn" onclick="trocarLojaColab()" style="margin-left:8px">trocar loja</button>
        </p>
      </div>
      <div class="page-actions">
        <button class="btn gold" onclick="abrirNovoPedido()"><i data-lucide="plus"></i>Fazer novo pedido</button>
      </div>
    </div>

    <!-- REFERÊNCIA MÊS ANTERIOR -->
    <div class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title"><i data-lucide="history" style="width:15px;height:15px;display:inline-block;vertical-align:-2px;color:var(--gold-400)"></i> Pedido do mês anterior</div>
          <div class="panel-sub">${ref
            ? (ref.tipo === 'pedido'
                ? `Último pedido — ${fmt.date(ref.pedido.data)} · solicitado por ${escapeHtml(ref.pedido.solicitante)}`
                : `Referência do controle de ${MES_NOME[ref.mesIdx]}`)
            : 'Sem histórico ainda'}</div>
        </div>
        ${ref ? `<button class="btn" onclick="usarReferencia()"><i data-lucide="copy"></i>Usar como base</button>` : ''}
      </div>
      ${ref ? `
        <div class="ref-grid">
          ${ref.itens.map(it => `
            <div class="ref-item">
              <span class="ref-qtd">${it.quantidade}${it.unidade && it.unidade!=='un' ? ' '+escapeHtml(it.unidade) : ''}</span>
              <span class="ref-desc">${escapeHtml(it.descricao)}</span>
            </div>
          `).join('')}
        </div>
      ` : `<div class="empty-state"><i data-lucide="package"></i><p>Esta loja ainda não tem pedidos registrados.<br><small>Clique em "Fazer novo pedido" para começar.</small></p></div>`}
    </div>

    <!-- MEUS PEDIDOS -->
    <div class="panel" style="margin-top:16px">
      <div class="panel-head">
        <div><div class="panel-title">Pedidos da loja</div><div class="panel-sub">${meus.length} pedido(s) · ${pendentes.length} aguardando</div></div>
      </div>
      ${meus.length ? `<div class="pedidos-list">${meus.map(p => renderPedidoCard(p, true)).join('')}</div>`
        : '<div class="empty-state"><i data-lucide="clipboard-list"></i><p>Nenhum pedido feito ainda.</p></div>'}
    </div>
  `;
  // guarda a referência para "usar como base"
  state._ultimaRef = ref;
}

function renderPedidoCard(p, podeEditar) {
  const statusCls = { 'Pendente':'amber','Aprovado':'blue','Em compra':'blue','Entregue':'green','Rejeitado':'red' }[p.status] || 'grey';
  const totalItens = p.itens.reduce((s,i)=>s+(i.quantidade||0),0);
  return `<div class="pedido-card">
    <div class="pedido-card-head">
      <div>
        <div class="pedido-data"><i data-lucide="calendar"></i> ${fmt.date(p.data)}</div>
        <div class="pedido-solic"><i data-lucide="user"></i> ${escapeHtml(p.solicitante)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="status-pill ${statusCls}">${p.status}</span>
        ${podeEditar && p.status === 'Pendente' ? `
          <button class="icon-btn" onclick="abrirNovoPedido('${p.id}')" title="Editar"><i data-lucide="edit-3"></i></button>
          <button class="icon-btn danger" onclick="excluirPedido('${p.id}')" title="Excluir"><i data-lucide="trash-2"></i></button>
        ` : ''}
      </div>
    </div>
    <div class="pedido-itens">
      ${p.itens.map(it => `<div class="pedido-item-line">
        <span class="pedido-item-qtd">${it.quantidade}${it.unidade && it.unidade!=='un' ? ' '+escapeHtml(it.unidade):''}</span>
        <span>${escapeHtml(it.descricao)}</span>
      </div>`).join('')}
    </div>
    ${p.observacao ? `<div class="pedido-obs"><i data-lucide="message-square"></i> ${escapeHtml(p.observacao)}</div>` : ''}
    ${p.respostaAdmin ? `<div class="pedido-resposta"><i data-lucide="corner-down-right"></i> <strong>Gestão:</strong> ${escapeHtml(p.respostaAdmin)}</div>` : ''}
    <div class="pedido-foot">${totalItens} itens · ${fmt.ago(p.criadoEm)}</div>
  </div>`;
}

/* ---------- Formulário de novo pedido (tela inteira) ---------- */
function abrirNovoPedido(editId) {
  const lojaId = getLojaSelecionada();
  const loja = state.lojas.find(l => l.id === lojaId);
  if (!loja) return;
  const editando = editId ? state.pedidos.find(p => p.id === editId) : null;

  // itens em edição (cópia de trabalho)
  state._pedidoItens = editando
    ? editando.itens.map(i => ({...i}))
    : [{ descricao:'', quantidade:1, unidade:'un' }];

  const hoje = new Date().toISOString().slice(0,10);
  const sugestoes = [...new Set(loja.itens.map(i => i.descricao))].sort();

  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <div>
        <button class="btn ghost" onclick="renderMinhaLista()" style="margin-bottom:8px"><i data-lucide="arrow-left"></i>Voltar</button>
        <h1 class="page-title">${editando ? 'Editar pedido' : 'Novo pedido'}</h1>
        <p class="page-sub"><i data-lucide="store" style="width:13px;height:13px;display:inline-block;vertical-align:-2px"></i> ${escapeHtml(loja.nome)}</p>
      </div>
    </div>

    <datalist id="sugProdutos">${sugestoes.map(s=>`<option value="${escapeHtml(s)}"></option>`).join('')}</datalist>

    <div class="panel" style="max-width:860px">
      <div class="form-row-2">
        <div>
          <label class="fld-label">Data do pedido</label>
          <input type="date" id="pedData" class="fld" value="${editando ? editando.data : hoje}" />
        </div>
        <div>
          <label class="fld-label">Quem está solicitando</label>
          <input type="text" id="pedSolic" class="fld" placeholder="Seu nome" value="${editando ? escapeHtml(editando.solicitante) : ''}" />
        </div>
      </div>

      <div style="margin-top:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <label class="fld-label" style="margin:0">Produtos do pedido</label>
          <button class="btn sm" onclick="addLinhaPedido()"><i data-lucide="plus"></i>Adicionar produto</button>
        </div>
        <div id="pedItens"></div>
      </div>

      <div style="margin-top:18px">
        <label class="fld-label">Observação (opcional)</label>
        <textarea id="pedObs" class="fld" rows="2" placeholder="Ex: urgente, retirar na sede, etc.">${editando ? escapeHtml(editando.observacao||'') : ''}</textarea>
      </div>

      <div style="display:flex;gap:10px;margin-top:22px;justify-content:flex-end">
        <button class="btn ghost" onclick="renderMinhaLista()">Cancelar</button>
        <button class="btn gold" onclick="salvarPedido(${editando ? `'${editando.id}'` : 'null'})"><i data-lucide="check"></i>${editando ? 'Salvar alterações' : 'Enviar pedido'}</button>
      </div>
    </div>
  `;

  setTimeout(()=>{ lucide.createIcons(); document.getElementById('pedSolic').focus(); }, 60);
}

function renderLinhasPedido() {
  const wrap = document.getElementById('pedItens');
  if (!wrap) return;
  wrap.innerHTML = state._pedidoItens.map((it, i) => `
    <div class="ped-linha">
      <input type="number" min="1" class="fld ped-qtd" value="${it.quantidade}" onchange="setLinhaPedido(${i},'quantidade',this.value)" title="Quantidade" />
      <input type="text" class="fld ped-uni" value="${escapeHtml(it.unidade||'un')}" onchange="setLinhaPedido(${i},'unidade',this.value)" title="Unidade" />
      <input type="text" class="fld ped-desc" list="sugProdutos" placeholder="Nome do produto" value="${escapeHtml(it.descricao)}" onchange="setLinhaPedido(${i},'descricao',this.value)" />
      <button class="icon-btn danger" onclick="removerLinhaPedido(${i})" title="Remover" ${state._pedidoItens.length<=1?'style="visibility:hidden"':''}><i data-lucide="x"></i></button>

function setLinhaPedido(i, campo, valor) {
  if (!state._pedidoItens[i]) return;
  state._pedidoItens[i][campo] = campo === 'quantidade' ? (parseInt(valor)||0) : valor;
}
function addLinhaPedido() {
  state._pedidoItens.push({ descricao:'', quantidade:1, unidade:'un' });
  renderLinhasPedido();
}
function removerLinhaPedido(i) {
  state._pedidoItens.splice(i,1);
  if (!state._pedidoItens.length) state._pedidoItens.push({ descricao:'', quantidade:1, unidade:'un' });
  renderLinhasPedido();
}

function usarReferencia() {
  const ref = state._ultimaRef;
  if (!ref) return;
  abrirNovoPedido();
  state._pedidoItens = ref.itens.map(i => ({ descricao:i.descricao, quantidade:i.quantidade, unidade:i.unidade||'un' }));
  renderLinhasPedido();
  toast('Base carregada','Itens do mês anterior copiados','success');
}

async function salvarPedido(editId) {
  const data = document.getElementById('pedData').value;
  const solic = document.getElementById('pedSolic').value.trim();
  const obs = document.getElementById('pedObs').value.trim();
  const itens = state._pedidoItens
    .filter(it => it.descricao.trim())
    .map(it => ({ descricao: it.descricao.trim().toUpperCase(), quantidade: it.quantidade||1, unidade: (it.unidade||'un').trim() }));

  if (!solic) { toast('Atenção','Informe quem está solicitando','warning'); return; }
  if (!data) { toast('Atenção','Informe a data do pedido','warning'); return; }
  if (!itens.length) { toast('Atenção','Adicione pelo menos um produto','warning'); return; }

  const lojaId = getLojaSelecionada();
  const loja = state.lojas.find(l => l.id === lojaId);

  if (editId) {
    const p = state.pedidos.find(x => x.id === editId);
    if (!p || p.status !== 'Pendente') { toast('Não é possível editar','Pedido já processado','warning'); return; }
    Object.assign(p, { data, solicitante:solic, itens, observacao:obs });
    p.historico = p.historico || [];
    p.historico.push({ at:new Date().toISOString(), by:solic, action:'editado' });
    await pushLog('pedido-edit', `Pedido de ${loja.nome} editado por ${solic}`, { itens: itens.length });
    toast('Pedido atualizado','', 'success');
  } else {
    const novo = {
      id: uid(),
      lojaId, lojaNome: loja.nome, lojaLocal: loja.localidade,
      data, solicitante: solic, itens, observacao: obs,
      status: 'Pendente',
      criadoEm: new Date().toISOString(),
      historico: [{ at:new Date().toISOString(), by:solic, action:'criado' }],
    };
    state.pedidos.unshift(novo);
    await pushLog('pedido-novo', `${loja.nome}: novo pedido de ${solic} (${itens.length} itens)`, { data });
    toast('Pedido enviado','A gestão foi notificada','success');
  }
  await Storage.set('solys:pedidos', state.pedidos);
  updateBadges();
  renderMinhaLista();
  setTimeout(()=>lucide.createIcons(),50);
}

async function excluirPedido(id) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p || p.status !== 'Pendente') return;
  if (!confirm(`Excluir o pedido de ${fmt.date(p.data)}?`)) return;
  state.pedidos = state.pedidos.filter(x => x.id !== id);
  await Storage.set('solys:pedidos', state.pedidos);
  await pushLog('pedido-del', `Pedido de ${p.lojaNome} (${p.solicitante}) excluído`);
  toast('Pedido excluído','','info');
  updateBadges();
  renderMinhaLista();
  setTimeout(()=>lucide.createIcons(),50);
}

async function trocarLojaColab() {
  if (state.user && state.user.isLoja) {
    if (!confirm('Sair e escolher outra loja?')) return;
    logout(); return;
  }
  if (!confirm('Trocar de loja?')) return;

function renderPedidosColab() {
  const c = document.getElementById('content');

    return new Date(b.criadoEm) - new Date(a.criadoEm);

  const fLoja = state._filtroPed?.loja || 'all';
  const fStatus = state._filtroPed?.status || 'all';
  let filtrados = all;
  if (fLoja !== 'all') filtrados = filtrados.filter(p => p.lojaId === fLoja);
  if (fStatus !== 'all') filtrados = filtrados.filter(p => p.status === fStatus);

  const pend = all.filter(p => p.status === 'Pendente').length;
  const proc = all.filter(p => ['Aprovado','Em compra'].includes(p.status)).length;
  const entr = all.filter(p => p.status === 'Entregue').length;

  c.innerHTML = `
    <div class="page-header">
      <div>
        <h1 class="page-title">Pedidos das lojas</h1>
        <p class="page-sub">${all.length} pedido(s) no total</p>

      <div class="kpi-card"><div class="kpi-head"><span class="kpi-label">Em processo</span><div class="kpi-icon blue"><i data-lucide="loader"></i></div></div><div class="kpi-value">${proc}</div><div class="kpi-trend">aprovados / em compra</div></div>
      <div class="kpi-card"><div class="kpi-head"><span class="kpi-label">Entregues</span><div class="kpi-icon green"><i data-lucide="check-circle"></i></div></div><div class="kpi-value">${entr}</div><div class="kpi-trend">finalizados</div></div>
      <div class="kpi-card"><div class="kpi-head"><span class="kpi-label">Lojas ativas</span><div class="kpi-icon gold"><i data-lucide="store"></i></div></div><div class="kpi-value">${new Set(all.map(p=>p.lojaId)).size}</div><div class="kpi-trend">com pedidos</div></div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Todos os pedidos</div><div class="panel-sub">Acompanhe, mude status e responda às lojas</div></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select onchange="filtrarPed('loja',this.value)" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px">
            <option value="all">Todas as lojas</option>
            ${state.lojas.map(l=>`<option value="${l.id}" ${fLoja===l.id?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}
          </select>
          <select onchange="filtrarPed('status',this.value)" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:#fff;padding:6px 10px;border-radius:8px;font-size:12px">
            <option value="all">Todos os status</option>
            ${PEDIDO_STATUS.map(s=>`<option value="${s}" ${fStatus===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
      ${filtrados.length ? `<div class="pedidos-list">${filtrados.map(p=>renderPedidoGestao(p)).join('')}</div>`

function renderPedidoGestao(p) {

  return `<div class="pedido-card gestao">

      <div>
        <div class="pedido-loja-nome"><i data-lucide="store"></i> ${escapeHtml(p.lojaNome)} <span class="muted" style="font-weight:400">· ${escapeHtml(p.lojaLocal)}</span></div>
        <div class="pedido-meta-line">
          <span><i data-lucide="calendar"></i> ${fmt.date(p.data)}</span>
          <span><i data-lucide="user"></i> ${escapeHtml(p.solicitante)}</span>
        </div>
      </div>
      <span class="status-pill ${statusCls}">${p.status}</span>
    </div>
    <div class="pedido-itens">
      ${p.itens.map(it => `<div class="pedido-item-line"><span class="pedido-item-qtd">${it.quantidade}${it.unidade&&it.unidade!=='un'?' '+escapeHtml(it.unidade):''}</span><span>${escapeHtml(it.descricao)}</span></div>`).join('')}

function filtrarPed(campo, valor) {
  if (!state._filtroPed) state._filtroPed = {};
  state._filtroPed[campo] = valor;
  renderPedidosColab();
  setTimeout(()=>lucide.createIcons(),50);
}

async function mudarStatusPedido(id, novo) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p || p.status === novo) return;
  const antigo = p.status;
  p.status = novo;
  p.respondidoPor = state.user.name;
  p.historico = p.historico || [];
  p.historico.push({ at:new Date().toISOString(), by:state.user.name, action:`status: ${antigo} → ${novo}` });
  await Storage.set('solys:pedidos', state.pedidos);
  await pushLog('pedido-status', `${state.user.name}: pedido de ${p.lojaNome} ${antigo} → ${novo}`);
  toast('Status atualizado', `${p.lojaNome} → ${novo}`, 'success');
  updateBadges();
}

function responderPedido(id) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  openModal({
    title: `Responder ${p.lojaNome}`,
    body: `
      <div style="background:rgba(255,255,255,.03);padding:10px;border-radius:8px;margin-bottom:10px;font-size:12.5px">
        <strong>${escapeHtml(p.solicitante)}</strong> · ${fmt.date(p.data)}<br>
        <span class="muted">${p.itens.length} itens</span>
      </div>
      <label>Mensagem para a loja</label>
      <textarea id="pedResposta" rows="3" placeholder="Ex: aprovado, vamos entregar na quinta">${escapeHtml(p.respostaAdmin||'')}</textarea>
    `,
    actions: `<button class="btn ghost" onclick="closeModal()">Cancelar</button>
              <button class="btn gold" onclick="salvarRespostaPedido('${id}')">Salvar resposta</button>`,
  });
}
async function salvarRespostaPedido(id) {
  const p = state.pedidos.find(x => x.id === id);
  if (!p) return;
  p.respostaAdmin = document.getElementById('pedResposta').value.trim();
  p.respondidoPor = state.user.name;
  await Storage.set('solys:pedidos', state.pedidos);
  await pushLog('pedido-resp', `${state.user.name} respondeu pedido de ${p.lojaNome}`);
  closeModal();
  toast('Resposta enviada','','success');
  renderPedidosColab();
  setTimeout(()=>lucide.createIcons(),50);
}

async function exportPedidosXLSX() {
  if (!state.pedidos.length) { toast('Sem dados','Nenhum pedido para exportar','warning'); return; }
  const rows = [['DATA','LOJA','LOCALIDADE','SOLICITANTE','PRODUTO','QTD','UN','STATUS','OBSERVAÇÃO','RESPOSTA']];
  state.pedidos.forEach(p => {
    p.itens.forEach(it => {
      rows.push([fmt.date(p.data), p.lojaNome, p.lojaLocal, p.solicitante, it.descricao, it.quantidade, it.unidade||'un', p.status, p.observacao||'', p.respostaAdmin||'']);
    });
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Pedidos das lojas');
  XLSX.writeFile(wb, 'SOLYS_pedidos_lojas.xlsx');
  toast('Exportado','SOLYS_pedidos_lojas.xlsx','success');
}

function doSearch(q) {
  const el = document.getElementById('searchResults');
  if (!q.trim()) { el.innerHTML = '<div class="empty-state"><i data-lucide="search"></i><h3>Comece a digitar</h3><p>Os resultados aparecerão em tempo real.</p></div>'; lucide.createIcons(); return; }
  const ql = q.toLowerCase();
  const matchPurchases = state.purchases.filter(p => [p.codigo,p.descricao,p.fornecedor,p.setor,p.status,String(p.valor)].some(v=>v && String(v).toLowerCase().includes(ql))).slice(0,12);
  const matchRequests = state.requests.filter(r => [r.codigo,r.titulo,r.solicitante,r.setor,r.status].some(v=>v && String(v).toLowerCase().includes(ql))).slice(0,8);
  const matchDocs = state.documents.filter(d => d.name.toLowerCase().includes(ql)).slice(0,6);
  const matchLogs = state.logs.filter(l => (l.message||'').toLowerCase().includes(ql) || (l.by||'').toLowerCase().includes(ql)).slice(0,10);
  const total = matchPurchases.length + matchRequests.length + matchDocs.length + matchLogs.length;

  if (total === 0) { el.innerHTML = '<div class="empty-state"><i data-lucide="search-x"></i><h3>Nada encontrado</h3><p>Tente outra palavra-chave.</p></div>'; lucide.createIcons(); return; }

  el.innerHTML = `
    ${matchPurchases.length ? `<div style="margin-bottom:20px"><div class="nav-label" style="padding:0 0 8px">Compras (${matchPurchases.length})</div>${renderPurchaseTable(matchPurchases, true)}</div>` : ''}
    ${matchRequests.length ? `<div style="margin-bottom:20px"><div class="nav-label" style="padding:0 0 8px">Solicitações (${matchRequests.length})</div>
      <table class="data"><tbody>${matchRequests.map(r=>`<tr><td><code style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--gold-400)">${escapeHtml(r.codigo)}</code></td><td class="cell-strong">${escapeHtml(r.titulo)}</td><td><span class="chip">${escapeHtml(r.setor)}</span></td><td class="cell-money">${fmt.brl(r.valor||0)}</td><td><span class="status ${(r.status||'pendente').toLowerCase()}">${escapeHtml(r.status||'')}</span></td></tr>`).join('')}</tbody></table>
    </div>` : ''}
    ${matchDocs.length ? `<div style="margin-bottom:20px"><div class="nav-label" style="padding:0 0 8px">Documentos (${matchDocs.length})</div>
      <div style="display:flex;flex-direction:column;gap:6px">${matchDocs.map(d=>`<div style="display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.02);border-radius:8px"><i data-lucide="file" style="width:14px;height:14px;color:var(--gold-400)"></i><strong style="font-size:13px">${escapeHtml(d.name)}</strong><span class="muted" style="font-size:11.5px">· ${fmt.ago(d.at)}</span></div>`).join('')}</div>
    </div>` : ''}
    ${matchLogs.length ? `<div><div class="nav-label" style="padding:0 0 8px">Histórico (${matchLogs.length})</div>
      <div style="display:flex;flex-direction:column;gap:4px">${matchLogs.map(l=>`<div style="padding:8px 10px;background:rgba(255,255,255,.02);border-radius:8px;font-size:13px">${l.message} <span class="muted" style="font-size:11px;margin-left:8px">${fmt.ago(l.at)}</span></div>`).join('')}</div>
    </div>` : ''}
  `;
  lucide.createIcons();
}

              <td class="cell-mute">${fmt.date(u.createdAt)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function openUserModal() {
  showModal({
    title: 'Novo usuário',
    body: `
      <div class="form-grid">
        <div class="field full"><label>Nome</label><input id="u_name" /></div>
        <div class="field full"><label>E-mail</label><input id="u_email" type="email" /></div>
        <div class="field"><label>Senha</label><input id="u_pass" type="text" /></div>
        <div class="field"><label>Função</label><select id="u_role"><option>Administrador</option><option selected>Colaborador</option><option>Diretoria</option></select></div>
        <div class="field full"><label>Setor</label><select id="u_sector">${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select></div>
      </div>
    `,
    onConfirm: async () => {
      const name = document.getElementById('u_name').value.trim();
      const email = document.getElementById('u_email').value.trim();

      if (!name || !email || !pass) { toast('Preencha todos os campos','','warning'); return false; }

      const u = { id: uid(), name, email, pass, role: document.getElementById('u_role').value, sector: document.getElementById('u_sector').value, createdAt: new Date().toISOString() };
      state.users.push(u);
      await Storage.set('solys:users', state.users);
      await pushLog('create', `Usuário <strong>${name}</strong> cadastrado`, { email });

      renderUsuarios();

async function backupAll() {
  const data = {
    version:'1.0',
    exportedAt: new Date().toISOString(),
    exportedBy: state.user.name,
    purchases: state.purchases,
    requests: state.requests,
    documents: state.documents,
    logs: state.logs,
    users: state.users,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `solys-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  await pushLog('export', `Backup completo gerado`);
  toast('Backup gerado','Download iniciado','success');
}

async function restoreBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('Restaurar irá MESCLAR os dados do backup com os atuais (sem apagar). Confirma?')) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    // Merge: backup tem prioridade nos itens que não existem
    if (data.purchases) {
      data.purchases.forEach(p => {
        if (!state.purchases.find(x=>x.id===p.id || x._hash===p._hash)) state.purchases.unshift(p);
      });
      await Storage.set('solys:purchases', state.purchases);
    }
    if (data.requests) {
      data.requests.forEach(r => {
        if (!state.requests.find(x=>x.id===r.id)) state.requests.unshift(r);
      });
      await Storage.set('solys:requests', state.requests);
    }
    if (data.documents) {
      data.documents.forEach(d => {
        if (!state.documents.find(x=>x.id===d.id)) state.documents.unshift(d);
      });
      await Storage.set('solys:documents', state.documents);
    }
    await pushLog('import', `Backup restaurado a partir de <strong>${file.name}</strong>`);
    toast('Backup restaurado','Dados mesclados sem perda','success');
    renderConfig();
    updateBadges();
  } catch (e) {
    toast('Erro ao restaurar', e.message,'error');
  }
}

async function resetSystem() {
  if (!confirm('TEM CERTEZA? Isso apagará TODOS os dados. Esta ação é irreversível.')) return;
  if (!confirm('Última confirmação: apagar tudo?')) return;
  await Storage.del('solys:purchases');
  await Storage.del('solys:requests');
  await Storage.del('solys:documents');
  await Storage.del('solys:logs');
  await Storage.del('solys:purchases:arquivo');
  state.purchases = []; state.requests = []; state.documents = []; state.logs = [];
  toast('Sistema resetado','Recarregando...','warning');
  setTimeout(()=>location.reload(), 1500);
}

/* ----------------------------------------------------------------
   EXPORT
   ---------------------------------------------------------------- */
async function exportPurchasesXLSX() {
  const data = state.purchases.map(p => ({
    Código: p.codigo, Descrição: p.descricao, Fornecedor: p.fornecedor,
    Setor: p.setor, Data: p.data, Valor: parseFloat(p.valor)||0, Status: p.status,
    'Criado por': p.criadoPor||'—', 'Criado em': p.criadoEm
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Compras');
  XLSX.writeFile(wb, `solys-compras-${new Date().toISOString().slice(0,10)}.xlsx`);
  await pushLog('export', `Compras exportadas para Excel (${data.length} registros)`);
  toast('Excel gerado','Download iniciado','success');
}

async function exportPurchasesPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(18); doc.setTextColor(10,61,124);
  doc.text('SOLYS · Relatório de Compras', 14, 18);
  doc.setFontSize(10); doc.setTextColor(100);
  doc.text(`Gerado em ${fmt.datetime(new Date())} por ${state.user.name}`, 14, 25);
  doc.autoTable({
    startY: 32,
    head: [['Código','Descrição','Fornecedor','Setor','Data','Valor','Status']],
    body: state.purchases.map(p => [p.codigo, p.descricao, p.fornecedor, p.setor, fmt.date(p.data), fmt.brl(parseFloat(p.valor)||0), p.status]),
    styles:{ font:'helvetica', fontSize:8, cellPadding:2 },
    headStyles:{ fillColor:[10,61,124], textColor:255, fontSize:9 },
    alternateRowStyles:{ fillColor:[245,247,250] },
  });
  doc.save(`solys-compras-${new Date().toISOString().slice(0,10)}.pdf`);
  await pushLog('export', `Compras exportadas para PDF (${state.purchases.length} registros)`);
  toast('PDF gerado','Download iniciado','success');
}

async function exportLogsCSV() {
  const rows = [['Data','Usuário','Função','Ação','Mensagem']].concat(
    state.logs.map(l => [fmt.datetime(l.at), l.by, l.role||'', l.action, (l.message||'').replace(/<[^>]+>/g,'')])
  );
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], { type:'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `solys-historico-${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
  await pushLog('export','Histórico exportado para CSV');
  toast('CSV gerado','','success');
}

async function exportData() {
  // Atalho do topbar — exporta a página atual quando aplicável
  if (state.route === 'compras' || state.route === 'dashboard') return exportPurchasesXLSX();
  if (state.route === 'historico') return exportLogsCSV();
  toast('Exportar','Selecione uma página para exportar','info');
}

/* ----------------------------------------------------------------

   ---------------------------------------------------------------- */
function showModal({ title, body, onConfirm, confirmText = 'Confirmar', size = '' }) {
  const overlay = document.getElementById('modalOverlay');
  const container = document.getElementById('modalContainer');
  container.className = 'modal' + (size ? ' '+size : '');
  container.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${escapeHtml(title)}</div>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal()">Cancelar</button>
      <button class="btn gold" id="modalOk">${confirmText}</button>
    </div>
  `;
  overlay.classList.add('active');
  lucide.createIcons();
  document.getElementById('modalOk').onclick = async () => {
    const result = await onConfirm();
    if (result !== false) closeModal();
  };
}

// Variante com botões customizados (HTML) — usada pelos módulos Lojas e Colaborador
function openModal({ title, body, actions, size = '' }) {
  const overlay = document.getElementById('modalOverlay');
  const container = document.getElementById('modalContainer');
  container.className = 'modal' + (size ? ' '+size : '');
  container.innerHTML = `
    <div class="modal-head">
      <div class="modal-title">${escapeHtml(title)}</div>
      <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">${body}</div>
    <div class="modal-footer">${actions || ''}</div>
  `;
  overlay.classList.add('active');
  lucide.createIcons();
  // Foca primeiro input se houver
  setTimeout(() => {
    const first = container.querySelector('input[autofocus], input, textarea, select');
    if (first) first.focus();
  }, 50);
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

  showModal({

      <div style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto">

/* ----------------------------------------------------------------
   COMMAND PALETTE (Cmd+K)
   ---------------------------------------------------------------- */
function openCmdK() {
  document.getElementById('cmdkOverlay').classList.add('active');
  const inp = document.getElementById('cmdkInput');
  inp.value = ''; inp.focus();
  renderCmdK('');
}
function closeCmdK() { document.getElementById('cmdkOverlay').classList.remove('active'); }
function renderCmdK(q) {
  const ql = q.toLowerCase();
  const commands = [
    { icon:'layout-dashboard', label:'Ir para Dashboard', sub:'Visão geral', action:()=>{closeCmdK();navigate('dashboard')} },
    { icon:'shopping-cart', label:'Ir para Compras', sub:'Gestão de compras', action:()=>{closeCmdK();navigate('compras')} },
    { icon:'file-text', label:'Ir para Solicitações', sub:'Solicitações em andamento', action:()=>{closeCmdK();navigate('solicitacoes')} },
    { icon:'upload-cloud', label:'Importar planilha', sub:'Excel, CSV, PDF', action:()=>{closeCmdK();navigate('importar')} },
    { icon:'history', label:'Histórico', sub:'Timeline completa', action:()=>{closeCmdK();navigate('historico')} },
    { icon:'plus', label:'Nova compra', sub:'Cadastrar compra', action:()=>{closeCmdK();openPurchaseModal()} },
    { icon:'plus', label:'Nova solicitação', sub:'Cadastrar solicitação', action:()=>{closeCmdK();openRequestModal()} },
    { icon:'download', label:'Exportar compras (Excel)', sub:'.xlsx', action:()=>{closeCmdK();exportPurchasesXLSX()} },
    { icon:'log-out', label:'Sair', sub:'Encerrar sessão', action:()=>{closeCmdK();logout()} },
  ];
  const filtered = q ? commands.filter(c => c.label.toLowerCase().includes(ql) || c.sub.toLowerCase().includes(ql)) : commands;
  document.getElementById('cmdkList').innerHTML = filtered.map((c,i) => `
    <div class="cmdk-result ${i===0?'sel':''}" data-i="${i}">
      <div class="ic"><i data-lucide="${c.icon}"></i></div>
      <div class="txt"><strong>${escapeHtml(c.label)}</strong><small>${escapeHtml(c.sub)}</small></div>
      <span class="kbd">↵</span>
    </div>
  `).join('');
  lucide.createIcons();
  document.querySelectorAll('.cmdk-result').forEach((el,i) => {
    el.addEventListener('click', () => filtered[i].action());
  });
  // Stash atual
  state._cmdkFiltered = filtered;
}

/* ----------------------------------------------------------------
   EVENT BINDINGS
   ---------------------------------------------------------------- */
document.addEventListener('DOMContentLoaded', () => {
  // Sidebar nav
  document.getElementById('nav').addEventListener('click', e => {
    const item = e.target.closest('.nav-item');
    if (item) navigate(item.dataset.route);
  });

  // Modal overlay click
  document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target.id === 'modalOverlay') closeModal();
  });

  // Cmd+K (somente gestão; colaborador/loja não usa)
  document.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      if (state.user && state.user.role !== 'Colaborador') openCmdK();
    }
    if (e.key === 'Escape') { closeCmdK(); closeModal(); }
  });
  document.getElementById('cmdkInput').addEventListener('input', e => renderCmdK(e.target.value));
  document.getElementById('cmdkInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const f = state._cmdkFiltered;
      if (f && f.length) f[0].action();
    }
  });
  document.getElementById('cmdkOverlay').addEventListener('click', e => {
    if (e.target.id === 'cmdkOverlay') closeCmdK();
  });

  // Global search
  document.getElementById('globalSearch').addEventListener('focus', () => openCmdK());

  // Init
  initAuth().then(() => lucide.createIcons());
});
